enable-module-update = false
parallel-jobs = 1

[LINE-Andrew]
app-name = "LINE"
patches-source = "andrewliang25/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Andrew"
build-mode = "module"
version = "26.11.0"
arch = "arm64-v8a"
include-stock = "auto"
excluded-patches = """\
  'Hide Wallet tab' \
  'Hide Transfer button' \
  'Keep chats unread' \
  'Hide community button' \
  'Fix push notifications' \
  'Fix chat backup sign-in via GmsCore' \
  """
archive-dlurl = "https://archive.org/download/andrews-apks/apks/jp.naver.line.android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/line-corporation/line"
uptodown-dlurl = "https://line.en.uptodown.com/android"

# iQOO 12 Pro non-root build. Keep the official com.instagram.android package.
# Piko 3.9.0 targets 439.0.0.37.89. Keep the Release 6 feature set unchanged;
# Add settings + Unlock developer options expose MetaConfig/QE diagnostics.
# Validate links handles the signature check for external link routing on the
# re-signed APK, so instagram.com post/reel links do not fall back to Home.
[Instagram-Piko]
app-name = "Instagram"
patches-source = "crimera/piko"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Piko"
build-mode = "apk"
version = "439.0.0.37.89"
arch = "arm64-v8a"
exclusive-patches = true
included-patches = """\
  'Disable ads' \
  'Copy comment' \
  'Improve image viewing' \
  'Hide suggested content' \
  'Limit feed to following profiles' \
  'Disable screenshot detection' \
  'View DMs anonymously' \
  'View stories anonymously' \
  'View live anonymously' \
  'Save deleted messages' \
  'Make ephemeral media permanent' \
  'Unlock Plus benefits' \
  'Add settings' \
  'Unlock developer options' \
  'Validate links' \
  """
archive-dlurl = "https://archive.org/download/andrews-apks/apks/com.instagram.android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram/"
uptodown-dlurl = "https://instagram.en.uptodown.com/android"

# Keep com.instagram.barcelona. Some chat apps target the official Threads package
# explicitly; Andrew's normal clone package can therefore fail while generic browser
# links still work. Only the ad/AD_ID patches are wanted here.
[Threads-Chiggi]
app-name = "Threads"
patches-source = "durgesh0505/chiggi_morphe_patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Chiggi"
build-mode = "apk"
version = "434.0.0.41.74"
arch = "arm64-v8a"
include-stock = "auto"
excluded-patches = """\
  'Change app name' \
  'Change package name' \
  """
archive-dlurl = "https://archive.org/download/andrews-apks/apks/com.instagram.barcelona"
apkmirror-dlurl = "https://www.apkmirror.com/apk/meta-platforms-inc/threads-instagram/"
uptodown-dlurl = "https://threads.en.uptodown.com/android"
