name: IG HDR Manifest Summary A04

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-manifest-summary-a04.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
      - name: Extract HeroExoPlayer2InitHelper A04
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/dex work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          sudo apt-get update -qq && sudo apt-get install -y -qq smali
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          FOUND=''
          for d in work/dex/classes*.dex; do
            b=$(basename "$d" .dex)
            if strings "$d" | grep -q 'HeroExoPlayer2InitHelper'; then
              rm -rf work/smali/*
              baksmali d "$d" -o work/smali
              p=work/smali/com/facebook/video/heroplayer/service/heroexoplayer2/HeroExoPlayer2InitHelper.smali
              if [ -f "$p" ]; then FOUND="$p"; break; fi
            fi
          done
          test -n "$FOUND"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/smali/com/facebook/video/heroplayer/service/heroexoplayer2/HeroExoPlayer2InitHelper.smali')
          ls=p.read_text(errors='replace').splitlines()
          out=[]
          for i,l in enumerate(ls):
              if l.startswith('.method') and ' A04(' in l:
                  e=next(j for j in range(i+1,len(ls)) if ls[j].strip()=='.end method')
                  out=ls[i:e+1]; break
          if not out: raise SystemExit('A04 not found')
          Path('research/generated/instagram_439_manifest_summary_A04.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_manifest_summary_A04.txt
          git commit -m 'Inspect Instagram manifest summary serializer' || true
          git pull --rebase origin main
          git push origin HEAD:main
