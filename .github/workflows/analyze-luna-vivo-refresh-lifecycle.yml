name: Analyze Luna Vivo refresh lifecycle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-luna-vivo-refresh-lifecycle.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/checkout@v4
      - name: Decode official Luna smali
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/out work/tools
          UA='Mozilla/5.0 (Linux; Android 16; V2329A) AppleWebKit/537.36 Chrome/143 Mobile Safari/537.36'
          curl -L --retry 3 --connect-timeout 15 --max-time 240 -A "$UA" 'https://ugapk.com/GMg3' -o work/Luna_official.apk
          test "$(head -c 4 work/Luna_official.apk | xxd -p)" = '504b0304'
          sha256sum work/Luna_official.apk | tee work/out/apk.sha256
          curl -L --fail --retry 3 -o work/tools/apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          java -jar work/tools/apktool.jar d -f -r work/Luna_official.apk -o work/decoded

      - name: Extract refresh lifecycle
        shell: bash
        run: |
          set -euxo pipefail
          D=work/decoded
          O=work/out
          : > "$O/files.txt"
          find "$D" -type f -name '*.smali' | grep -E '/com/luna/biz/playing/player/remote/control/(CoreRemoteControl|VivoOriginRemoteControl|VivoOriginRemoteControl\$mPlayerListener\$1|RemoteControl|RemoteControlContext|IRemoteControlAdapter).*\.smali$' | sort -u | tee "$O/files.txt"
          : > "$O/full-context.txt"
          while IFS= read -r f; do
            echo "===== $f =====" >> "$O/full-context.txt"
            cat "$f" >> "$O/full-context.txt"
          done < "$O/files.txt"

          grep -RIn --include='*.smali' -E 'implements Lcom/luna/biz/playing/player/remote/control/IRemoteControlAdapter;|->update\(Lcom/luna/biz/playing/player/remote/control/RemoteControlContext;Landroid/support/v4/media/MediaMetadataCompat\$Builder;\)|setMetadata\(Landroid/support/v4/media/MediaMetadataCompat;\)|new-instance .*RemoteControlContext|VivoOriginRemoteControl\$mPlayerListener\$1' "$D" | tee "$O/lifecycle-hits.txt" || true

          cut -d: -f1 "$O/lifecycle-hits.txt" | sort -u | while IFS= read -r f; do
            [ -f "$f" ] || continue
            echo "===== $f =====" >> "$O/hit-context.txt"
            grep -n -A140 -B140 -E 'IRemoteControlAdapter|->update\(Lcom/luna/biz/playing/player/remote/control/RemoteControlContext;|setMetadata\(Landroid/support/v4/media/MediaMetadataCompat;\)|RemoteControlContext|VivoOriginRemoteControl\$mPlayerListener\$1' "$f" >> "$O/hit-context.txt" || true
          done

      - name: Upload lifecycle RE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-vivo-refresh-lifecycle
          path: work/out
          retention-days: 7
