name: Analyze YT Music real queue bridge candidates

on:
  push:
    paths:
      - .github/workflows/analyze-ytmusic-real-queue-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download validated Luna base and apktool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input tools out
          gh release download ytmusic-originplayer-luna-33729902415 --pattern '*.apk' --dir input
          mv input/*.apk input/base.apk
          curl -L --fail --retry 3 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          sha256sum input/base.apk | tee out/base-sha256.txt

      - name: Decode and locate queue/session/browser/v3 hooks
        shell: bash
        run: |
          set -euo pipefail
          java -jar tools/apktool.jar d -f input/base.apk -o decoded

          BROWSER=$(find decoded -type f -path '*/com/google/android/apps/youtube/music/mediabrowser/MusicBrowserService.smali' -print -quit)
          ID=$(find decoded -type f -name 'id.smali' -print | while read f; do grep -q 'onPlayFromMediaId(Ljava/lang/String;Landroid/os/Bundle;)V' "$f" && echo "$f" && break; done)
          II=$(find decoded -type f -name 'ii.smali' -print | while read f; do grep -q 'setPlaybackState(Landroid/media/session/PlaybackState;)V' "$f" && grep -q 'setMetadata(Landroid/media/MediaMetadata;)V' "$f" && echo "$f" && break; done)
          test -n "$BROWSER"
          test -n "$ID"
          test -n "$II"
          cp "$BROWSER" out/MusicBrowserService.smali
          cp "$ID" out/id.smali
          cp "$II" out/ii.smali

          {
            echo '=== selection exact callbacks ==='
            grep -n -A100 -B16 'onPlayFromMediaId(Ljava/lang/String;Landroid/os/Bundle;)V' "$ID" || true
            grep -n -A100 -B16 'onSkipToQueueItem(J)V' "$ID" || true
            echo
            echo '=== callback class fields/super ==='
            sed -n '1,180p' "$ID" || true
            echo
            echo '=== ii playback state sink ==='
            grep -n -A420 -B30 '^\.method public final n(Landroid/support/v4/media/session/PlaybackStateCompat;)V' "$II" || true
            echo
            echo '=== ii metadata sink ==='
            grep -n -A420 -B30 '^\.method public final m(Landroid/support/v4/media/MediaMetadataCompat;)V' "$II" || true
            echo
            echo '=== duration references ==='
            grep -RniF 'android.media.metadata.DURATION' decoded/smali* 2>/dev/null | head -n 1200 || true
            echo
            echo '=== playback-state construction refs ==='
            grep -RniE 'PlaybackStateCompat\$Builder|setState\(IJFJ\)|setActiveQueueItemId|setPlaybackState' decoded/smali* 2>/dev/null | head -n 2500 || true
            echo
            echo '=== metadata duration builder refs ==='
            grep -RniE 'android.media.metadata.DURATION|MediaMetadataCompat\$Builder' decoded/smali* 2>/dev/null | head -n 2500 || true
          } > out/v3-selection-time-inspection.txt

          grep -RlF 'android.media.metadata.DURATION' decoded/smali* 2>/dev/null | head -n 200 > out/duration-class-files.txt || true
          mkdir -p out/duration_classes
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            cp "$f" "out/duration_classes/$(echo "$f" | tr '/' '_')"
          done < out/duration-class-files.txt

          grep -RlE 'onPlayFromMediaId\(Ljava/lang/String;Landroid/os/Bundle;\)V|onSkipToQueueItem\(J\)V' decoded/smali* 2>/dev/null | head -n 200 > out/selection-class-files.txt || true
          mkdir -p out/selection_classes
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            cp "$f" "out/selection_classes/$(echo "$f" | tr '/' '_')"
          done < out/selection-class-files.txt

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: ytmusic-real-queue-bridge-analysis
          path: out/
          if-no-files-found: error
          retention-days: 14
