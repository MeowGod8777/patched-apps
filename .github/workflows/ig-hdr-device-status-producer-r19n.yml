name: IG 439 HDR Device Status Producer R19n

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ig-hdr-device-status-producer-r19n.yml]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Locate and disassemble exact DeviceStatus classes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          targets=['LX/06Nk;','LX/06Kl;','LX/02xX;']
          owners={t:[] for t in targets}
          for d in sorted(Path('work/apk').glob('classes*.dex')):
              r=subprocess.run(['java','-jar','work/baksmali-3.0.10-fat.jar','list','classes',str(d)],capture_output=True,text=True,errors='replace')
              s=set(r.stdout.splitlines())
              for t in targets:
                  if t in s: owners[t].append(d.name)
          ds=sorted({d for a in owners.values() for d in a})
          Path('work/hitdex.txt').write_text('\n'.join(ds)+'\n')
          print(owners)
          PY
          while read d; do
            [ -n "$d" ] || continue
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/${d%.dex}" >/dev/null &
          done < work/hitdex.txt
          wait
      - name: Extract producer fields and callers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          R=Path('work/smali'); targets={'LX/06Nk;','LX/06Kl;','LX/02xX;'}
          clsre=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          methods=[]; files={}
          for p in R.rglob('*.smali'):
            ls=p.read_text(errors='replace').splitlines(); cls='?'
            for x in ls[:60]:
              m=clsre.match(x)
              if m: cls=m.group(1); break
            files[cls]=(p,ls)
            i=0
            while i<len(ls):
              if not ls[i].startswith('.method'): i+=1; continue
              s=i; sig=ls[i]; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              methods.append((cls,sig,p,ls[s:min(i+1,len(ls))])); i+=1
          O=['Instagram 439 HDR Reels device_status producer R19n','=============================================','']
          for cls in targets:
            if cls in files:
              p,ls=files[cls]; O += [f'===== CLASS {cls} FILE={p} =====']+ls+['']
          # Direct callers of producer and assignments to 06Nk.A01/A02.
          needles=['LX/06Nk;->A01','LX/06Nk;->A02','LX/06Kl;-><init>','LX/02xX;->A00']
          O += ['===== PRODUCER / FLAG XREFS =====']
          for cls,sig,p,b in methods:
            text='\n'.join(b)
            hits=[n for n in needles if n in text]
            if not hits: continue
            vals=[]
            for x in b:
              m=re.search(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',x)
              if m: vals.append(m.group(1))
            O += [f'--- {cls} {sig} FILE={p} HITS={hits}',f'STRINGS={vals}']
            for i,x in enumerate(b):
              if any(n in x for n in hits): O += b[max(0,i-90):min(len(b),i+120)]
            O += ['']
          # Highlight semantic content strings from 06Kl.
          if 'LX/06Kl;' in files:
            p,ls=files['LX/06Kl;']
            vals=[]
            for x in ls:
              m=re.search(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',x)
              if m: vals.append(m.group(1))
            O += ['===== 06Kl STRING LITERALS =====']+vals+['']
          out=Path('research/generated/instagram_439_hdr_device_status_producer_r19n.txt')
          out.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:15000])); print('bytes',out.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_device_status_producer_r19n.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Reels device_status producer trace R19n'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
