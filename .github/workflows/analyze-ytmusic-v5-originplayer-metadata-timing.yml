name: Inspect YT Music V5 OriginPlayer metadata timing

# Static RE only. No APK is built or modified.
on:
  push:
    paths:
      - .github/workflows/analyze-ytmusic-v5-originplayer-metadata-timing.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  V2_ARTIFACT_ID: '9896185089'
  V2_SHA256: '639a99a109ea853eda2c53238626d4caab45b410dccfe968cd3f04685d151715'
  V5_ARTIFACT_ID: '9919920481'
  V5_SHA256: '5f8d786b794f96049911323ecba6f7e68d0cd2133e2a11dfcf8bff151c25c02a'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download exact runtime V2 and V5 artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/v2 input/v5 out tools
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V2_ARTIFACT_ID}/zip" > input/v2.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V5_ARTIFACT_ID}/zip" > input/v5.zip
          unzip -q input/v2.zip -d input/v2
          unzip -q input/v5.zip -d input/v5
          V2APK=$(find input/v2 -type f -name '*.apk' -print -quit)
          V5APK=$(find input/v5 -type f -name '*.apk' -print -quit)
          test -n "$V2APK" && test -n "$V5APK"
          cp "$V2APK" input/v2.apk
          cp "$V5APK" input/v5.apk
          V2ACTUAL=$(sha256sum input/v2.apk | awk '{print $1}')
          V5ACTUAL=$(sha256sum input/v5.apk | awk '{print $1}')
          printf 'V2 %s\nV5 %s\n' "$V2ACTUAL" "$V5ACTUAL" | tee out/runtime-apk-sha256.txt
          test "$V2ACTUAL" = "$V2_SHA256"
          test "$V5ACTUAL" = "$V5_SHA256"

      - name: Decode and exact V2-V5 diff
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar tools/apktool.jar d -f input/v2.apk -o decoded-v2 >/dev/null
          java -jar tools/apktool.jar d -f input/v5.apk -o decoded-v5 >/dev/null
          find decoded-v2 -type f -name '*.smali' | sed 's#^decoded-v2/##' | sort > out/v2-smali-files.txt
          find decoded-v5 -type f -name '*.smali' | sed 's#^decoded-v5/##' | sort > out/v5-smali-files.txt
          comm -3 out/v2-smali-files.txt out/v5-smali-files.txt > out/smali-file-presence-diff.txt || true
          : > out/changed-smali.txt
          while IFS= read -r rel; do
            [ -f "decoded-v5/$rel" ] || continue
            if ! cmp -s "decoded-v2/$rel" "decoded-v5/$rel"; then echo "$rel" >> out/changed-smali.txt; fi
          done < out/v2-smali-files.txt
          : > out/changed-smali-unified.diff
          while IFS= read -r rel; do
            echo "===== $rel =====" >> out/changed-smali-unified.diff
            diff -u "decoded-v2/$rel" "decoded-v5/$rel" >> out/changed-smali-unified.diff || true
          done < out/changed-smali.txt
          sha256sum decoded-v2/smali*/id.smali decoded-v5/smali*/id.smali 2>/dev/null | tee out/id-sha256.txt || true
          sha256sum decoded-v2/smali*/lag.smali decoded-v5/smali*/lag.smali 2>/dev/null | tee out/lag-sha256.txt || true
          sha256sum decoded-v2/smali*/ii.smali decoded-v5/smali*/ii.smali 2>/dev/null | tee out/ii-sha256.txt || true

      - name: Inspect MediaSession metadata and playback state publication
        shell: bash
        run: |
          set -euo pipefail
          : > out/mediasession-metadata-hits.txt
          for root in decoded-v2 decoded-v5; do
            echo "===== $root =====" >> out/mediasession-metadata-hits.txt
            grep -RniE 'MediaMetadataCompat|MediaMetadata;|METADATA_KEY_(TITLE|ARTIST|ALBUM|DURATION|MEDIA_ID)|android\.media\.metadata\.(TITLE|ARTIST|ALBUM|DURATION|MEDIA_ID)|setMetadata|setPlaybackState|PlaybackStateCompat|PlaybackState;|getCurrentPosition|setState\(' "$root"/smali* 2>/dev/null | head -10000 >> out/mediasession-metadata-hits.txt || true
          done
          : > out/metadata-publisher-classes.txt
          for root in decoded-v2 decoded-v5; do
            grep -RIlE 'MediaSessionCompat;->setMetadata|MediaSession;->setMetadata|android\.media\.metadata\.TITLE|METADATA_KEY_TITLE|android\.media\.metadata\.DURATION|METADATA_KEY_DURATION' "$root"/smali* 2>/dev/null | sort -u | while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "===== $f =====" >> out/metadata-publisher-classes.txt
              cat "$f" >> out/metadata-publisher-classes.txt
            done
          done

      - name: Inspect Vivo c0 support_event metadata timing contract in YT Music
        shell: bash
        run: |
          set -euo pipefail
          : > out/vivo-c0-contract-hits.txt
          for root in decoded-v2 decoded-v5; do
            echo "===== $root =====" >> out/vivo-c0-contract-hits.txt
            grep -RniE 'vivomusicmix|com_vivo_music_widget_backend_url|support_event|duration|position|mediaid|media_id|current_position|currentPosition|EXTRA_DURATION|METADATA_KEY_DURATION' "$root"/smali* 2>/dev/null | head -20000 >> out/vivo-c0-contract-hits.txt || true
          done
          for root in decoded-v2 decoded-v5; do
            II=$(find "$root" -type f -name ii.smali -print -quit || true)
            if [ -n "$II" ]; then cp "$II" "out/${root}-ii.smali"; fi
          done
          : > out/ii-call-contexts.txt
          for root in decoded-v2 decoded-v5; do
            grep -RniE 'Lii;->[a-zA-Z].*\(' "$root"/smali* 2>/dev/null | head -5000 | while IFS=: read -r f n rest; do
              [ -n "$f" ] || continue
              start=$(( n > 80 ? n-80 : 1 )); end=$(( n+160 ))
              echo "===== $root :: $f:$n =====" >> out/ii-call-contexts.txt
              sed -n "${start},${end}p" "$f" >> out/ii-call-contexts.txt
            done
          done

      - name: Inspect changed classes for possible main-card side effects
        shell: bash
        run: |
          set -euo pipefail
          : > out/changed-class-main-card-markers.txt
          while IFS= read -r rel; do
            [ -f "decoded-v5/$rel" ] || continue
            if grep -qiE 'MediaSession|MediaMetadata|PlaybackState|setMetadata|setPlaybackState|vivomusicmix|support_event|duration|position|title|artist' "decoded-v5/$rel"; then
              echo "===== $rel =====" >> out/changed-class-main-card-markers.txt
              grep -niE 'MediaSession|MediaMetadata|PlaybackState|setMetadata|setPlaybackState|vivomusicmix|support_event|duration|position|title|artist' "decoded-v5/$rel" >> out/changed-class-main-card-markers.txt || true
            fi
          done < out/changed-smali.txt
          diff -u decoded-v2/AndroidManifest.xml decoded-v5/AndroidManifest.xml > out/manifest.diff || true

      - name: Upload metadata timing inspection
        uses: actions/upload-artifact@v4
        with:
          name: ytmusic-v2-v5-originplayer-metadata-timing
          path: out/
          if-no-files-found: error
          retention-days: 14
