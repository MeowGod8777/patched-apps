name: Build YT Music V5 Vivo media identity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ytmusic-luna-vivo-v5-media-identity.yml'
      - 'tools/ytmusic_vivo_c0_v5_media_identity.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact validated Luna base and tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p input tools out
          gh release download ytmusic-originplayer-luna-33729902415 --pattern '*.apk' --dir input
          mv input/*.apk input/base.apk
          BASE_SHA=$(sha256sum input/base.apk | awk '{print $1}')
          echo "base_sha256=$BASE_SHA" | tee out/input-sha256.txt
          test "$BASE_SHA" = '0b1b61ad6bd87dacc88517adf19c1115085d529e63847d50d587476efa4ce307'
          curl -L --fail --retry 3 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -L --fail --retry 3 -o tools/bcprov.jar https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.82/bcprov-jdk18on-1.82.jar

      - name: Decode, snapshot guards, and apply identity patch
        shell: bash
        run: |
          set -euxo pipefail
          java -jar tools/apktool.jar d -f input/base.apk -o decoded
          ID=$(grep -Rl 'onPlayFromMediaId(Ljava/lang/String;Landroid/os/Bundle;)V' decoded/smali*/id.smali | head -n1)
          LAG=$(grep -Rl '^\.method public final g(Ljava/lang/String;Landroid/os/Bundle;)V' decoded/smali*/lag.smali | head -n1)
          II=$(grep -Rl '^\.method public final m(Landroid/support/v4/media/MediaMetadataCompat;)V' decoded/smali*/ii.smali | head -n1)
          test -n "$ID"; test -n "$LAG"; test -n "$II"
          cp "$ID" out/base-id.smali
          cp "$LAG" out/base-lag.smali

          python3 tools/ytmusic_vivo_c0_v5_media_identity.py decoded | tee out/patcher.txt

          ID2=$(grep -Rl 'onPlayFromMediaId(Ljava/lang/String;Landroid/os/Bundle;)V' decoded/smali*/id.smali | head -n1)
          LAG2=$(grep -Rl '^\.method public final g(Ljava/lang/String;Landroid/os/Bundle;)V' decoded/smali*/lag.smali | head -n1)
          II2=$(grep -Rl 'VivoMediaIdentity;->apply' decoded/smali*/ii.smali | head -n1)
          KYI=$(grep -Rl '^\.method public final j()V' decoded/smali*/kyi.smali | head -n1)
          BROWSER=$(find decoded -type f -path '*/com/google/android/apps/youtube/music/mediabrowser/MusicBrowserService.smali' -print -quit)
          HELPER=$(find decoded -type f -path '*/com/google/android/apps/youtube/music/mediabrowser/VivoMediaIdentity.smali' -print -quit)
          test -n "$ID2"; test -n "$LAG2"; test -n "$II2"; test -n "$KYI"; test -n "$BROWSER"; test -n "$HELPER"

          cmp -s out/base-id.smali "$ID2"
          echo 'PASS: Lid byte-for-byte unchanged' | tee out/lid-guard.txt
          cmp -s out/base-lag.smali "$LAG2"
          echo 'PASS: Llag byte-for-byte unchanged' | tee out/lag-guard.txt

          python3 - "$KYI" "$II2" "$HELPER" "$BROWSER" <<'PY' | tee out/identity-guards.txt
          from pathlib import Path
          import re,sys
          kyi,ii,helper,browser=map(lambda x:Path(x).read_text(),sys.argv[1:])
          jm=re.search(r'(?ms)^\.method public final j\(\)V\n.*?^\.end method',kyi); assert jm
          j=jm.group(0)
          assert j.count('Lnoq;->n()Lazmi;')==1
          assert j.count('Lazmi;->b:Lboht;')==1
          assert j.count('Llgl;->d(Lboht;)Ljava/lang/String;')==1
          assert 'Lnoq;->o()Lboht;' not in j
          assert 'Lnoq;->p()Lboht;' not in j
          assert 'field public static volatile vivoNativeIds:Ljava/util/concurrent/ConcurrentHashMap;' in browser
          assert ii.count('vivomusicmix.media.metadata.support_event')==1
          assert 'const-wide/16 v4, 0x9df' in ii
          assert ii.count('VivoMediaIdentity;->onState')==1
          assert ii.count('VivoMediaIdentity;->apply')==1
          assert helper.count('android.media.metadata.MEDIA_ID')==1
          assert 'PlaybackStateCompat;->j:J' in helper
          assert 'MusicBrowserService;->vivoNativeIds:Ljava/util/concurrent/ConcurrentHashMap;' in helper
          assert 'MediaMetadata$Builder;->putString(Ljava/lang/String;Ljava/lang/String;)' in helper
          assert 'setPlaybackState' not in helper and 'setMetadata' not in helper
          print('PASS: exact V5 n()->Lazmi.b selection preserved')
          print('PASS: 0x9DF preserved')
          print('PASS: activeQueueId -> vivoNativeIds -> MEDIA_ID identity only')
          PY

          ! grep -R -q 'YTM_C0TRACE' decoded/smali*
          ! grep -R -q 'VivoC0Trace;' decoded/smali*
          ! grep -q 'Long;->parseLong(Ljava/lang/String;)J' "$ID2"
          ! grep -q 'vivo_qid_' "$ID2"
          grep -n -A80 -B20 'VivoMediaIdentity;->onState' "$II2" | tee out/state-hook-context.txt
          grep -n -A50 -B25 'VivoMediaIdentity;->apply' "$II2" | tee out/metadata-hook-context.txt
          cat "$HELPER" > out/VivoMediaIdentity.smali

      - name: Rebuild and 16K align
        shell: bash
        run: |
          set -euxo pipefail
          java -jar tools/apktool.jar b decoded -o out/unsigned.apk
          BT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -P 16 -f 4 out/unsigned.apk out/aligned.apk
          "$BT/zipalign" -c -P 16 -v 4 out/aligned.apk | tee out/zipalign-before-sign.txt

      - name: Sign and mandatory verification
        shell: bash
        run: |
          set -euxo pipefail
          norm() { tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'; }
          BASE_CERT=$(java -jar bin/apksigner.jar verify --print-certs input/base.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | norm)
          BKS_CERT=$(keytool -list -v -keystore ks.keystore -storetype BKS -storepass 123456789 -alias andrewliang -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider -providerpath tools/bcprov.jar | sed -n 's/^[[:space:]]*SHA256: //p' | norm)
          echo "base=$BASE_CERT" | tee out/cert.txt
          echo "bks=$BKS_CERT" | tee -a out/cert.txt
          test "$BASE_CERT" = '7762ee243d1157ef3d6de884690ff70a385fc251fe8f491eb6c71f6a8e392e2c'
          test "$BASE_CERT" = "$BKS_CERT"
          keytool -importkeystore -srckeystore ks.keystore -srcstoretype BKS -srcstorepass 123456789 -srcalias andrewliang -srckeypass 123456789 -destkeystore out/signer.p12 -deststoretype PKCS12 -deststorepass 123456789 -destkeypass 123456789 -destalias andrewliang -noprompt -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider -providerpath tools/bcprov.jar
          APK=out/YouTube_Music_9.15.51_Luna_VIVO_C0_V5_MEDIA_IDENTITY.apk
          java -jar bin/apksigner.jar sign --ks out/signer.p12 --ks-type PKCS12 --ks-pass pass:123456789 --key-pass pass:123456789 --ks-key-alias andrewliang --out "$APK" out/aligned.apk
          rm -f out/*.idsig
          java -jar bin/apksigner.jar verify --verbose --print-certs "$APK" | tee out/signature-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' out/signature-verify.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' out/signature-verify.txt
          OUT_CERT=$(java -jar bin/apksigner.jar verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | norm)
          test "$OUT_CERT" = "$BASE_CERT"
          BT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tee out/zipalign-final.txt
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "$SHA  $APK" | tee out/SHA256.txt
          echo "APK_SHA=$SHA" >> "$GITHUB_ENV"
          python3 - <<'PY' | tee out/native-libs.txt
          import zipfile
          apk='out/YouTube_Music_9.15.51_Luna_VIVO_C0_V5_MEDIA_IDENTITY.apk'
          with zipfile.ZipFile(apk) as z:
              libs=[i for i in z.infolist() if i.filename.startswith('lib/arm64-v8a/') and i.filename.endswith('.so')]
              print('arm64_so_count=',len(libs))
              for i in libs: print(i.filename,'compress_type=',i.compress_type,'size=',i.file_size)
              assert len(libs)==21
              assert all(i.compress_type==zipfile.ZIP_STORED for i in libs)
          PY

      - name: Static package and manifest verification
        shell: bash
        run: |
          set -euxo pipefail
          APK=out/YouTube_Music_9.15.51_Luna_VIVO_C0_V5_MEDIA_IDENTITY.apk
          BT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK" | tee out/badging.txt
          grep -q "package: name='com.luna.music'" out/badging.txt
          grep -q "versionName='9.15.51'" out/badging.txt
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | tee out/manifest-xmltree.txt
          grep -q 'com.vivo.musicwidgetmix.support.service' out/manifest-xmltree.txt
          grep -q 'com.google.android.apps.youtube.music.mediabrowser.MusicBrowserService' out/manifest-xmltree.txt

      - name: Upload candidate and evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ytmusic-luna-vivo-v5-media-identity
          path: |
            out/YouTube_Music_9.15.51_Luna_VIVO_C0_V5_MEDIA_IDENTITY.apk
            out/SHA256.txt
            out/input-sha256.txt
            out/cert.txt
            out/signature-verify.txt
            out/zipalign-before-sign.txt
            out/zipalign-final.txt
            out/native-libs.txt
            out/badging.txt
            out/manifest-xmltree.txt
            out/patcher.txt
            out/lid-guard.txt
            out/lag-guard.txt
            out/identity-guards.txt
            out/state-hook-context.txt
            out/metadata-hook-context.txt
            out/VivoMediaIdentity.smali
          if-no-files-found: error
          retention-days: 14

      - name: Commit build-success checkpoint
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: bash
        run: |
          set -euxo pipefail
          FILE=IQOO12PRO_YTMUSIC_V5_MEDIA_IDENTITY_BUILD_SUCCESS_CHECKPOINT_2026-09-04.md
          cat > "$FILE" <<EOF
          # iQOO 12 Pro / OriginOS 6 — YT Music V5 media-identity build-success checkpoint

          Date: 2026-09-04

          - APK: \`YouTube_Music_9.15.51_Luna_VIVO_C0_V5_MEDIA_IDENTITY.apk\`
          - Workflow: \`Build YT Music V5 Vivo media identity\`
          - Run: \`${RUN_ID}\`
          - Artifact: \`${ARTIFACT_ID}\`
          - Artifact URL: \`${ARTIFACT_URL}\`
          - APK SHA256: \`${APK_SHA}\`
          - Base SHA256: \`0b1b61ad6bd87dacc88517adf19c1115085d529e63847d50d587476efa4ce307\`
          - Signer SHA256: \`7762ee243d1157ef3d6de884690ff70a385fc251fe8f491eb6c71f6a8e392e2c\`

          ## Functional delta over V5 + 0x9DF

          Official Luna identity join is verified: current-list MediaItem ID, selection ID and metadata MEDIA_ID all use the same playable ID.

          This candidate observes the already-published PlaybackState activeQueueId, resolves it through the existing V5 \`vivoNativeIds\` sidecar, and publishes only the matching \`android.media.metadata.MEDIA_ID\` at the framework metadata builder. TITLE/ARTIST/DURATION/position are not fabricated or altered.

          ## Mandatory verification

          - exact validated base: PASS
          - V5 n()->Lazmi.b playable selection: PASS
          - rejected o()/p() endpoints absent: PASS
          - Lid byte-for-byte unchanged: PASS
          - Llag byte-for-byte unchanged: PASS
          - support_event=0x9DF retained: PASS
          - activeQueueId -> vivoNativeIds -> MEDIA_ID identity guard: PASS
          - v2/v3 signatures: PASS
          - signer identical: PASS
          - zipalign -P16: PASS
          - 21 arm64 libraries stored: PASS
          - package/version/manifest: PASS
          EOF
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$FILE"
          git commit -m 'Checkpoint YT Music V5 media identity build success'
          git push
