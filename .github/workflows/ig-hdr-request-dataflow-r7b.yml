name: IG 439 HDR Request Dataflow R7b

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-request-dataflow-r7b.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download exact APK and dexdump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do
            b="$(basename "$d" .dex)"
            "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
          done
      - name: Fast exact trace
        run: |
          set -euo pipefail
          REPORT=research/generated/instagram_439_hdr_request_dataflow_r7b.txt
          {
            echo 'Instagram 439 HDR request dataflow R7b'
            echo '========================================='
            echo
            echo '===== EXACT HDR STRING OWNERS ====='
            for s in display_hdr_supported supported_display_hdr_types hdr_supported_types is_av1_hdr_supported is_hevc_hdr_supported key_display_hdr_supported key_video_decoder_hdr_supported video_decoder_hdr_supported; do
              echo
              echo "### STRING: $s"
              grep -aHn -B 80 -A 120 -F "\"$s\"" work/dis/*.txt || true
            done
            echo
            echo '===== STATIC ATTRIBUTE FIELD A2Z READ/WRITE SITES ====='
            grep -aHn -B 120 -A 180 -F 'LX/0hkS;.A2Z:' work/dis/*.txt || true
            echo
            echo '===== DEVICE CAPABILITIES + REELS/MEDIA REQUEST CONTEXT ====='
            grep -aHn -B 110 -A 180 -E '"device_capabilities"|GraphQlCallInput|video_dash_manifest|reels_media|clips|media_info|feed/reels|api/v1' work/dis/*.txt | grep -a -B 140 -A 220 -E 'device_capabilities|video_dash_manifest|reels|clips|media_info|GraphQlCallInput|api/v1' || true
          } | tr -cd '\11\12\15\40-\176' > "$REPORT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research/generated/instagram_439_hdr_request_dataflow_r7b.txt')
          b=p.read_bytes()
          if len(b)>850000: p.write_bytes(b[:850000])
          PY
          wc -c "$REPORT"
          sed -n '1,1000p' "$REPORT"
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_request_dataflow_r7b.txt
          if ! git diff --cached --quiet; then git commit -m 'Add Instagram 439 HDR request dataflow R7b'; fi
          git pull --rebase origin main
          git push origin HEAD:main
