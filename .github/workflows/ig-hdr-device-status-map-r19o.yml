name: IG 439 HDR Device Status Map R19o

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ig-hdr-device-status-map-r19o.yml]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Locate exact map producer classes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          targets=['LX/07sY;','LX/02tZ;']
          hit=set(); owners={t:[] for t in targets}
          for d in sorted(Path('work/apk').glob('classes*.dex')):
            r=subprocess.run(['java','-jar','work/baksmali-3.0.10-fat.jar','list','classes',str(d)],capture_output=True,text=True,errors='replace')
            s=set(r.stdout.splitlines())
            for t in targets:
              if t in s: owners[t].append(d.name); hit.add(d.name)
          print(owners)
          Path('work/hitdex.txt').write_text('\n'.join(sorted(hit))+'\n')
          PY
          while read d; do
            [ -n "$d" ] || continue
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/${d%.dex}" >/dev/null &
          done < work/hitdex.txt
          wait
      - name: Extract exact map fields and source methods
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          R=Path('work/smali'); O=['Instagram 439 HDR exact Reels device_status map R19o','==============================================','']
          for n in ['07sY','02tZ']:
            for p in R.rglob(n+'.smali'):
              O += [f'===== CLASS {n} FILE={p} =====']+p.read_text(errors='replace').splitlines()+['']
          # For 07sY.A00, summarize map key writes and all producers.
          p=next(R.rglob('07sY.smali')); ls=p.read_text(errors='replace').splitlines()
          b=[]; i=0
          while i<len(ls):
            if ls[i].startswith('.method') and ' A00(' in ls[i]:
              s=i; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              b=ls[s:i+1]; break
            i+=1
          vals=[]
          for x in b:
            m=re.search(r'const-string(?:/jumbo)?\s+([^,]+),\s+"([^"]*)"',x)
            if m: vals.append((m.group(1),m.group(2)))
          O += ['===== A00 STRING KEYS =====']+[f'{r} = {v}' for r,v in vals]+['']
          O += ['===== A00 FULL =====']+b+['']
          # One-hop methods called by A00 if locally resolvable in owner dexes.
          invre=re.compile(r'(L[^;]+;)->([^\s(]+)\(([^)]*)\)(\S+)')
          calls=[]
          for x in b:
            if 'invoke-' in x:
              m=invre.search(x)
              if m: calls.append(m.groups())
          O += ['===== A00 INVOKES =====']+[str(c) for c in calls]+['']
          out=Path('research/generated/instagram_439_hdr_device_status_map_r19o.txt')
          out.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:18000])); print('bytes',out.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_device_status_map_r19o.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Decode exact Reels device_status map R19o'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
