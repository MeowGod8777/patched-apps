name: Build IG HDR Test R3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-ig-hdr-test-r3.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_APK: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      BASE_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
      OUT_APK: instagram-piko-v439.0.0.37.89-hdr-test-r3.apk
      TAG: ig-hdr-test-r3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Download exact R8 and install tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work out
          gh release download 8 --pattern "$BASE_APK" --dir work
          echo "$BASE_SHA256  work/$BASE_APK" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq smali libbcprov-java

      - name: Inject MediaCodec configure logger and caller stack
        run: |
          set -euo pipefail
          cd work
          unzip -Z1 "$BASE_APK" | grep -E '^classes[0-9]*\.dex$' | sort -V > dex.list
          test -s dex.list
          while read -r dex; do
            mkdir -p "smali-${dex%.dex}"
            unzip -p "$BASE_APK" "$dex" > "$dex"
            baksmali d "$dex" -o "smali-${dex%.dex}"
          done < dex.list

          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          invoke_re=re.compile(r'^(\s*)invoke-virtual(?P<range>/range)?\s+\{(?P<regs>[^}]*)\},\s+Landroid/media/MediaCodec;->configure\(Landroid/media/MediaFormat;Landroid/view/Surface;Landroid/media/MediaCrypto;I\)V')
          def second_reg(regs, is_range):
              regs=regs.strip()
              if is_range:
                  m=re.fullmatch(r'([vp])(\d+)\s*\.\.\s*\1(\d+)', regs)
                  if not m:
                      return None
                  prefix, start, end=m.group(1), int(m.group(2)), int(m.group(3))
                  return f'{prefix}{start+1}' if end-start >= 1 else None
              parts=[x.strip() for x in regs.split(',') if x.strip()]
              return parts[1] if len(parts)>=2 else None
          touched=[]
          total=0
          for d in sorted(root.glob('smali-classes*')):
              dex_touched=False
              for p in d.rglob('*.smali'):
                  lines=p.read_text(errors='ignore').splitlines()
                  out=[]
                  changed=0
                  for line in lines:
                      m=invoke_re.search(line)
                      if m:
                          fmt=second_reg(m.group('regs'), bool(m.group('range')))
                          if fmt:
                              out.append(f"{m.group(1)}invoke-static {{{fmt}}}, Lcom/instagram/hdrprobe/HdrCodecProbe;->log(Landroid/media/MediaFormat;)V")
                              changed+=1
                      out.append(line)
                  if changed:
                      p.write_text('\n'.join(out)+'\n')
                      total+=changed
                      dex_touched=True
                      print(f'PATCHED {p}: {changed}')
              if dex_touched:
                  touched.append(d.name.replace('smali-','')+'.dex')
          if total == 0:
              raise SystemExit('No MediaCodec.configure callsites found')
          helper_lines=[
              '.class public final Lcom/instagram/hdrprobe/HdrCodecProbe;',
              '.super Ljava/lang/Object;',
              '',
              '.method public static log(Landroid/media/MediaFormat;)V',
              '    .registers 5',
              '',
              '    if-eqz p0, :done',
              '    const-string v0, "mime"',
              '    invoke-virtual {p0, v0}, Landroid/media/MediaFormat;->getString(Ljava/lang/String;)Ljava/lang/String;',
              '    move-result-object v0',
              '    if-eqz v0, :done',
              '    const-string v1, "video/"',
              '    invoke-virtual {v0, v1}, Ljava/lang/String;->startsWith(Ljava/lang/String;)Z',
              '    move-result v1',
              '    if-eqz v1, :done',
              '    const-string v1, "IG_HDR_CODEC"',
              '    invoke-static {p0}, Ljava/lang/String;->valueOf(Ljava/lang/Object;)Ljava/lang/String;',
              '    move-result-object v2',
              '    invoke-static {v1, v2}, Landroid/util/Log;->i(Ljava/lang/String;Ljava/lang/String;)I',
              '    new-instance v2, Ljava/lang/Throwable;',
              '    invoke-direct {v2}, Ljava/lang/Throwable;-><init>()V',
              '    invoke-static {v2}, Landroid/util/Log;->getStackTraceString(Ljava/lang/Throwable;)Ljava/lang/String;',
              '    move-result-object v2',
              '    invoke-static {v1, v2}, Landroid/util/Log;->i(Ljava/lang/String;Ljava/lang/String;)I',
              ':done',
              '    return-void',
              '.end method',
              ''
          ]
          helper_dir=root/'smali-classes2'/'com/instagram/hdrprobe'
          helper_dir.mkdir(parents=True, exist_ok=True)
          (helper_dir/'HdrCodecProbe.smali').write_text('\n'.join(helper_lines))
          if 'classes2.dex' not in touched:
              touched.append('classes2.dex')
          touched=sorted(set(touched))
          Path('touched.list').write_text('\n'.join(touched)+'\n')
          Path('../out/patch-count.txt').write_text(f'mediacodec_configure_calls_patched={total}\n'+'touched='+','.join(touched)+'\n')
          print(f'TOTAL PATCHED: {total}; touched={touched}')
          PY

          while read -r dex; do
            smali a "smali-${dex%.dex}" -o "patched-$dex"
          done < touched.list
          cd ..

      - name: Repack align and sign with exact R8 key
        run: |
          set -euo pipefail
          cp "work/$BASE_APK" work/unsigned.apk
          zip -q -d work/unsigned.apk 'META-INF/*' || true
          while read -r dex; do
            zip -q -d work/unsigned.apk "$dex" || true
            cp "work/patched-$dex" "work/$dex"
            (cd work && zip -q -0 unsigned.apk "$dex")
          done < work/touched.list
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$ZIPALIGN" -f -p 4 work/unsigned.apk work/aligned.apk
          BCJAR="$(find /usr/share/java -maxdepth 1 -type f -name 'bcprov*.jar' | head -1)"
          test -n "$BCJAR"
          rm -f work/ks-r8.p12
          keytool -importkeystore \
            -srckeystore ks.keystore -srcstoretype BKS -srcstorepass 123456789 \
            -srcalias andrewliang -srckeypass 123456789 \
            -destkeystore work/ks-r8.p12 -deststoretype PKCS12 \
            -deststorepass 123456789 -destkeypass 123456789 -destalias andrewliang \
            -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider \
            -providerpath "$BCJAR" -noprompt
          java -jar bin/apksigner.jar sign \
            --ks work/ks-r8.p12 --ks-type PKCS12 \
            --ks-pass pass:123456789 --key-pass pass:123456789 \
            --ks-key-alias andrewliang \
            --out "out/$OUT_APK" work/aligned.apk
          rm -f "out/$OUT_APK.idsig"

      - name: Verify instrumentation and signing identity
        run: |
          set -euo pipefail
          java -jar bin/apksigner.jar verify --verbose --print-certs "out/$OUT_APK" | tee out/verify.txt
          ORIG_CERT=$(java -jar bin/apksigner.jar verify --print-certs "work/$BASE_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          NEW_CERT=$(java -jar bin/apksigner.jar verify --print-certs "out/$OUT_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          printf 'original_cert=%s\nnew_cert=%s\n' "$ORIG_CERT" "$NEW_CERT" | tee out/cert-match.txt
          test -n "$ORIG_CERT" && test "$ORIG_CERT" = "$NEW_CERT"
          unzip -p "out/$OUT_APK" classes2.dex > work/verify-classes2.dex
          rm -rf work/verify-smali2
          baksmali d work/verify-classes2.dex -o work/verify-smali2
          test -f work/verify-smali2/com/instagram/hdrprobe/HdrCodecProbe.smali
          grep -q 'IG_HDR_CODEC' work/verify-smali2/com/instagram/hdrprobe/HdrCodecProbe.smali
          sha256sum "out/$OUT_APK" | tee out/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: instagram-hdr-test-r3
          path: |
            out/${{ env.OUT_APK }}
            out/sha256.txt
            out/verify.txt
            out/cert-match.txt
            out/patch-count.txt
          retention-days: 14

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES='R3 diagnostic build: exact Release 8 Instagram 439. Observation-only instrumentation immediately before every app MediaCodec.configure call. Logs video MediaFormat plus Java caller stack under IG_HDR_CODEC. Playback behavior is otherwise unchanged. Same signing certificate as Release 8, verified before publishing.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/$OUT_APK" out/sha256.txt out/verify.txt out/cert-match.txt out/patch-count.txt --clobber
            gh release edit "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "out/$OUT_APK" out/sha256.txt out/verify.txt out/cert-match.txt out/patch-count.txt --title 'Instagram HDR Test R3' --notes "$NOTES" --prerelease
          fi
