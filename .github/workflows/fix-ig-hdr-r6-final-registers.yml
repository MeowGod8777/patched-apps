name: Fix IG HDR R6 Final Registers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ig-hdr-r6-final-registers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch high-register calls in final R6 workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-ig-hdr-test-r6-final.yml')
          s=p.read_text()

          old='''          out=[]; patched=0
          for l in lines[s:e+1]:
              if l.strip()=='return v0':
                  indent=l[:len(l)-len(l.lstrip())]
                  out.append(f'{indent}invoke-static {{p1, v0}}, LX/00PV;->hdrCandidateR6(LX/03oR;I)V')
                  patched+=1
              out.append(l)
          if patched!=2: raise SystemExit(f'A0f return paths={patched}')
          lines[s:e+1]=out
          '''
          new='''          directive=next(i for i in range(s+1,min(s+12,e)) if lines[i].strip().startswith(('.registers','.locals')))
          lines[directive+1:directive+1]=[
            '',
            '    invoke-static/range {p1 .. p1}, LX/00PV;->hdrCandidateR6(LX/03oR;)V',
            ''
          ]
          '''
          if s.count(old)!=1: raise SystemExit(f'A0f patch block count={s.count(old)}')
          s=s.replace(old,new)

          old="            '    invoke-static {p2}, LX/00PV;->hdrSelectedR6(LX/03oR;)V',"
          new="            '    invoke-static/range {p2 .. p2}, LX/00PV;->hdrSelectedR6(LX/03oR;)V',"
          if s.count(old)!=1: raise SystemExit(f'selected call count={s.count(old)}')
          s=s.replace(old,new)

          start=s.index("            '.method private static hdrCandidateR6(LX/03oR;I)V',")
          end=s.index("            '.method private static hdrSelectedR6(LX/03oR;)V',", start)
          replacement='''            '.method private static hdrCandidateR6(LX/03oR;)V',
            '    .registers 3',
            '    if-eqz p0, :done_c',
            '    invoke-static {p0}, LX/03oR;->A00(LX/03oR;)Ljava/lang/String;',
            '    move-result-object v0',
            '    const-string v1, "IG_HDR_R6_CAND"',
            '    invoke-static {v1, v0}, Landroid/util/Log;->i(Ljava/lang/String;Ljava/lang/String;)I',
            ':done_c',
            '    return-void',
            '.end method',
            '',
          '''
          s=s[:start]+replacement+s[end:]

          s=s.replace('renderer candidates with support code (IG_HDR_R6_CAND)', 'renderer candidate formats (IG_HDR_R6_CAND)')
          p.write_text(s)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-ig-hdr-test-r6-final.yml
          git commit -m 'Fix R6 renderer probe high-register calls'
          git push origin HEAD:main

      - name: Dispatch corrected final R6 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-ig-hdr-test-r6-final.yml --ref main
