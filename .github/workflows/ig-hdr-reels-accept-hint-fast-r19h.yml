name: IG 439 HDR Reels Accept Hint Fast R19h

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-reels-accept-hint-fast-r19h.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Extract only classes15 targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" classes15.dex -d work/apk
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes15.dex -o work/smali >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          names=['X/02qh.smali','X/02po.smali','X/03Hy.smali']
          O=['Instagram 439 Reels Accept-Hint fast R19h','======================================','']
          for n in names:
              p=Path('work/smali')/n
              O += [f'===== {n} =====']
              O += p.read_text(errors='replace').splitlines() if p.exists() else ['NOT_FOUND']
              O += ['']
          Path('research/generated/instagram_439_hdr_reels_accept_hint_fast_r19h.txt').write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O))
          PY
      - name: Commit R19h report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_reels_accept_hint_fast_r19h.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Reels Accept-Hint fast trace R19h'
            git pull --rebase origin main
            git push origin HEAD:main
          fi