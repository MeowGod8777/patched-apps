name: IG 439 HDR Fast DEX Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dexdump.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes.dex' -d work/dex

      - name: Find dexdump
        run: |
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          test -n "$DEXDUMP"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Emit concise decoder report
        shell: bash
        run: |
          mkdir -p research/generated work/dis
          REPORT=research/generated/instagram_439_hdr_decoder_concise.txt
          "$DEXDUMP" -d -f -h work/dex/classes.dex > work/dis/classes.txt
          : > "$REPORT"
          {
            echo "Instagram 439 MobileConfig decoder concise report"
            echo "================================================"
            echo "APK SHA256: $APK_SHA256"
            echo "Mapping anchor: 74463::20 = ig4a_groot_surface_optimization::enable_hdr_sdr_ratio"
            echo
          } >> "$REPORT"

          slice_class() {
            cls="$1"; label="$2"; span="$3"
            line="$(grep -nF "Class descriptor  : '$cls'" work/dis/classes.txt | head -1 | cut -d: -f1 || true)"
            {
              echo "===== $label ====="
              if [ -n "$line" ]; then
                start=$((line>8?line-8:1)); end=$((line+span))
                sed -n "${start},${end}p" work/dis/classes.txt
              else
                echo "NOT FOUND: $cls"
              fi
              echo
            } >> "$REPORT"
          }

          slice_class 'LX/00Al;' 'X.00Al universal-ID decoder' 180
          slice_class 'LX/04Kj;' 'X.04Kj ExperimentParameter wrapper' 220

          {
            echo "===== exact X.00Al.A00 callers ====="
            grep -n -B 14 -A 28 -F 'LX/00Al;.A00:(J)I' work/dis/classes.txt || true
          } >> "$REPORT"

          wc -l "$REPORT"
          sed -n '1,260p' "$REPORT"

      - name: Commit concise report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_decoder_concise.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add concise Instagram 439 MobileConfig decoder report"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
