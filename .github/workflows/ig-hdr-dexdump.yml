name: IG 439 HDR Fast DEX Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dexdump.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex

      - name: Find dexdump
        run: |
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          test -n "$DEXDUMP"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Extract exact MobileConfig helper classes
        shell: bash
        run: |
          mkdir -p research/generated work/dis
          REPORT=research/generated/instagram_439_hdr_fast_dex_report.txt
          : > "$REPORT"
          {
            echo "Instagram 439 exact HDR fast DEX probe"
            echo "======================================"
            echo "APK: $APK_NAME"
            echo "SHA256: $APK_SHA256"
            echo "Mapping anchor: 74463::20 = ig4a_groot_surface_optimization::enable_hdr_sdr_ratio"
            echo "Piko runtime helpers: X.0B3D.A00(J)I, X.BSw, X.Sb1"
            echo "Generated: $(date -u +%FT%TZ)"
            echo
          } >> "$REPORT"

          HIT=0
          for d in work/dex/classes*.dex; do
            if grep -aEq 'LX/0B3D;|LX/BSw;|LX/Sb1;' "$d"; then
              HIT=1
              b="$(basename "$d" .dex)"
              echo "Helper descriptor hit in $d" | tee -a "$REPORT"
              "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
              for cls in 'LX/0B3D;' 'LX/BSw;' 'LX/Sb1;'; do
                line="$(grep -nF "Class descriptor  : '$cls'" "work/dis/$b.txt" | head -1 | cut -d: -f1 || true)"
                {
                  echo
                  echo "===== $b EXACT CLASS $cls ====="
                  if [ -n "$line" ]; then
                    start=$(( line > 15 ? line - 15 : 1 ))
                    end=$(( line + 500 ))
                    sed -n "${start},${end}p" "work/dis/$b.txt"
                  else
                    echo "CLASS DESCRIPTOR NOT FOUND IN DEXDUMP TEXT"
                    echo "Raw descriptor occurrences:"
                    grep -nF "$cls" "work/dis/$b.txt" | head -50 || true
                  fi
                } >> "$REPORT"
              done
            fi
          done
          test "$HIT" -eq 1

          echo "===== EXACT HELPER SUMMARY ====="
          grep -nE "EXACT CLASS|Class descriptor|name[[:space:]]*: 'A00'|type[[:space:]]*: '\(J\)I'|ushr|shr-|and-|return" "$REPORT" | head -n 1200 || true

      - name: Commit fast probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add research/generated/instagram_439_hdr_fast_dex_report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Refine Instagram 439 MobileConfig decoder report"
            git push origin HEAD:main
          fi
