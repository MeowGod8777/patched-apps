name: IG 439 HDR Fast DEX Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dexdump.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex

      - name: Find dexdump
        run: |
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          test -n "$DEXDUMP"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Trace X.06EM HDR transaction helpers
        shell: bash
        run: |
          REPORT=research/generated/instagram_439_hdr_transaction_trace.txt
          : > "$REPORT"
          {
            echo "Instagram 439 Groot HDR transaction trace"
            echo "========================================"
            echo "Known path: 74463::20 -> X.02g4.A07 -> SurfaceView.setDesiredHdrHeadroom(1.5) -> X.06EM.A03/A02"
            echo
          } >> "$REPORT"

          for d in work/dex/classes*.dex; do
            grep -aFq 'LX/06EM;' "$d" || continue
            b="$(basename "$d" .dex)"
            "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
            line="$(grep -nF "Class descriptor  : 'LX/06EM;'" "work/dis/$b.txt" | head -1 | cut -d: -f1 || true)"
            if [ -n "$line" ]; then
              start=$((line>10?line-10:1)); end=$((line+520))
              {
                echo "===== X.06EM definition in $b ====="
                sed -n "${start},${end}p" "work/dis/$b.txt"
                echo
              } >> "$REPORT"
            fi
          done

          {
            echo "===== Surface HDR API references in candidate DEX ====="
            grep -Hn -B 30 -A 60 -E 'setDesiredHdrSdrRatio|setDesiredHdrHeadroom|desiredHdrSdrRatio|desiredHdrHeadroom|HdrSdrRatio|HDR' work/dis/*.txt || true
          } >> "$REPORT"

          cat "$REPORT"

      - name: Commit HDR transaction trace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_transaction_trace.txt
          if ! git diff --cached --quiet; then
            git commit -m "Trace Instagram 439 desired HDR ratio transaction"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
