name: IG 439 HDR Fast DEX Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dexdump.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex

      - name: Find dexdump
        run: |
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          test -n "$DEXDUMP"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Summarize X.02g4.A07 consumers
        shell: bash
        run: |
          REPORT=research/generated/instagram_439_hdr_a07_consumers.txt
          : > "$REPORT"
          {
            echo "Instagram 439 Groot HDR A07 consumer summary"
            echo "============================================"
            echo "74463::20 true + API>=35 => X.02g4.A07=true"
            echo
          } >> "$REPORT"

          for d in work/dex/classes*.dex; do
            grep -aFq 'LX/02g4;' "$d" || continue
            b="$(basename "$d" .dex)"
            "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
            B="$b" python3 - <<'PY' >> "$REPORT"
          from pathlib import Path
          import os,re
          b=os.environ['B']
          p=Path('work/dis')/(b+'.txt')
          lines=p.read_text(errors='ignore').splitlines()
          refs=[i for i,l in enumerate(lines) if 'LX/02g4;.A07:Z' in l]
          if not refs: raise SystemExit
          print(f'===== {b}: A07 refs={len(refs)} =====')
          for i in refs:
              line=lines[i]
              op='READ' if 'iget-boolean' in line else ('WRITE' if 'iput-boolean' in line else 'OTHER')
              method='UNKNOWN'
              for j in range(i,-1,-1):
                  if re.search(r'\|\[[0-9a-f]+\] .*:\(', lines[j]):
                      method=lines[j].split('|',1)[-1].strip()
                      break
              print(f'{op}: {line.strip()}')
              print(f'  METHOD: {method}')
              if op=='READ':
                  for k in range(max(0,i-12), min(len(lines),i+28)):
                      print('    '+lines[k])
              print()
          PY
          done

          cat "$REPORT"

      - name: Commit A07 consumer summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_a07_consumers.txt
          if ! git diff --cached --quiet; then
            git commit -m "Summarize Instagram 439 Groot HDR A07 consumers"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
