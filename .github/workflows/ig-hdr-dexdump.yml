name: IG 439 HDR Fast DEX Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dexdump.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex

      - name: Find dexdump
        run: |
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          test -n "$DEXDUMP"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Trace MobileConfig ID decoder and registry helpers
        shell: bash
        run: |
          mkdir -p research/generated work/dis
          REPORT=research/generated/instagram_439_hdr_fast_dex_report.txt
          : > "$REPORT"
          {
            echo "Instagram 439 exact HDR fast DEX probe"
            echo "======================================"
            echo "APK: $APK_NAME"
            echo "SHA256: $APK_SHA256"
            echo "Mapping anchor: 74463::20 = ig4a_groot_surface_optimization::enable_hdr_sdr_ratio"
            echo "Piko exact runtime helpers: X.0B3D.A00(J)I, X.BSw, X.Sb1"
            echo "Generated: $(date -u +%FT%TZ)"
            echo
            echo "NOTE: production DEX does not carry the mapping's human-readable HDR names;"
            echo "the first probe established that names are external mapping metadata."
            echo
          } >> "$REPORT"

          HIT=0
          for d in work/dex/classes*.dex; do
            S="$(strings "$d")"
            if printf '%s\n' "$S" | grep -qE 'LX/0B3D;|LX/BSw;|LX/Sb1;'; then
              HIT=1
              b="$(basename "$d" .dex)"
              echo "Helper descriptor hit in $d" | tee -a "$REPORT"
              "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
              {
                echo
                echo "===== $b : X.0B3D CLASS / A00(J)I ====="
                grep -n -B 30 -A 220 -E "Class descriptor.*LX/0B3D;|name[[:space:]]*: 'A00'|LX/0B3D;.*A00" "work/dis/$b.txt" | head -n 2000 || true
                echo
                echo "===== $b : X.BSw ====="
                grep -n -B 30 -A 180 -E "Class descriptor.*LX/BSw;|LX/BSw;" "work/dis/$b.txt" | head -n 2500 || true
                echo
                echo "===== $b : X.Sb1 ====="
                grep -n -B 30 -A 180 -E "Class descriptor.*LX/Sb1;|LX/Sb1;" "work/dis/$b.txt" | head -n 2500 || true
              } >> "$REPORT"
            fi
          done
          test "$HIT" -eq 1

          echo "===== KEY DECODER LINES ====="
          grep -nE '0B3D|BSw|Sb1|shr-|ushr|and-|const-wide|return' "$REPORT" | head -n 1000 || true

      - name: Commit fast probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add research/generated/instagram_439_hdr_fast_dex_report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add Instagram 439 MobileConfig decoder report"
            git push origin HEAD:main
          fi
