name: IG 439 HDR Fast DEX Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dexdump.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex

      - name: Find dexdump
        run: |
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          test -n "$DEXDUMP"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Extract exact decoder methods
        shell: bash
        run: |
          mkdir -p research/generated work/dis
          REPORT=research/generated/instagram_439_hdr_decoder_methods.txt
          : > "$REPORT"
          "$DEXDUMP" -d -f -h work/dex/classes2.dex > work/dis/classes2.txt
          {
            echo "Instagram 439 exact MobileConfig decoder methods"
            echo "================================================"
            echo "APK SHA256: $APK_SHA256"
            echo "Mapping anchor: 74463::20 = ig4a_groot_surface_optimization::enable_hdr_sdr_ratio"
            echo
            echo "===== X.00Al.A00(J)I universal-ID decoder ====="
            grep -n -B 18 -A 90 -F 'X.00Al.A00:(J)I' work/dis/classes2.txt || true
            echo
            echo "===== X.00Aj value decoders ====="
            grep -n -B 18 -A 70 -E 'X\.00Aj\.(A04|A09|A0E):' work/dis/classes2.txt || true
            echo
            echo "===== X.003s.A04(J)Z boolean decoder ====="
            grep -n -B 18 -A 70 -F 'X.003s.A04:(J)Z' work/dis/classes2.txt || true
          } >> "$REPORT"
          wc -l "$REPORT"
          cat "$REPORT"

      - name: Commit decoder methods report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_decoder_methods.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add exact Instagram 439 MobileConfig decoder methods"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
