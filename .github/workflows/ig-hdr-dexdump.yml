name: IG 439 HDR Fast DEX Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dexdump.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex

      - name: Find dexdump
        run: |
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          test -n "$DEXDUMP"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Trace X.02g4.A07 reads
        shell: bash
        run: |
          REPORT=research/generated/instagram_439_hdr_a07_trace.txt
          : > "$REPORT"
          {
            echo "Instagram 439 Groot HDR A07 trace"
            echo "================================"
            echo "Config 74463::20 sets X.02g4.A07=true on API >=35"
            echo
          } >> "$REPORT"

          for d in work/dex/classes*.dex; do
            if grep -aFq 'LX/02g4;' "$d"; then
              b="$(basename "$d" .dex)"
              "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
              {
                echo "===== $b exact A07 field references ====="
                grep -n -B 60 -A 120 -F 'LX/02g4;.A07:Z' "work/dis/$b.txt" || true
                echo
              } >> "$REPORT"
            fi
          done

          wc -l "$REPORT"
          sed -n '1,900p' "$REPORT"

      - name: Commit A07 trace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_a07_trace.txt
          if ! git diff --cached --quiet; then
            git commit -m "Trace Instagram 439 Groot HDR surface gate"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
