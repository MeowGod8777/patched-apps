name: IG 439 HDR Fast DEX Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dexdump.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
      SPECIFIER: 008106a20014205d
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes15.dex' -d work/dex

      - name: Find dexdump
        run: |
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          test -n "$DEXDUMP"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Extract unique consumer context
        shell: bash
        run: |
          REPORT=research/generated/instagram_439_hdr_consumer.txt
          "$DEXDUMP" -d -f -h work/dex/classes15.dex > work/dis/classes15.txt
          line="$(grep -nF "#$SPECIFIER" work/dis/classes15.txt | head -1 | cut -d: -f1)"
          test -n "$line"
          start=$((line>180?line-180:1)); end=$((line+220))
          {
            echo "Instagram 439 exact Groot HDR consumer"
            echo "====================================="
            echo "APK SHA256: $APK_SHA256"
            echo "Config: 74463::20 ig4a_groot_surface_optimization::enable_hdr_sdr_ratio"
            echo "Raw specifier: 0x$SPECIFIER"
            echo "classes15 dexdump line: $line"
            echo
            sed -n "${start},${end}p" work/dis/classes15.txt
          } > "$REPORT"
          cat "$REPORT"

      - name: Commit consumer report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_consumer.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add exact Instagram 439 Groot HDR consumer"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
