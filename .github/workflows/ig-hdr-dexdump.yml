name: IG 439 HDR Fast DEX Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dexdump.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex

      - name: Find dexdump
        run: |
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          test -n "$DEXDUMP"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Trace exact Piko MobileConfig fingerprint
        shell: bash
        run: |
          mkdir -p research/generated work/dis
          REPORT=research/generated/instagram_439_hdr_fast_dex_report.txt
          : > "$REPORT"
          {
            echo "Instagram 439 exact HDR fast DEX probe"
            echo "======================================"
            echo "APK: $APK_NAME"
            echo "SHA256: $APK_SHA256"
            echo "Mapping anchor: 74463::20 = ig4a_groot_surface_optimization::enable_hdr_sdr_ratio"
            echo "Piko fingerprint: ExperimentParameter + Failed to get config key with specifier:%d"
            echo "Generated: $(date -u +%FT%TZ)"
            echo
          } >> "$REPORT"

          HIT=0
          for d in work/dex/classes*.dex; do
            if grep -aFq 'Failed to get config key with specifier:%d' "$d"; then
              HIT=1
              b="$(basename "$d" .dex)"
              echo "Fingerprint string hit in $d" | tee -a "$REPORT"
              "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
              {
                echo
                echo "===== $b EXACT FINGERPRINT CONTEXT: FAILED CONFIG KEY ====="
                grep -n -B 180 -A 220 -F 'Failed to get config key with specifier:%d' "work/dis/$b.txt" || true
                echo
                echo "===== $b EXACT FINGERPRINT CONTEXT: ExperimentParameter ====="
                grep -n -B 180 -A 220 -F 'ExperimentParameter' "work/dis/$b.txt" || true
              } >> "$REPORT"
            fi
          done
          test "$HIT" -eq 1

          echo "===== FINGERPRINT SUMMARY ====="
          grep -nE 'Fingerprint string hit|ExperimentParameter|Failed to get config key|invoke-static|const-wide|Class descriptor|name[[:space:]]*:' "$REPORT" | head -n 2000 || true

      - name: Commit fast probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_fast_dex_report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Trace exact Instagram 439 MobileConfig fingerprint"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
