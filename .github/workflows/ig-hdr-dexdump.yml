name: IG 439 HDR Fast DEX Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dexdump.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex

      - name: Find dexdump
        run: |
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          test -n "$DEXDUMP"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Trace exact 439 MobileConfig decoder
        shell: bash
        run: |
          mkdir -p research/generated work/dis
          REPORT=research/generated/instagram_439_hdr_decoder_report.txt
          : > "$REPORT"
          {
            echo "Instagram 439 exact MobileConfig decoder probe"
            echo "=============================================="
            echo "APK: $APK_NAME"
            echo "SHA256: $APK_SHA256"
            echo "Known mapping anchor: 74463::20 = ig4a_groot_surface_optimization::enable_hdr_sdr_ratio"
            echo "Exact 439 parser class: X.04Kj"
            echo "Exact 439 universal-ID decoder: X.00Al.A00(J)I"
            echo "Generated: $(date -u +%FT%TZ)"
            echo
          } >> "$REPORT"

          "$DEXDUMP" -d -f -h work/dex/classes.dex > work/dis/classes.txt

          extract_class() {
            local cls="$1"
            local label="$2"
            local line
            line="$(grep -nF "Class descriptor  : '$cls'" work/dis/classes.txt | head -1 | cut -d: -f1 || true)"
            {
              echo
              echo "===== $label ($cls) ====="
              if [ -n "$line" ]; then
                local start=$(( line > 15 ? line - 15 : 1 ))
                local end=$(( line + 700 ))
                sed -n "${start},${end}p" work/dis/classes.txt
              else
                echo "CLASS NOT FOUND"
              fi
            } >> "$REPORT"
          }

          extract_class 'LX/00Al;' 'UNIVERSAL-ID DECODER'
          extract_class 'LX/04Kj;' 'EXPERIMENT PARAMETER WRAPPER'

          {
            echo
            echo "===== ALL CALLS TO X.00Al.A00(J)I IN classes.dex ====="
            grep -n -B 40 -A 80 -F 'LX/00Al;.A00:(J)I' work/dis/classes.txt || true
            echo
            echo "===== LARGE CONST-WIDE VALUES NEAR MOBILECONFIG QUERIES ====="
            grep -n -B 20 -A 50 -E 'const-wide|LX/00Al;.A00:\(J\)I|ExperimentParameter|Failed to get config key with specifier' work/dis/classes.txt | head -n 12000 || true
          } >> "$REPORT"

          echo "===== DECODER SUMMARY ====="
          grep -nE "UNIVERSAL-ID DECODER|X\.00Al\.A00|ushr-long|shr-long|shl-long|and-long|long-to-int|const-wide|return" "$REPORT" | head -n 1600 || true

      - name: Commit decoder report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_decoder_report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add exact Instagram 439 MobileConfig decoder report"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
