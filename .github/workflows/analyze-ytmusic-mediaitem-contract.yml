name: Inspect YT Music MediaItem contract

on:
  push:
    paths:
      - .github/workflows/analyze-ytmusic-mediaitem-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and decode validated Luna base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input tools out
          gh release download ytmusic-originplayer-luna-33729902415 --pattern '*.apk' --dir input
          mv input/*.apk input/base.apk
          sha256sum input/base.apk | tee out/base-sha256.txt
          curl -L --fail --retry 3 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar tools/apktool.jar d -f input/base.apk -o decoded

          copy_class() {
            local cls="$1"
            local f
            f=$(find decoded -type f -name "${cls}.smali" -print -quit || true)
            if [ -n "$f" ]; then
              cp "$f" "out/${cls}.smali"
              printf '%s\n' "$f" > "out/${cls}-path.txt"
            fi
          }
          for cls in lgl lgp lgk mxt plq kyi noq nox npa aveu avev aves lag lai lbg lkq id; do copy_class "$cls"; done

          grep -RIl '^\.implements Lnoq;' decoded/smali* 2>/dev/null | sort | tee out/lnoq-implementors.txt || true
          : > out/lnoq-o-m-bodies.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "===== $f =====" >> out/lnoq-o-m-bodies.txt
            sed -n '/^\.method .* m()J$/,/^\.end method$/p' "$f" >> out/lnoq-o-m-bodies.txt
            sed -n '/^\.method .* o()Lboht;$/,/^\.end method$/p' "$f" >> out/lnoq-o-m-bodies.txt
          done < out/lnoq-implementors.txt

          # Exact all-stock uses of queue IDs and queue playback endpoints.
          grep -RniF 'Lnoq;->o()Lboht;' decoded/smali* | tee out/lnoq-o-call-hits.txt || true
          grep -RniF 'Lnoq;->m()J' decoded/smali* | tee out/lnoq-m-call-hits.txt || true
          : > out/lnoq-o-call-contexts.txt
          while IFS=: read -r f n rest; do
            [ -n "$f" ] || continue
            start=$(( n > 180 ? n-180 : 1 )); end=$(( n+320 ))
            echo "===== $f:$n =====" >> out/lnoq-o-call-contexts.txt
            sed -n "${start},${end}p" "$f" >> out/lnoq-o-call-contexts.txt
          done < out/lnoq-o-call-hits.txt
          : > out/lnoq-m-call-contexts.txt
          while IFS=: read -r f n rest; do
            [ -n "$f" ] || continue
            start=$(( n > 140 ? n-140 : 1 )); end=$(( n+260 ))
            echo "===== $f:$n =====" >> out/lnoq-m-call-contexts.txt
            sed -n "${start},${end}p" "$f" >> out/lnoq-m-call-contexts.txt
          done < out/lnoq-m-call-hits.txt

          grep -RniF 'Llgl;->d(Lboht;)Ljava/lang/String;' decoded/smali* | tee out/llgl-d-call-hits.txt || true
          : > out/llgl-d-call-contexts.txt
          while IFS=: read -r f n rest; do
            [ -n "$f" ] || continue
            start=$(( n > 180 ? n-180 : 1 )); end=$(( n+420 ))
            echo "===== $f:$n =====" >> out/llgl-d-call-contexts.txt
            sed -n "${start},${end}p" "$f" >> out/llgl-d-call-contexts.txt
          done < out/llgl-d-call-hits.txt

          : > out/playfrommediaid-contract.txt
          LAG=$(find decoded -type f -name lag.smali -print -quit)
          LAI=$(find decoded -type f -name lai.smali -print -quit)
          LBG=$(find decoded -type f -name lbg.smali -print -quit)
          if [ -n "$LAG" ]; then
            echo '===== Llag.g(String,Bundle) =====' >> out/playfrommediaid-contract.txt
            sed -n '/^\.method public final g(Ljava\/lang\/String;Landroid\/os\/Bundle;)V$/,/^\.end method$/p' "$LAG" >> out/playfrommediaid-contract.txt
            echo '===== Llag.w(Bundle,Z) =====' >> out/playfrommediaid-contract.txt
            sed -n '/^\.method .* w(Landroid\/os\/Bundle;Z)Llkq;$/,/^\.end method$/p' "$LAG" >> out/playfrommediaid-contract.txt
          fi
          if [ -n "$LAI" ]; then
            echo '===== Llai.b(Laves,Bundle) =====' >> out/playfrommediaid-contract.txt
            sed -n '/^\.method .* static b(Laves;Landroid\/os\/Bundle;)Landroid\/os\/Bundle;$/,/^\.end method$/p' "$LAI" >> out/playfrommediaid-contract.txt
          fi
          if [ -n "$LBG" ]; then
            echo '===== Llbg.a(Lavev) =====' >> out/playfrommediaid-contract.txt
            sed -n '/^\.method .* static a(Lavev;)Lboht;$/,/^\.end method$/p' "$LBG" >> out/playfrommediaid-contract.txt
            echo '===== Llbg.o(...) =====' >> out/playfrommediaid-contract.txt
            sed -n '/^\.method .* o(Lckob;Lboht;Landroid\/os\/Bundle;)V$/,/^\.end method$/p' "$LBG" >> out/playfrommediaid-contract.txt
          fi
          grep -RniE 'media_item_from_search|vivomusicmix_key_list|com\.google\.android\.apps\.youtube\.music\.mediabrowser\.caller_package_name|playFromMediaId' "$LAG" "$LAI" "$LBG" 2>/dev/null | tee out/playfrommediaid-key-hits.txt || true

          grep -RniE 'MediaBrowserCompat\$MediaItem;-><init>|MediaDescriptionCompat;-><init>|onPlayFromMediaId|Laveu;->b\(Ljava/lang/String;\)Lavev;' decoded/smali* \
            | grep -E '/(lgp|lgk|mxt|plq|kyi|lag|id)\.smali:' | tee out/relevant-mediaitem-callback-hits.txt || true
          grep -RniE 'MediaDescriptionCompat;->|MediaBrowserCompat\$MediaItem;->|MediaSessionCompat\$QueueItem;->' decoded/smali_classes5/kyi.smali decoded/smali*/ii.smali 2>/dev/null | tee out/producer-refs.txt || true

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: ytmusic-mediaitem-rootcause-inspection
          path: out/
          if-no-files-found: error
          retention-days: 14
