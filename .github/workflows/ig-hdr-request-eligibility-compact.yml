name: IG 439 HDR Request Eligibility Compact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-request-eligibility-compact.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download and dexdump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do
            b="$(basename "$d" .dex)"
            "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
          done
      - name: Build compact ASCII report
        run: |
          set -euo pipefail
          REPORT=research/generated/instagram_439_hdr_request_eligibility_compact.txt
          FULL=work/request-eligibility-full.txt
          REGEX='is_hdr_source|video_decoder_hdr_supported|key_video_decoder_hdr_supported|hdr.*support|support.*hdr|hdr.*capab|capab.*hdr|hdr10|hdr10plus|video_dash_manifest|device_capabil|supported_codecs|codec_capabil|playback.*capab|reels.*hdr|clips.*hdr|dash.*hdr|hdr.*dash|mixed_codec_manifest|device_static_attributes'
          {
            echo 'Instagram 439 HDR request eligibility compact trace'
            echo '================================================='
            echo
            echo '===== STRING INVENTORY ====='
            (for d in work/dex/classes*.dex; do strings "$d" | grep -Eai "$REGEX" || true; done) | sort -u
            echo
            echo '===== OWNER CONTEXTS ====='
            grep -aHn -B 14 -A 22 -Ei "$REGEX" work/dis/*.txt || true
          } | tr -cd '\11\12\15\40-\176' > "$FULL"
          python3 - <<'PY'
          from pathlib import Path
          src=Path('work/request-eligibility-full.txt').read_bytes()
          Path('research/generated/instagram_439_hdr_request_eligibility_compact.txt').write_bytes(src[:95000])
          PY
          wc -c "$REPORT"
          sed -n '1,1400p' "$REPORT"
      - name: Commit compact report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_request_eligibility_compact.txt
          if ! git diff --cached --quiet; then git commit -m 'Add compact Instagram 439 HDR request eligibility trace'; fi
          git pull --rebase origin main
          git push origin HEAD:main
