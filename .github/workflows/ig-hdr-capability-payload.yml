name: IG 439 HDR Capability Payload

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-capability-payload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download and disassemble
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do
            b="$(basename "$d" .dex)"
            "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
          done
      - name: Extract HDR capability payload readers
        run: |
          REPORT=research/generated/instagram_439_hdr_capability_payload.txt
          {
            echo "Instagram 439 HDR capability payload trace"
            echo "=========================================="
            echo
            echo "===== exact capability keys ====="
            grep -aHn -B 140 -A 220 -E 'video_decoder_hdr_supported|key_video_decoder_hdr_supported|video_av1_hardware_decoder_supported|key_video_av1_hardware_decoder_supported|video_av1_hardware_decoder_max_instances|key_video_av1_hardware_decoder_max_instances' work/dis/*.txt || true
            echo
            echo "===== related hdr capability strings ====="
            for d in work/dex/classes*.dex; do strings "$d" | grep -Ei '(^|key_)video_.*hdr.*supported|av1.*hardware.*decoder.*supported|decoder.*hdr.*support' || true; done | sort -u
          } > "$REPORT"
          sed -n '1,1800p' "$REPORT"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_capability_payload.txt
          if ! git diff --cached --quiet; then git commit -m "Trace Instagram 439 HDR capability payload"; fi
          git pull --rebase origin main
          git push origin HEAD:main
