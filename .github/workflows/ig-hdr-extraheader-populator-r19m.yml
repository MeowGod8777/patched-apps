name: IG 439 HDR ExtraHeader Populator R19m

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-extraheader-populator-r19m.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch and disassemble class owner dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          toks=['LX/02ez;','LX/0Pch;']
          hit=[]
          for p in sorted(Path('work/apk').glob('classes*.dex')):
              s=subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace').stdout
              if any(t in s for t in toks): hit.append(p.name)
          Path('work/hitdex.txt').write_text('\n'.join(hit)+'\n')
          print('HITDEX',hit)
          PY
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"; java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait
      - name: Extract 02ez and interface writes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          ROOT=Path('work/smali'); OUT=Path('research/generated/instagram_439_hdr_extraheader_populator_r19m.txt')
          cls_re=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          methods=[]; classes={}
          for p in ROOT.rglob('*.smali'):
            ls=p.read_text(errors='replace').splitlines(); cls='?'
            for x in ls[:60]:
              m=cls_re.match(x)
              if m: cls=m.group(1); break
            classes[cls]=(p,ls)
            i=0
            while i<len(ls):
              if not ls[i].startswith('.method'): i+=1; continue
              s=i; sig=ls[i]; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              e=min(i,len(ls)-1); methods.append((cls,sig,p,ls[s:e+1])); i+=1
          O=['Instagram 439 HDR Extra Header Populator R19m','=============================================','']
          for target in ['LX/02ez;','LX/0Pch;']:
            if target in classes:
              p,ls=classes[target]; O += [f'===== FULL CLASS {target} =====',f'FILE={p}']+ls+['']
          # all 02ez A00 callers and all interface AMu/AOA call sites in 02ez
          needle='LX/02ez;->A00('
          for cls,sig,p,b in methods:
            if needle in '\n'.join(b):
              O += [f'===== 02ez.A00 CALLER {cls} {sig} =====',f'FILE={p}']+b+['']
          # all methods invoking LX/0Pch methods, to ensure no hidden capability populator sibling
          for cls,sig,p,b in methods:
            text='\n'.join(b)
            if 'LX/0Pch;->' in text:
              O += [f'===== 0Pch WRITER {cls} {sig} =====',f'FILE={p}']+b+['']
          OUT.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:12000])); print('bytes',OUT.stat().st_size)
          PY
      - name: Commit R19m report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_extraheader_populator_r19m.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add extra-header populator trace R19m'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
