name: IG 439 HDR Accept Hint Args R19f

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-accept-hint-args-r19f.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Fetch exact APK and disassemble focused dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          needles=[
              'X-IG-Accept-Hint',
              'ClipsApiUtilHelper',
              'LX/01Jw;', 'LX/01Jv;', 'LX/0ASB;',
              'ClipsViewerStreamingPrefetchRequestParams',
              'clips_viewer_prefetcher_',
              'clips_item_streaming/'
          ]
          hit=[]; lines=[]
          for p in sorted(Path('work/apk').glob('classes*.dex')):
              s=subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace').stdout
              hs=[n for n in needles if n in s]
              if hs:
                  hit.append(p.name); lines.append(f'{p.name}: {hs}')
          Path('work/hitdex.txt').write_text('\n'.join(hit)+'\n')
          Path('research/generated/instagram_439_hdr_accept_hint_dex_hits_r19f.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines)); print('HITDEX',hit)
          PY
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait

      - name: Extract Accept-Hint occurrences and A06 argument sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT=Path('work/smali')
          OUT=Path('research/generated/instagram_439_hdr_accept_hint_args_r19f.txt')
          class_re=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          method_sig_re=re.compile(r'^\.method\s+(.+)$')
          const_re=re.compile(r'^\s*const(?:/\w+)?(?:/high16)?\s+([^,]+),\s+([^#]+)')
          cstr_re=re.compile(r'^\s*const-string(?:/jumbo)?\s+([^,]+),\s+"(.*)"')
          move_re=re.compile(r'^\s*move(?:-object)?(?:/from16|/16)?\s+([^,]+),\s+(\S+)')
          iget_re=re.compile(r'^\s*iget(?:-object|-boolean|-wide)?\s+([^,]+),\s+([^,]+),\s+(L[^;]+;)->([^:]+):(\S+)')
          sget_re=re.compile(r'^\s*sget(?:-object|-boolean|-wide)?\s+([^,]+),\s+(L[^;]+;)->([^:]+):(\S+)')
          invoke_target='Lcom/instagram/clips/api/ClipsApiUtilHelper;->A06(Lcom/instagram/common/session/UserSession;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;I)LX/02ue;'

          methods=[]
          for p in ROOT.rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); cls='?'
              for x in ls[:60]:
                  m=class_re.match(x)
                  if m: cls=m.group(1); break
              i=0
              while i<len(ls):
                  if not ls[i].startswith('.method'):
                      i+=1; continue
                  s=i; sig=ls[i]; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'):
                      i+=1
                  e=min(i,len(ls)-1); methods.append((cls,sig,p,ls[s:e+1])); i+=1

          O=['Instagram 439 HDR Accept-Hint + A06 args R19f','=============================================','']

          # 1) Every exact X-IG-Accept-Hint method, full enough to expose all legal literal values.
          ah=[]
          for cls,sig,p,b in methods:
              text='\n'.join(b)
              if 'X-IG-Accept-Hint' in text:
                  ah.append((cls,sig,p,b))
          O += [f'===== ALL X-IG-ACCEPT-HINT METHODS ({len(ah)}) =====','']
          for cls,sig,p,b in ah:
              O += [f'--- {cls} {sig}',f'FILE={p}'] + b + ['']

          # 2) Exact A06 callers with call window and a simple backwards register provenance table.
          callers=[]
          for cls,sig,p,b in methods:
              for i,l in enumerate(b):
                  if invoke_target in l:
                      callers.append((cls,sig,p,b,i,l))
          O += [f'===== EXACT A06 CALL SITES ({len(callers)}) =====','']
          for cls,sig,p,b,idx,invline in callers:
              O += [f'--- CALLSITE {cls} {sig}',f'FILE={p}',f'INVOKE_INDEX={idx}',invline]
              lo=max(0,idx-100); hi=min(len(b),idx+25)
              O += ['WINDOW:'] + [f'{j:04d}: {b[j]}' for j in range(lo,hi)]

              # Parse invoke register list and trace last definitions in the preceding 120 lines.
              mm=re.search(r'\{([^}]*)\}',invline)
              regs=[]
              if mm:
                  raw=mm.group(1).strip()
                  if '..' in raw:
                      # range form is kept raw; window still shows exact source moves.
                      regs=[raw]
                  else:
                      regs=[x.strip() for x in raw.split(',') if x.strip()]
              O += [f'INVOKE_REGS={regs}','BACKWARD_LAST_DEFS:']
              if len(regs)>1 or (regs and '..' not in regs[0]):
                  for r in regs:
                      found=[]
                      for j in range(idx-1,max(-1,idx-121),-1):
                          l=b[j]
                          m=cstr_re.match(l)
                          if m and m.group(1)==r:
                              found.append((j,'const-string',m.group(2))); break
                          m=const_re.match(l)
                          if m and m.group(1)==r:
                              found.append((j,'const',m.group(2).strip())); break
                          m=move_re.match(l)
                          if m and m.group(1)==r:
                              found.append((j,'move-from',m.group(2))); break
                          m=iget_re.match(l)
                          if m and m.group(1)==r:
                              found.append((j,'iget',f'{m.group(2)} {m.group(3)}->{m.group(4)}:{m.group(5)}')); break
                          m=sget_re.match(l)
                          if m and m.group(1)==r:
                              found.append((j,'sget',f'{m.group(2)}->{m.group(3)}:{m.group(4)}')); break
                      O += [f'{r}: {found or "NO_SIMPLE_DEF_IN_WINDOW"}']
              O += ['']

          # 3) Dump parameter/carrier classes that shape the high-value prefetch call.
          interesting={'LX/01Jw;','LX/01Jv;','LX/0ASB;'}
          O += ['===== PREFETCH / PARAMETER CLASSES =====','']
          for p in ROOT.rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); cls='?'
              for x in ls[:60]:
                  m=class_re.match(x)
                  if m: cls=m.group(1); break
              if cls not in interesting: continue
              O += [f'===== CLASS {cls} FILE={p} =====']
              # fields + ctors + methods containing ClipsApi/A06/streaming/prefetch/ClipsContainerModule
              for l in ls:
                  if l.startswith('.field'):
                      O.append(l)
              i=0
              while i<len(ls):
                  if not ls[i].startswith('.method'):
                      i+=1; continue
                  s=i; sig=ls[i]; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'):
                      i+=1
                  e=min(i,len(ls)-1); b=ls[s:e+1]; text='\n'.join(b)
                  if '<init>' in sig or any(k in text for k in ['ClipsApiUtilHelper;->A06','streaming_','clips_viewer_prefetcher_','ClipsContainerModule','clips_media_ids']):
                      O += [''] + b
                  i+=1
              O += ['']

          OUT.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:7000]))
          print('bytes',OUT.stat().st_size,'accept_hint_methods',len(ah),'callsites',len(callers))
          PY

      - name: Commit R19f reports
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_accept_hint_dex_hits_r19f.txt research/generated/instagram_439_hdr_accept_hint_args_r19f.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Reels Accept-Hint and A06 argument trace R19f'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
