name: IG 439 HDR Persistent Classification R19k
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ig-hdr-persistent-classification-r19k.yml]
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Fetch exact APK and disassemble classification hit dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          ns=['key_display_hdr_supported','key_video_decoder_hdr_supported','display_hdr_supported','video_decoder_hdr_supported','is_av1_hdr_supported','is_hevc_hdr_supported','hdr_supported_types','supported_display_hdr_types','com.facebook.devicesegmentation','ig_device_static_attributes','LX/0Uiy;','LX/03Tz;','LX/00vy;','LX/0hkS;','LX/0hld;']
          hit=[]; rows=[]
          for p in sorted(Path('work/apk').glob('classes*.dex')):
            s=subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace').stdout
            hs=[n for n in ns if n.lower() in s.lower()]
            if hs: hit.append(p.name); rows.append(f'{p.name}: '+', '.join(hs))
          Path('work/hitdex.txt').write_text('\n'.join(hit)+'\n'); Path('research/generated/instagram_439_hdr_persistent_classification_dex_hits_r19k.txt').write_text('\n'.join(rows)+'\n'); print('\n'.join(rows))
          PY
          while read d; do [ -n "$d" ] && java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/${d%.dex}" >/dev/null & done < work/hitdex.txt
          wait
      - name: Trace HDR classification sinks and segmentation persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('work/smali'); out=Path('research/generated/instagram_439_hdr_persistent_classification_r19k.txt')
          cr=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$'); sr=re.compile(r'^\s*const-string(?:/jumbo)?\s+([^,]+),\s+"(.*)"')
          ms=[]
          for p in root.rglob('*.smali'):
            ls=p.read_text(errors='replace').splitlines(); c='?'
            for x in ls[:50]:
              m=cr.match(x)
              if m: c=m.group(1); break
            i=0
            while i<len(ls):
              if not ls[i].startswith('.method'): i+=1; continue
              s=i; sig=ls[i]; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              ms.append((c,sig,p,ls[s:min(i,len(ls)-1)+1])); i+=1
          keys=('key_display_hdr_supported','key_video_decoder_hdr_supported','display_hdr_supported','video_decoder_hdr_supported','is_av1_hdr_supported','is_hevc_hdr_supported','hdr_supported_types','supported_display_hdr_types')
          O=['Instagram 439 HDR persistent classification R19k','=============================================','']
          owners=[]
          for c,sig,p,b in ms:
            low='\n'.join(b).lower(); hs=[k for k in keys if k in low]
            if hs:
              owners.append((c,sig,p,b,hs)); O += [f'===== HDR_OWNER {c} {sig} =====',f'FILE={p}',f'KEYS={hs}']+b+['']
          O += ['===== CALLERS OF HDR OWNERS =====','']
          for oc,osig,op,ob,hs in owners:
            m=re.search(r'\s([^\s(]+)\(([^)]*)\)(\S+)$',osig)
            if not m: continue
            needle=f'{oc}->{m.group(1)}({m.group(2)}){m.group(3)}'
            for c,sig,p,b in ms:
              if needle in '\n'.join(b): O += [f'OWNER={needle}',f'CALLER={c} {sig}',f'FILE={p}']+b+['']
          O += ['===== DEVICE SEGMENTATION METHODS =====','']
          for c,sig,p,b in ms:
            t='\n'.join(b); low=t.lower()
            if 'devicesegmentation' not in low and 'lx/0hks;' not in low and 'lx/0hld;' not in low: continue
            tags=[x for x in ('getSharedPreferences','getString','getBoolean','putString','putBoolean','putInt','putLong','apply','commit') if x.lower() in low]
            if 'lx/03u7;->' in low or 'graphqlcallinput' in low or '/api/' in low: tags.append('NETWORK')
            O += [f'--- {c} {sig}',f'FILE={p}',f'TAGS={tags}']+b+['']
          O += ['===== CLASSIFICATION PREF WRITERS =====','']
          for c,sig,p,b in ms:
            low='\n'.join(b).lower()
            if 'sharedpreferences$editor;->put' not in low: continue
            vals=[]
            for l in b:
              m=sr.match(l)
              if m and any(k in m.group(2).lower() for k in ('device','segment','class','hdr','codec','display','performance','capab')): vals.append(m.group(2))
            if vals or '0hks' in low or '0hld' in low: O += [f'--- {c} {sig}',f'FILE={p}',f'KEYS={vals}']+b+['']
          O += ['===== HDR OWNER SINK SUMMARY =====','']
          ocs={x[0] for x in owners}|{'LX/0Uiy;','LX/03Tz;','LX/00vy;'}
          for c,sig,p,b in ms:
            if c not in ocs: continue
            t='\n'.join(b); sink=[]
            if 'LX/03u7;->' in t: sink.append('REST')
            if 'GraphQlCallInput' in t: sink.append('GRAPHQL')
            if 'markerAnnotate' in t: sink.append('QPL')
            if 'LX/00vv;' in t or 'LX/00vy;' in t: sink.append('EVENT')
            if sink: O += [f'{c} {sig} SINKS={sink}',f'FILE={p}']+b+['']
          out.write_text('\n'.join(O),encoding='utf-8'); print('\n'.join(O[:10000])); print('owners',len(owners),'bytes',out.stat().st_size)
          PY
      - name: Commit R19k reports
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/generated/instagram_439_hdr_persistent_classification_*.txt
          if ! git diff --cached --quiet; then git commit -m 'Add Instagram HDR persistent classification trace R19k'; git pull --rebase origin main; git push origin HEAD:main; fi
