name: IG 439 HDR Device Status Bool Producers R19p2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ig-hdr-device-status-bool-producers-r19p2.yml]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Locate and disassemble producer classes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          targets=['LX/0GiY;','LX/07mA;','LX/0GjW;','LX/01Zz;']
          hit=set(); owners={t:[] for t in targets}
          for d in sorted(Path('work/apk').glob('classes*.dex')):
              r=subprocess.run(['java','-jar','work/baksmali-3.0.10-fat.jar','list','classes',str(d)],capture_output=True,text=True,errors='replace')
              ss=set(r.stdout.splitlines())
              for t in targets:
                  if t in ss: owners[t].append(d.name); hit.add(d.name)
          Path('work/hitdex.txt').write_text('\n'.join(sorted(hit))+'\n')
          print(owners)
          PY
          while read d; do
            [ -n "$d" ] || continue
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/${d%.dex}" >/dev/null &
          done < work/hitdex.txt
          wait
      - name: Extract Function0 invoke switch bodies
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          R=Path('work/smali')
          O=['Instagram 439 HDR exact device_status bool producers R19p2','==================================================','']
          for n in ['0GiY','07mA','0GjW','01Zz']:
              for p in R.rglob(n+'.smali'):
                  ls=p.read_text(errors='replace').splitlines()
                  O += [f'===== CLASS {n} FILE={p} =====']
                  # For small helper classes dump all. For callback classes only constructor + invoke/A01/A00 methods.
                  if n in ('0GjW','01Zz'):
                      O += ls+['']
                      continue
                  i=0
                  while i<len(ls):
                      if not ls[i].startswith('.method'): i+=1; continue
                      s=i; sig=ls[i]; i+=1
                      while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                      b=ls[s:min(i+1,len(ls))]
                      if '<init>(' in sig or ' invoke()' in sig or ' A01(' in sig or ' A00(' in sig:
                          O += [f'--- {sig} ---']+b+['']
                      i+=1
          # Exact neighborhoods containing target primitives.
          O += ['===== TARGET NEIGHBORHOODS =====']
          pats=['video/av01','video/x-vnd.on2.vp9','getSupportedHdrTypes','HDR_TYPE_HLG','HdrCapabilities','hlg','0x1000','0x2000','0x4000','profileLevels']
          for p in R.rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines()
              for i,x in enumerate(ls):
                  if any(q.lower() in x.lower() for q in pats):
                      O += [f'--- {p} idx={i} match={x.strip()} ---']+ls[max(0,i-35):min(len(ls),i+45)]+['']
          out=Path('research/generated/instagram_439_hdr_device_status_bool_producers_r19p2.txt')
          out.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:20000])); print('bytes',out.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_device_status_bool_producers_r19p2.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add exact 10-bit AV1 and HLG device_status producers R19p2'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
