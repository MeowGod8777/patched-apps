name: IG 439 Exact HDR Request Fields

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-exact-request-fields.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download and dexdump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do
            b="$(basename "$d" .dex)"
            "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
          done
      - name: Extract exact owner contexts
        run: |
          set -euo pipefail
          REPORT=research/generated/instagram_439_hdr_exact_request_fields.txt
          REGEX='device_capabilities|display_hdr_supported|supported_display_hdr_types|is_av1_hdr_supported|is_hevc_hdr_supported|hdr_supported_types|key_display_hdr_supported|key_video_decoder_hdr_supported'
          {
            echo 'Instagram 439 exact HDR request-field trace'
            echo '==========================================='
            echo
            grep -aHn -B 90 -A 140 -Ei "$REGEX" work/dis/*.txt || true
          } | tr -cd '\11\12\15\40-\176' > "$REPORT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research/generated/instagram_439_hdr_exact_request_fields.txt')
          b=p.read_bytes()
          if len(b)>180000: p.write_bytes(b[:180000])
          PY
          wc -c "$REPORT"
          sed -n '1,2600p' "$REPORT"
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_exact_request_fields.txt
          if ! git diff --cached --quiet; then git commit -m 'Trace exact Instagram 439 HDR request fields'; fi
          git pull --rebase origin main
          git push origin HEAD:main
