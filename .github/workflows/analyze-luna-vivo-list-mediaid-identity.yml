name: Verify Luna Vivo list mediaId identity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-luna-vivo-list-mediaid-identity.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/checkout@v4
      - name: Decode official Luna smali
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/out work/tools
          UA='Mozilla/5.0 (Linux; Android 16; V2329A) AppleWebKit/537.36 Chrome/143 Mobile Safari/537.36'
          curl -L --retry 3 --connect-timeout 15 --max-time 240 -A "$UA" 'https://ugapk.com/GMg3' -o work/Luna_official.apk
          test "$(head -c 4 work/Luna_official.apk | xxd -p)" = '504b0304'
          sha256sum work/Luna_official.apk | tee work/out/apk.sha256
          curl -L --fail --retry 3 -o work/tools/apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          java -jar work/tools/apktool.jar d -f -r work/Luna_official.apk -o work/decoded

      - name: Join browser row ID to playable ID
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('work/decoded')
          out=Path('work/out')
          keys=('vivomusicmix_current_list','VIVO_MUSIC_MIX_ROOT','com.vivo.musicwidgetmix')
          browser=[]; joined=[]; hits=[]
          for p in root.glob('smali*/**/*.smali'):
              try: s=p.read_text(errors='ignore')
              except Exception: continue
              if any(k in s for k in keys):
                  browser.append((p,s))
              if ('getPlayableId()Ljava/lang/String;' in s and
                  ('setMediaId(Ljava/lang/String;)' in s or 'MediaBrowserCompat$MediaItem' in s or 'android.media.metadata.MEDIA_ID' in s)):
                  for m in re.finditer(r'(?ms)^\.method .*?^\.end method',s):
                      b=m.group(0)
                      if ('getPlayableId()Ljava/lang/String;' in b and
                          ('setMediaId(Ljava/lang/String;)' in b or 'MediaBrowserCompat$MediaItem' in b or 'android.media.metadata.MEDIA_ID' in b)):
                          joined.append((p,b))
              if ('getPlayableId()Ljava/lang/String;' in s or 'setMediaId(Ljava/lang/String;)' in s):
                  for i,line in enumerate(s.splitlines(),1):
                      if 'getPlayableId()Ljava/lang/String;' in line or 'setMediaId(Ljava/lang/String;)' in line:
                          hits.append(f'{p}:{i}:{line.strip()}')
          (out/'vivo-browser-files.txt').write_text('\n'.join(str(p) for p,_ in browser))
          (out/'vivo-browser-full.txt').write_text('\n'.join(f'===== {p} =====\n{s}' for p,s in browser))
          (out/'identity-methods.txt').write_text('\n'.join(f'===== {p} =====\n{b}' for p,b in joined))
          (out/'id-hits.txt').write_text('\n'.join(hits))
          print('browser files:', len(browser))
          for p,_ in browser: print('BROWSER',p)
          print('joined methods:', len(joined))
          for p,b in joined:
              print('===== JOIN',p,'=====')
              print(b[:12000])
          PY

      - name: Upload identity RE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-vivo-list-mediaid-identity-fast
          path: work/out
          retention-days: 7
