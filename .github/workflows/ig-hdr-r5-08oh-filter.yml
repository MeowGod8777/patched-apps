name: IG 439 HDR R5 08oh Filter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-r5-08oh-filter.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact R8 and disassemble classes2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -p "work/$APK_NAME" classes2.dex > work/classes2.dex
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          java -jar work/baksmali-3.0.10-fat.jar d work/classes2.dex -o work/dis
          test -f work/dis/X/08oh.smali
      - name: Extract X.08oh hierarchy and filter methods
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('work/dis')
          p=root/'X/08oh.smali'
          lines=p.read_text(errors='replace').splitlines()
          out=['Instagram 439 X.08oh mixed-codec filter','=======================================','']
          out.append('===== CLASS HEADER/FIELDS =====')
          out.extend(lines[:220])
          out.append('')

          targets=[
            'A0b(Ljava/util/List;)Ljava/util/List;',
            'A0c(Ljava/util/List;)Ljava/util/List;',
            'A0S(Landroid/net/Uri;Lorg/xmlpull/v1/XmlPullParser;)LX/08rn;',
          ]
          inv_re=re.compile(r'invoke-[^\s]+\s+\{[^}]*\},\s+(LX/[^;]+;)->([^\s(]+)\(([^)]*)\)(\S+)')
          callees=[]
          def body_for(ls,target):
            ss=[i for i,l in enumerate(ls) if l.startswith('.method') and target in l]
            if len(ss)!=1: return None
            s=ss[0]; e=next(i for i in range(s+1,len(ls)) if ls[i].startswith('.end method'))
            return ls[s:e+1]

          for t in targets:
            out.append(f'===== X.08oh {t} =====')
            b=body_for(lines,t)
            if b is None:
              out.append('NOT_FOUND')
              continue
            out.append(f'LINES={len(b)}')
            out.extend(b); out.append('')
            for l in b:
              m=inv_re.search(l)
              if m:
                sig=(m.group(1),m.group(2),m.group(3),m.group(4))
                if sig not in callees: callees.append(sig)

          out.append('===== DIRECT X CALLEES =====')
          for cls,name,args,ret in callees:
            sig=f'{cls}->{name}({args}){ret}'
            out.append(f'--- {sig} ---')
            fp=root/(cls[2:-1]+'.smali')
            if not fp.exists():
              out.append('MISSING_IN_CLASSES2'); continue
            ls=fp.read_text(errors='replace').splitlines()
            b=body_for(ls,name+'('+args+')'+ret)
            if b is None:
              out.append('NOT_FOUND_OR_AMBIG'); continue
            out.append(f'LINES={len(b)}')
            if len(b)<=500: out.extend(b)
            else: out.extend(b[:200]); out.append(f'... OMITTED {len(b)-400} ...'); out.extend(b[-200:])
            out.append('')

          path=Path('research/generated/instagram_439_hdr_r5_08oh_filter.txt')
          text='\n'.join(out)+'\n'
          if len(text.encode())>90000: raise SystemExit(f'report too large {len(text.encode())}')
          path.write_text(text,encoding='utf-8')
          print(f'REPORT_BYTES={path.stat().st_size}')
          print(path.read_text())
          if 'A0b(Ljava/util/List;)' not in text: raise SystemExit('A0b absent')
          PY
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_r5_08oh_filter.txt
          if ! git diff --cached --quiet; then git commit -m 'Extract Instagram 439 08oh mixed-codec filter'; fi
          git pull --rebase origin main
          git push origin HEAD:main
