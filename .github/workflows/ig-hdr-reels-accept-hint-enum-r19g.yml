name: IG 439 HDR Reels Accept Hint Enum R19g

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-reels-accept-hint-enum-r19g.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact APK and disassemble relevant dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          # classes15 contains 02qh/02po/03Hy; scan all dexes for exact class refs to capture callers.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          toks=['LX/02qh;','LX/02po;','feed/reels_media_stream/']
          hits=[]
          for p in sorted(Path('work/apk').glob('classes*.dex')):
              s=subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace').stdout
              if any(t in s for t in toks): hits.append(p.name)
          if 'classes15.dex' not in hits: hits.append('classes15.dex')
          hits=sorted(set(hits))
          Path('work/hitdex.txt').write_text('\n'.join(hits)+'\n')
          print('HITDEX',hits)
          PY
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait
      - name: Extract enum mapper object and media-stream callers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('work/smali')
          O=['Instagram 439 Reels media stream Accept-Hint enum R19g','==================================================','']
          cr=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          targets={'LX/02qh;','LX/02po;','LX/03Hy;'}
          target_methods=[]; refs=[]
          for p in root.rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); cls='?'
              for x in ls[:50]:
                  m=cr.match(x)
                  if m: cls=m.group(1); break
              i=0
              while i<len(ls):
                  if not ls[i].startswith('.method'): i+=1; continue
                  s=i; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                  e=min(i,len(ls)-1); b=ls[s:e+1]; text='\n'.join(b)
                  if cls in targets:
                      target_methods.append((cls,ls[s],str(p),b))
                  if ('LX/02po;->A00:Ljava/lang/Integer;' in text or
                      'LX/02po;-><init>' in text or
                      'LX/03Hy;->A00' in text or
                      'LX/02qh;->A00' in text):
                      refs.append((cls,ls[s],str(p),b))
                  i+=1
          O += ['===== TARGET CLASSES =====','']
          for cls,sig,p,b in target_methods:
              O += [f'--- {cls} {sig}',f'FILE={p}']+b+['']
          O += [f'===== EXACT REFS/CALLERS ({len(refs)}) =====','']
          for cls,sig,p,b in refs:
              lits=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"(.*)"','\n'.join(b))
              O += [f'--- {cls} {sig}',f'FILE={p}',f'LITERALS={lits}']+b+['']
          Path('research/generated/instagram_439_hdr_reels_accept_hint_enum_r19g.txt').write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:6000])); print('refs',len(refs))
          PY
      - name: Commit R19g report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_reels_accept_hint_enum_r19g.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Reels media stream Accept-Hint enum trace R19g'
            git pull --rebase origin main
            git push origin HEAD:main
          fi