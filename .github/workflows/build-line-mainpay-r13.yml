name: Build LINE 26.14 main-pay redirect R13

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-line-mainpay-r13.yml
      - .github/scripts/build-line-mainpay-r13.sh

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build-line-mainpay-r13.sh
