name: IG 439 HDR DASH Manifest Construction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dash-manifest-construction.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download and disassemble exact R8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do
            b="$(basename "$d" .dex)"
            "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
          done

      - name: Trace manifest model construction and filtering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          mh=re.compile(r'\|\[[0-9a-f]+\]\s+([^\s]+):')
          methods=[]
          for p in sorted(Path('work/dis').glob('classes*.txt')):
              lines=p.read_text(errors='replace').splitlines()
              starts=[]; heads=[]
              for i,l in enumerate(lines):
                  m=mh.search(l)
                  if m:
                      starts.append(i); heads.append(m.group(1))
              for j,s in enumerate(starts):
                  e=starts[j+1] if j+1<len(starts) else len(lines)
                  methods.append((p.name,s+1,e,heads[j],lines[s:e]))

          def semantic(b):
              out=[]
              for l in b:
                  if any(x in l for x in (
                      'const-string','invoke-','new-instance','check-cast','instance-of',
                      'iget-','iput-','sget-','sput-','if-','goto','switch','return-',
                      'LX/08rn;','LX/08tp;','LX/08ti;','LX/03oR;',
                      'MediaCodec','MediaFormat','profile','codec','Codec','hdr','HDR',
                      'color','Color','Representation','Adaptation','Dash','dash',
                      'mime','Mime','bitrate','bandwidth','width','height','frameRate'
                  )):
                      out.append(l.rstrip())
              return out

          report=[
              'Instagram 439 DASH manifest construction / pre-selector filter trace',
              '===================================================================',
              'APK SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8',
              ''
          ]

          # Constructor callers reveal the parser/build chain and whether lists are filtered before model creation.
          ctor_targets={
              'LX/08rn;.<init>':'Dash manifest model',
              'LX/08tp;.<init>':'Period model',
              'LX/08ti;.<init>':'AdaptationSet model',
          }
          for needle,label in ctor_targets.items():
              report += [f'===== {label}: callers of {needle} =====']
              n=0
              for p,s,e,h,b in methods:
                  txt='\n'.join(b)
                  if needle in txt and needle not in h:
                      n+=1
                      report += [f'--- {p}:{s}-{e} :: {h}'] + semantic(b)[:420] + ['']
              report += [f'CALLER_COUNT={n}','']

          # Exact list-field consumers. A0R = manifest period list, A03 = period adaptation sets,
          # A0E = adaptation set representation list in the already-proven selector path.
          fields=(
              'LX/08rn;.A0R:Ljava/util/List;',
              'LX/08tp;.A03:Ljava/util/List;',
              'LX/08ti;.A0E:Ljava/util/List;',
          )
          report += ['===== model-list field consumers =====']
          n=0
          for p,s,e,h,b in methods:
              txt='\n'.join(b)
              hits=[x for x in fields if x in txt]
              if hits:
                  n+=1
                  report += [f'--- {p}:{s}-{e} :: {h}','FIELDS='+' | '.join(hits)] + semantic(b)[:360] + ['']
          report += [f'FIELD_CONSUMER_COUNT={n}','']

          # Parser candidates: any method that constructs AdaptationSet and also mentions XML/parser/media descriptors.
          clues=('Representation','AdaptationSet','Period','mimeType','contentType','codecs','frameRate','bandwidth','audioSamplingRate','BaseURL','SegmentBase','SegmentTemplate','SegmentList','Role','SupplementalProperty','EssentialProperty')
          report += ['===== likely DASH XML/parser construction methods =====']
          n=0
          for p,s,e,h,b in methods:
              txt='\n'.join(b)
              if ('LX/08ti;.<init>' in txt or 'LX/08tp;.<init>' in txt or 'LX/08rn;.<init>' in txt) and any(c.lower() in txt.lower() for c in clues):
                  n+=1
                  report += [f'--- {p}:{s}-{e} :: {h}'] + semantic(b)[:520] + ['']
          report += [f'PARSER_CANDIDATE_COUNT={n}','']

          # Search for any HDR/10-bit/profile gate in a method touching this DASH model chain.
          gate_clues=('hdr','st2084','hlg','bt2020','10bit','10_bit','bit_depth','profile','av01','video/av01','dolby')
          chain=('LX/08rn;','LX/08tp;','LX/08ti;','LX/03oR;')
          report += ['===== HDR/profile clues inside DASH model-chain methods =====']
          n=0
          for p,s,e,h,b in methods:
              txt='\n'.join(b)
              if any(c in txt for c in chain) and any(g in txt.lower() for g in gate_clues):
                  n+=1
                  report += [f'--- {p}:{s}-{e} :: {h}'] + semantic(b)[:420] + ['']
                  if n>=120: break
          report += [f'HDR_PROFILE_CHAIN_METHOD_COUNT_SHOWN={n}','']

          # Exact methods that can drop/remove elements from lists while also touching AdaptationSet/Representation model.
          drop_calls=('remove','removeIf','retainAll','clear','filter','isFormatSupported','supportsFormat','supports')
          report += ['===== possible pre-selector list-drop methods =====']
          n=0
          for p,s,e,h,b in methods:
              txt='\n'.join(b)
              if ('LX/08ti;' in txt or 'LX/03oR;' in txt) and any(d.lower() in txt.lower() for d in drop_calls):
                  n+=1
                  report += [f'--- {p}:{s}-{e} :: {h}'] + semantic(b)[:420] + ['']
                  if n>=100: break
          report += [f'LIST_DROP_METHOD_COUNT_SHOWN={n}','']

          out=Path('research/generated/instagram_439_hdr_dash_manifest_construction.txt')
          out.write_text('\n'.join(report)+'\n',encoding='utf-8')
          print(out.read_text()[:240000])
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_dash_manifest_construction.txt
          if ! git diff --cached --quiet; then
            git commit -m "Trace Instagram 439 DASH manifest construction"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
