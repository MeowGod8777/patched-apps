name: IG 439 HDR Accept Hint R19f

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-accept-hint-r19f.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Fetch exact APK and disassemble Accept-Hint hit dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          needles=['X-IG-Accept-Hint','LX/02qh','ClipsApiUtilHelper','ClipsContainerModule']
          hit=[]
          for p in sorted(Path('work/apk').glob('classes*.dex')):
              s=subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace').stdout
              if any(n in s for n in needles): hit.append(p.name)
          Path('work/hitdex.txt').write_text('\n'.join(hit)+'\n')
          print('HITDEX',hit)
          PY
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait

      - name: Extract all Accept-Hint writes mapping and MC owner refs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          ROOT=Path('work/smali')
          OUT=Path('research/generated/instagram_439_hdr_accept_hint_r19f.txt')
          cls_re=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          meth_re=re.compile(r'^\.method')
          ref_re=re.compile(r'(L[^;]+;)->([^\s(]+)\(([^)]*)\)(\S+)')
          methods=[]
          for p in ROOT.rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); cls='?'
              for x in ls[:50]:
                  m=cls_re.match(x)
                  if m: cls=m.group(1); break
              i=0
              while i<len(ls):
                  if not ls[i].startswith('.method'): i+=1; continue
                  s=i; sig=ls[i]; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                  e=min(i,len(ls)-1); methods.append((cls,sig,p,ls[s:e+1])); i+=1

          O=['Instagram 439 HDR X-IG-Accept-Hint R19f','==========================================','']

          hits=[]
          for cls,sig,p,b in methods:
              if 'X-IG-Accept-Hint' in '\n'.join(b): hits.append((cls,sig,p,b))
          O += [f'===== ALL X-IG-ACCEPT-HINT METHODS ({len(hits)}) =====','']
          for cls,sig,p,b in hits:
              O += [f'--- {cls} {sig}',f'FILE={p}'] + b + ['']

          # Exact mapping helper used by feed/reels Accept-Hint.
          qh=[m for m in methods if m[0]=='LX/02qh;']
          O += [f'===== LX/02qh METHODS ({len(qh)}) =====','']
          for cls,sig,p,b in qh:
              O += [f'--- {sig}',f'FILE={p}'] + b + ['']

          # References to the MobileConfig gate that enables A06 hardcoded feed hint.
          mc='0x81096800023542L'
          mch=[]
          for cls,sig,p,b in methods:
              if mc in '\n'.join(b): mch.append((cls,sig,p,b))
          O += [f'===== MC {mc} REFERENCES ({len(mch)}) =====','']
          for cls,sig,p,b in mch:
              O += [f'--- {cls} {sig}',f'FILE={p}'] + b + ['']

          # All methods invoking 02qh.A00 so we know every semantic owner of its enum/string mapping.
          qhref=[]
          needle='LX/02qh;->A00(Ljava/lang/Integer;)Ljava/lang/String;'
          for cls,sig,p,b in methods:
              if needle in '\n'.join(b): qhref.append((cls,sig,p,b))
          O += [f'===== LX/02qh.A00 CALLERS ({len(qhref)}) =====','']
          for cls,sig,p,b in qhref:
              O += [f'--- {cls} {sig}',f'FILE={p}'] + b + ['']

          OUT.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:4500]))
          print('bytes',OUT.stat().st_size,'hint_methods',len(hits),'qh',len(qh),'mc_refs',len(mch),'qh_callers',len(qhref))
          PY

      - name: Commit R19f report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_accept_hint_r19f.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add exact X-IG-Accept-Hint trace R19f'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
