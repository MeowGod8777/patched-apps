name: IG 439 HDR Device Profile Link R19l2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ig-hdr-device-profile-link-r19l2.yml]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Disassemble exact profile/identity dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali/c4 work/smali/c12 work/smali/c15 research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" classes4.dex classes12.dex classes15.dex -d work/apk
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes4.dex -o work/smali/c4 >/dev/null &
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes12.dex -o work/smali/c12 >/dev/null &
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes15.dex -o work/smali/c15 >/dev/null &
          wait
      - name: Extract static-event HDR serializer and request identity linkage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots=[Path('work/smali/c4'),Path('work/smali/c12'),Path('work/smali/c15')]
          clsre=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          methods=[]
          for root in roots:
            for p in root.rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); cls='?'
              for x in ls[:50]:
                m=clsre.match(x)
                if m: cls=m.group(1); break
              i=0
              while i<len(ls):
                if not ls[i].startswith('.method'): i+=1; continue
                s=i; sig=ls[i]; i+=1
                while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                methods.append((cls,sig,p,ls[s:min(i+1,len(ls))])); i+=1
          O=['Instagram 439 HDR device-profile linkage R19l2','==========================================','']
          needles=['ig_device_static_attributes','key_display_hdr_supported','key_video_decoder_hdr_supported','X-IG-Device-ID','com.facebook.devicesegmentation']
          seeds=[]
          for m in methods:
            text='\n'.join(m[3])
            hits=[n for n in needles if n.lower() in text.lower()]
            if hits: seeds.append((*m,hits))
          O += [f'SEED_COUNT={len(seeds)}','']
          keys=[]
          for cls,sig,p,b,hits in seeds:
            O += [f'===== SEED {hits} {cls} {sig} FILE={p} =====']
            if len(b)<900: O += b
            else:
              for i,x in enumerate(b):
                if any(n.lower() in x.lower() for n in hits): O += b[max(0,i-90):min(len(b),i+110)]
            mm=re.search(r'\s([^\s(]+)\(([^)]*)\)(\S+)$',sig)
            if mm: keys.append((cls,mm.group(1),mm.group(2),mm.group(3),hits))
            O += ['']
          O += ['===== EXACT CALLERS OF SEEDS =====']
          for cls,sig,p,b in methods:
            txt='\n'.join(b); match=[]
            for kc,kn,ka,kr,hits in keys:
              if f'{kc}->{kn}({ka}){kr}' in txt: match.append((kc,kn,hits))
            if match:
              O += [f'--- {cls} {sig} FILE={p} TARGETS={match}']
              for i,x in enumerate(b):
                if any(f'{kc}->{kn}(' in x for kc,kn,_ in match): O += b[max(0,i-80):min(len(b),i+100)]
              O += ['']
          # Joint evidence within a single method/class.
          O += ['===== JOINT TOKEN METHODS =====']
          groups=[('STATIC+ID',['ig_device_static_attributes','X-IG-Device-ID']),('HDR+ID',['key_display_hdr_supported','X-IG-Device-ID']),('STATIC+SEG',['ig_device_static_attributes','deviceseg']),('HDR+SEG',['key_display_hdr_supported','deviceseg'])]
          for cls,sig,p,b in methods:
            low='\n'.join(b).lower()
            for label,toks in groups:
              if all(t.lower() in low for t in toks): O += [f'{label}: {cls} {sig} FILE={p}']+b+['']
          out=Path('research/generated/instagram_439_hdr_device_profile_link_r19l2.txt')
          out.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:14000])); print('bytes',out.stat().st_size,'seeds',len(seeds))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_device_profile_link_r19l2.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add fixed device profile identity linkage trace R19l2'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
