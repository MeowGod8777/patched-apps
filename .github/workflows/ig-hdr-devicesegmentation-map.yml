name: IG 439 Device Segmentation Map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-devicesegmentation-map.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Download and dexdump
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          set -euo pipefail
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do b="$(basename "$d" .dex)"; "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"; done
      - name: Trace device segmentation package and refs
        run: |
          set -euo pipefail
          REPORT=research/generated/instagram_439_hdr_devicesegmentation_map.txt
          {
            echo '===== PACKAGE DESCRIPTORS / STRINGS ====='
            grep -aHn -B 60 -A 180 -Ei 'com/instagram/devicesegmentation|devicesegmentation|device_segment|device.?tier|performance.?tier|benchmark.?score|performance.?score|segment.?score|device.?classification' work/dis/*.txt || true
            echo
            echo '===== JNI / PERF RUNNER REFERENCES ====='
            grep -aHn -B 140 -A 260 -E 'PerfMetricRunnerJni|LX/0Aix;|LX/08lG;' work/dis/*.txt || true
          } | tr -cd '\11\12\15\40-\176' > "$REPORT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research/generated/instagram_439_hdr_devicesegmentation_map.txt'); b=p.read_bytes(); p.write_bytes(b[:380000])
          PY
          sed -n '1,4800p' "$REPORT"
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_devicesegmentation_map.txt
          if ! git diff --cached --quiet; then git commit -m 'Map Instagram 439 device segmentation pipeline'; fi
          git pull --rebase origin main
          git push origin HEAD:main
