name: IG 439 HDR Accept Hint Mapper R19g

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-accept-hint-mapper-r19g.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact APK and disassemble targeted dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          needles=['X-IG-Accept-Hint','LX/02qh','ClipsApiUtilHelper','ClipsViewerPrefetcher','ClipsHeadMediaInsertionHelper']
          hit=[]; rows=[]
          for p in sorted(Path('work/apk').glob('classes*.dex')):
              s=subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace').stdout
              hs=[n for n in needles if n in s]
              if hs:
                  hit.append(p.name); rows.append(f'{p.name}: {hs}')
          Path('work/hitdex.txt').write_text('\n'.join(hit)+'\n')
          print('\n'.join(rows)); print('HITDEX',hit)
          PY
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait
      - name: Extract mapper values routes and exact A06 call contexts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          R=Path('work/smali')
          O=['Instagram 439 HDR Accept-Hint mapper + A06 exact args R19g','=======================================================','']
          cls_re=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          methods=[]
          for p in R.rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); cls='?'
              for x in ls[:60]:
                  m=cls_re.match(x)
                  if m: cls=m.group(1); break
              i=0
              while i<len(ls):
                  if not ls[i].startswith('.method'): i+=1; continue
                  s=i; sig=ls[i]; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                  e=min(i,len(ls)-1); methods.append((cls,sig,p,ls[s:e+1])); i+=1
          # Mapper class full body.
          O += ['===== LX/02qh FULL CLASS =====']
          for p in R.rglob('02qh.smali'):
              O += [f'FILE={p}']+p.read_text(errors='replace').splitlines()+['']
          # Every header writer compact full method if <500 lines, otherwise around literal.
          O += ['===== ALL X-IG-Accept-Hint WRITERS =====']
          for cls,sig,p,b in methods:
              idx=[i for i,x in enumerate(b) if 'X-IG-Accept-Hint' in x]
              if not idx: continue
              strings=[]
              for x in b:
                  m=re.search(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',x)
                  if m: strings.append(m.group(1))
              routes=[s for s in strings if '/' in s or 'feed' in s.lower() or 'reel' in s.lower() or 'clip' in s.lower() or 'story' in s.lower()]
              O += [f'--- {cls} {sig}',f'FILE={p}',f'ROUTEISH={routes}',f'ALL_STRINGS={strings}']
              if len(b)<=500: O += b
              else:
                  for i in idx: O += b[max(0,i-80):min(len(b),i+90)]
              O += ['']
          # Exact two primary Reels callers and 220 lines surrounding A06 invocation.
          target='Lcom/instagram/clips/api/ClipsApiUtilHelper;->A06(Lcom/instagram/common/session/UserSession;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;I)LX/02ue;'
          O += ['===== PRIMARY A06 CALLS + 220-LINE DATAFLOW =====']
          for cls,sig,p,b in methods:
              if cls not in ('LX/01Jw;','LX/01Jv;'): continue
              for i,x in enumerate(b):
                  if target not in x: continue
                  O += [f'--- {cls} {sig}',f'FILE={p}',f'CALL_INDEX={i}',x,'[PRE220_POST30]']+b[max(0,i-220):min(len(b),i+31)]+['']
          # All A06 callsites compact arg register plus p/v alias map based on .registers.
          O += ['===== ALL A06 CALLSITE REGISTER MAPS =====']
          for cls,sig,p,b in methods:
              for i,x in enumerate(b):
                  if target not in x: continue
                  regm=re.search(r'\.registers\s+(\d+)', '\n'.join(b[:8])); nreg=int(regm.group(1)) if regm else None
                  ps=re.search(r'\(([^)]*)\)',sig)
                  params=ps.group(1) if ps else ''
                  # Count Dalvik parameter words; no long/double in primary caller signatures but handle generally.
                  types=re.findall(r'\[*[ZBSCIFJD]|\[*L[^;]+;',params)
                  is_static=' static ' in (' '+sig+' ')
                  words=sum(2 if t in ('J','D') else 1 for t in types)+(0 if is_static else 1)
                  alias_start=nreg-words if nreg is not None else None
                  O += [f'{cls} {sig}',f'CALL={x}',f'REGISTERS={nreg} PARAM_WORDS={words} PARAM_V_START={alias_start}']
                  if alias_start is not None:
                      aliases=[]; w=alias_start
                      if not is_static:
                          aliases.append(f'v{w}=p_this'); w+=1
                      pi=0
                      for t in types:
                          aliases.append(f'v{w}=p{pi}:{t}'); w += 2 if t in ('J','D') else 1; pi+=1
                      O += ['ALIASES='+', '.join(aliases)]
                  O += ['']
          out=Path('research/generated/instagram_439_hdr_accept_hint_mapper_r19g.txt')
          out.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:9000])); print('bytes',out.stat().st_size)
          PY
      - name: Commit R19g report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_accept_hint_mapper_r19g.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Accept-Hint mapper and A06 exact argument trace R19g'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
