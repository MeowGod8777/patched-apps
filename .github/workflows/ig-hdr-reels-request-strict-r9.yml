name: IG 439 Reels HDR Request Strict R9

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ig-hdr-reels-request-strict-r9.yml]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Download and dexdump exact APK
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          set -euo pipefail
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do "$DEXDUMP" -d -f -h "$d" > "work/dis/$(basename "$d" .dex).txt"; done
      - name: Strict cooccurrence scan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          caps=['hdr','av1','hevc','manifest_capabilities','device_capabilities','mixed_codec_manifest','supported_codecs','codec_capabilities','media_capabilities','playback_capabilities','device_tier','device_class','device_score']
          req=['GraphQlCallInput','LX/05xm;','LX/00K8;','api/v1','LX/0F0k;','LX/03Da;']
          media=['reels','clips','media','feed','video','dash','manifest']
          out=['Instagram 439 strict HDR request gate scan','==========================================','']
          matches=[]
          for p in sorted(Path('work/dis').glob('classes*.txt')):
            ls=p.read_text(errors='ignore').splitlines()
            starts=[i for i,l in enumerate(ls) if '|[' in l and re.search(r'\]\s+[^\s]+\.[^\s]+:',l)]
            for n,s in enumerate(starts):
              e=starts[n+1] if n+1<len(starts) else min(len(ls),s+3500)
              b=ls[s:e]; low='\n'.join(b).lower()
              ch=[x for x in caps if x.lower() in low]
              rh=[x for x in req if x.lower() in low]
              mh=[x for x in media if x.lower() in low]
              if ch and rh and mh:
                score=10*len([x for x in ch if x!='hdr'])+3*len(rh)+len(mh)
                matches.append((score,p.name,s,b,ch,rh,mh))
          matches.sort(reverse=True,key=lambda x:x[0])
          out.append(f'matches={len(matches)}')
          for score,pn,s,b,ch,rh,mh in matches[:100]:
            out += ['',f'===== SCORE {score} {pn}:{s+1} caps={ch} req={rh} media={mh} =====',b[0]]
            ids=[i for i,l in enumerate(b) if any(x.lower() in l.lower() for x in ch+rh+mh)]
            a=max(0,min(ids)-100); z=min(len(b),max(ids)+150,900)
            out.extend(b[a:z])
          Path('research/generated/instagram_439_hdr_reels_request_strict_r9.txt').write_text('\n'.join(out)[:850000])
          print('matches',len(matches))
          PY
          wc -c research/generated/instagram_439_hdr_reels_request_strict_r9.txt
          sed -n '1,700p' research/generated/instagram_439_hdr_reels_request_strict_r9.txt
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_reels_request_strict_r9.txt
          if ! git diff --cached --quiet; then git commit -m 'Add strict Instagram HDR media request gate trace'; fi
          git pull --rebase origin main
          git push origin HEAD:main
