name: IG 439 HDR Clips Request Finalization R19h

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-clips-request-finalization-r19h.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact APK and disassemble request-infra dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          needles=['LX/02pu;','LX/02ue;','LX/02pz;','LX/0AOo;','LX/03u7;','ClipsApiUtilHelper','X-IG-Accept-Hint',
                   'display_hdr_supported','video_decoder_hdr_supported','is_av1_hdr_supported','is_hevc_hdr_supported',
                   'device_capabilities','hdr_supported_types','media_delivery','playback_format']
          hit=[]; rows=[]
          for p in sorted(Path('work/apk').glob('classes*.dex')):
              s=subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace').stdout
              hs=[n for n in needles if n.lower() in s.lower()]
              if hs:
                  hit.append(p.name); rows.append(f'{p.name}: '+', '.join(hs))
          # core owners are in early dexes even where strings(1) descriptor format is lossy
          for x in ['classes.dex','classes2.dex','classes15.dex']:
              if (Path('work/apk')/x).exists() and x not in hit: hit.append(x)
          Path('work/hitdex.txt').write_text('\n'.join(sorted(set(hit)))+'\n')
          Path('research/generated/instagram_439_hdr_clips_request_infra_dex_hits_r19h.txt').write_text('\n'.join(rows)+'\n')
          print('\n'.join(rows)); print('HITDEX',sorted(set(hit)))
          PY
          while read d; do
            [ -n "$d" ] || continue
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/${d%.dex}" >/dev/null &
          done < work/hitdex.txt
          wait

      - name: Extract request finalization and capability intersections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          ROOT=Path('work/smali'); OUT=Path('research/generated/instagram_439_hdr_clips_request_finalization_r19h.txt')
          cr=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          sr=re.compile(r'^\s*const-string(?:/jumbo)?\s+[^,]+,\s+"(.*)"')
          ir=re.compile(r'(L[^;]+;)->([^\s(]+)\(([^)]*)\)(\S+)')
          methods=[]
          for p in ROOT.rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); cls='?'
              for x in ls[:50]:
                  m=cr.match(x)
                  if m: cls=m.group(1); break
              i=0
              while i<len(ls):
                  if not ls[i].startswith('.method'): i+=1; continue
                  s=i; sig=ls[i]; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                  b=ls[s:min(i+1,len(ls))]; methods.append((cls,sig,p,b)); i+=1

          O=['Instagram 439 HDR clips/items request finalization R19h','=====================================================','']

          # Full core classes: constructor semantics, A0K/finalize path, result request wrapper.
          for target in ['LX/02pu;','LX/02ue;','LX/02pz;','LX/0AOo;','LX/03u7;','LX/0AMH;']:
              found=[m for m in methods if m[0]==target]
              O += [f'===== CORE CLASS {target} methods={len(found)} =====']
              for cls,sig,p,b in found:
                  text='\n'.join(b).lower()
                  if target in ['LX/02pu;','LX/02ue;','LX/02pz;'] or '<init>' in sig or ' A0K(' in sig or ' AMu(' in sig or ' AOA(' in sig or ' A0F(' in sig:
                      O += [f'FILE={p}',sig]+b+['']

          # Exact calls to 02pu ctor with arg5-like integer plus one-hop consumers of returned 02ue.
          O += ['===== LX/02pu CONSTRUCTOR CALLS =====','']
          for cls,sig,p,b in methods:
              for i,l in enumerate(b):
                  if 'LX/02pu;-><init>(LX/04BG;IIZ)V' in l:
                      O += [f'--- {cls} {sig} FILE={p} INDEX={i}']+b[max(0,i-45):min(len(b),i+50)]+['']

          O += ['===== LX/02ue CONSUMERS WITH DELIVERY/CODEC/HDR STRINGS =====','']
          keys=('hdr','codec','av1','hevc','vp9','dash','manifest','delivery','playback','quality','rendition','capabil','device','stream')
          for cls,sig,p,b in methods:
              text='\n'.join(b); low=text.lower()
              if 'LX/02ue;' not in text: continue
              vals=[]
              for l in b:
                  m=sr.match(l)
                  if m and any(k in m.group(1).lower() for k in keys): vals.append(m.group(1))
              if vals:
                  O += [f'--- {cls} {sig} FILE={p}',f'KEY_STRINGS={vals}']+b+['']

          # Strong intersection: any method touching request builder or wrapper AND known HDR/device capability terms.
          cap=('display_hdr_supported','video_decoder_hdr_supported','is_av1_hdr_supported','is_hevc_hdr_supported','hdr_supported_types','supported_display_hdr_types','device_capabilities','media_codec_info','profile_levels')
          req=('LX/03u7;','LX/02pu;','LX/02ue;','LX/0AMH;','AMu(','AOA(','A0F(')
          O += ['===== REQUEST x HDR/CAPABILITY STRONG INTERSECTIONS =====','']
          count=0
          for cls,sig,p,b in methods:
              text='\n'.join(b); low=text.lower()
              if not any(r.lower() in low for r in req): continue
              ch=[c for c in cap if c in low]
              if not ch: continue
              count+=1
              O += [f'--- {cls} {sig} FILE={p}',f'CAP={ch}']+b+['']
          O += [f'INTERSECTION_COUNT={count}','']

          # All AMu header writes in same classes/call graph neighborhood of ClipsApi / 02pu / 02ue.
          neighborhood=set()
          for cls,sig,p,b in methods:
              text='\n'.join(b)
              if any(x in text for x in ['ClipsApiUtilHelper;->A06','LX/02pu;','LX/02ue;']): neighborhood.add(cls)
          O += ['===== HEADER WRITES IN REQUEST-INFRA NEIGHBORHOOD =====','']
          for cls,sig,p,b in methods:
              if cls not in neighborhood: continue
              for i,l in enumerate(b):
                  if 'LX/03u7;->AMu(Ljava/lang/String;Ljava/lang/String;)V' in l:
                      O += [f'--- {cls} {sig} FILE={p} INDEX={i}']+b[max(0,i-18):min(len(b),i+8)]+['']

          OUT.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:8000])); print('bytes',OUT.stat().st_size,'intersection',count)
          PY
      - name: Commit reports
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_clips_request_infra_dex_hits_r19h.txt research/generated/instagram_439_hdr_clips_request_finalization_r19h.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add clips/items request finalization trace R19h'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
