name: IG 439 HDR Streaming ID Sink R19i

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-streaming-id-sink-r19i.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch APK and disassemble classes2/classes13
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" classes2.dex classes13.dex -d work/apk
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes2.dex -o work/smali/classes2 >/dev/null &
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes13.dex -o work/smali/classes13 >/dev/null &
          wait
      - name: Extract ID propagation and execution sinks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          R=Path('work/smali'); O=['Instagram 439 HDR streaming ID sink R19i','========================================','']
          cr=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          methods=[]; classes={}
          for p in R.rglob('*.smali'):
            ls=p.read_text(errors='replace').splitlines(); cls='?'
            for x in ls[:50]:
              m=cr.match(x)
              if m: cls=m.group(1); break
            classes[cls]=(p,ls)
            i=0
            while i<len(ls):
              if not ls[i].startswith('.method'): i+=1; continue
              s=i; sig=ls[i]; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              e=min(i,len(ls)-1); methods.append((cls,sig,p,ls[s:e+1])); i+=1
          for t in ['LX/02tw;','LX/02ty;','LX/02ud;','LX/02ug;','LX/01nz;','LX/0Zvn;']:
            O += [f'===== FULL {t} =====']
            if t in classes:
              p,ls=classes[t]; O += [f'FILE={p}']+ls+['']
            else: O += ['NOT_FOUND','']
          # exact 02xV A01 only
          for cls,sig,p,b in methods:
            if cls=='LX/02xV;' and ' A01(' in sig:
              O += [f'===== LX/02xV {sig} =====',f'FILE={p}']+b+['']
          # consumers of D7J (invoke-interface or invoke-virtual)
          O += ['===== ALL D7J()I CONSUMERS IN classes2/classes13 =====','']
          for cls,sig,p,b in methods:
            for i,l in enumerate(b):
              if '->D7J()I' in l:
                lo=max(0,i-30); hi=min(len(b),i+35)
                O += [f'--- {cls} {sig}',f'FILE={p}',f'INDEX={i}']+[f'{j:04d}: {b[j]}' for j in range(lo,hi)]+['']
          # 02tw A00 xrefs and 02ue constructor xrefs
          for key in ['LX/02tw;->A00(','LX/02ue;-><init>','LX/02ue;->D7J()I']:
            O += [f'===== XREF {key} =====']
            c=0
            for cls,sig,p,b in methods:
              for i,l in enumerate(b):
                if key in l:
                  c+=1; lo=max(0,i-25); hi=min(len(b),i+25)
                  O += [f'--- {cls} {sig}',f'FILE={p}']+[f'{j:04d}: {b[j]}' for j in range(lo,hi)]+['']
            O += [f'COUNT={c}','']
          out=Path('research/generated/instagram_439_hdr_streaming_id_sink_r19i.txt')
          out.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:12000])); print('bytes',out.stat().st_size)
          PY
      - name: Commit R19i report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_streaming_id_sink_r19i.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add streaming request ID sink trace R19i'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
