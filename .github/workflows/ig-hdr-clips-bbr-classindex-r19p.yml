name: IG 439 HDR Clips BBr ClassIndex R19p

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-clips-bbr-classindex-r19p.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Locate exact class definitions then disassemble only owning dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          : > work/hitdex.txt
          : > research/generated/instagram_439_hdr_clips_bbr_classindex_r19p.txt
          for d in work/apk/classes*.dex; do
            classes=$(java -jar work/baksmali-3.0.10-fat.jar list classes "$d" 2>/dev/null || true)
            if printf '%s\n' "$classes" | grep -Eq '^LX/(0Iwp|0Omv);$'; then
              basename "$d" >> work/hitdex.txt
              {
                echo "===== $(basename "$d") ====="
                printf '%s\n' "$classes" | grep -E '^LX/(0Iwp|0Omv);$'
              } >> research/generated/instagram_439_hdr_clips_bbr_classindex_r19p.txt
            fi
          done
          sort -u work/hitdex.txt -o work/hitdex.txt
          echo HITDEX; cat work/hitdex.txt
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research/generated/instagram_439_hdr_clips_bbr_classindex_r19p.txt')
          O=[p.read_text(errors='replace'),'','===== EXACT CLASS FILES =====','']
          for root in Path('work/smali').glob('classes*'):
              for rel in ('X/0Iwp.smali','X/0Omv.smali'):
                  q=root/rel
                  if q.exists(): O += [f'--- {q} ---',q.read_text(errors='replace'),'']
          p.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O))
          PY
      - name: Commit R19p report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_clips_bbr_classindex_r19p.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add BBr class index resolution R19p'
            git pull --rebase origin main
            git push origin HEAD:main
          fi