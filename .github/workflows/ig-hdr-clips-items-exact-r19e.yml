name: IG 439 HDR Clips Items Exact R19e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-clips-items-exact-r19e.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Fetch exact APK and disassemble all dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          for d in work/apk/classes*.dex; do
            n=$(basename "$d" .dex)
            java -jar work/baksmali-3.0.10-fat.jar d "$d" -o "work/smali/$n" >/dev/null &
          done
          wait

      - name: Extract A06 body exact params config gates and reverse callers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT=Path('work/smali')
          OUT=Path('research/generated/instagram_439_hdr_clips_items_exact_r19e.txt')
          target_cls='Lcom/instagram/clips/api/ClipsApiUtilHelper;'
          target_name='A06'
          target_args='Lcom/instagram/common/session/UserSession;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;I'
          target_ret='LX/02ue;'
          class_re=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          method_sig_re=re.compile(r'^\.method.*\s([^\s(]+)\(([^)]*)\)(\S+)$')
          inv_re=re.compile(r'(L[^;]+;)->([^\s(]+)\(([^)]*)\)(\S+)')
          str_re=re.compile(r'^\s*const-string(?:/jumbo)?\s+([^,]+),\s+"(.*)"')
          const_re=re.compile(r'^\s*const(?:/\w+)?(?:/\w+)?\s+([^,]+),\s+(-?0x[0-9a-fA-F]+|-?\d+)')

          methods=[]
          for p in ROOT.rglob('*.smali'):
            ls=p.read_text(errors='replace').splitlines(); cls='?'
            for x in ls[:50]:
              m=class_re.match(x)
              if m: cls=m.group(1); break
            i=0
            while i<len(ls):
              if not ls[i].startswith('.method'): i+=1; continue
              s=i; sig=ls[i]; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              e=min(i,len(ls)-1); b=ls[s:e+1]
              mm=method_sig_re.match(sig)
              if mm:
                methods.append((cls,mm.group(1),mm.group(2),mm.group(3),p,s,e,b,sig))
              i+=1

          target=None
          for m in methods:
            if m[0]==target_cls and m[1]==target_name and m[2]==target_args and m[3]==target_ret:
              target=m; break
          if not target:
            raise SystemExit('TARGET A06 NOT FOUND')

          cls,name,args,ret,p,s,e,b,sig=target
          text='\n'.join(b)
          strings=[]
          invokes=[]
          for l in b:
            sm=str_re.match(l)
            if sm: strings.append((sm.group(1),sm.group(2)))
            if 'invoke-' in l:
              im=inv_re.search(l)
              if im: invokes.append((im.group(1),im.group(2),im.group(3),im.group(4),l.strip()))

          # Resolve nearby const-wide values passed to MobileConfig BTb/CUf where possible.
          config_lines=[]
          for i,l in enumerate(b):
            if 'MobileConfigUnsafeContext;->BTb(J)Z' in l or 'MobileConfigUnsafeContext;->CUf(J)J' in l or 'MobileConfigUnsafeContext;->CUs(J)Ljava/lang/String;' in l:
              config_lines.append((i,l.strip(),b[max(0,i-8):min(len(b),i+5)]))

          # Direct exact callers across all disassembled dexes.
          callers=[]
          needle=f'{target_cls}->{target_name}({target_args}){target_ret}'
          for m in methods:
            bb=m[7]
            hits=[i for i,l in enumerate(bb) if needle in l]
            if hits:
              callers.append((m,hits))

          O=['Instagram 439 HDR clips/items exact R19e','=======================================','',
             'TARGET:',f'{target_cls}->{target_name}({target_args}){target_ret}',f'FILE={p}','',
             '===== EXACT A06 BODY =====']+b+['',
             '===== A06 STRING LITERALS =====']
          for reg,val in strings: O.append(f'{reg} = {val}')
          O += ['', '===== A06 INVOKES =====']
          for x in invokes: O.append(repr(x))
          O += ['', f'===== MOBILECONFIG CALL SITES ({len(config_lines)}) =====']
          for idx,line,ctx in config_lines:
            O += [f'--- body_line={idx}: {line} ---']+ctx+['']

          O += [f'===== DIRECT EXACT CALLERS ({len(callers)}) =====','']
          for m,hits in callers:
            ccls,cname,cargs,cret,cp,cs,ce,cb,csig=m
            ss=[]
            for l in cb:
              sm=str_re.match(l)
              if sm: ss.append(sm.group(2))
            relevant=[x for x in ss if any(k in x.lower() for k in (
              'clip','reel','feed','media','dash','video','rank','session','module','surface','request','fetch','item'))]
            O += [f'--- {ccls} {csig}',f'FILE={cp}',f'HIT_LINES={hits}',f'RELEVANT_STRINGS={relevant}','---']
            O += cb+['']

          # One-hop callers of each direct caller, but only emit compact context.
          caller_keys={(m[0],m[1],m[2],m[3]) for m,_ in callers}
          hop=[]
          for m in methods:
            refs=[]
            for i,l in enumerate(m[7]):
              if 'invoke-' not in l: continue
              im=inv_re.search(l)
              if not im: continue
              key=(im.group(1),im.group(2),im.group(3),im.group(4))
              if key in caller_keys: refs.append((i,key,l.strip()))
            if refs: hop.append((m,refs))
          O += [f'===== ONE-HOP CALLERS OF DIRECT CALLERS ({len(hop)}) =====','']
          for m,refs in hop:
            ccls,cname,cargs,cret,cp,cs,ce,cb,csig=m
            ss=[]
            for l in cb:
              sm=str_re.match(l)
              if sm: ss.append(sm.group(2))
            relevant=[x for x in ss if any(k in x.lower() for k in (
              'clip','reel','feed','media','dash','video','rank','session','module','surface','request','fetch','item'))]
            O += [f'--- {ccls} {csig}',f'FILE={cp}',f'REFS={refs}',f'RELEVANT_STRINGS={relevant}','---']
            if len(cb)<=420: O += cb
            O += ['']

          OUT.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:5000]))
          print('callers',len(callers),'onehop',len(hop),'bytes',OUT.stat().st_size)
          PY

      - name: Commit R19e report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_clips_items_exact_r19e.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add exact clips items A06 caller trace R19e'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
