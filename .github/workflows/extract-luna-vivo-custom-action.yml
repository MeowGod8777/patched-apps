name: Extract Luna Vivo custom-action handlers

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/extract-luna-vivo-custom-action.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download official Luna and locate target dexes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/apk work/out work/jadx
          UA='Mozilla/5.0 (Linux; Android 16; V2329A) AppleWebKit/537.36 Chrome/143 Mobile Safari/537.36'
          curl -L --retry 3 --connect-timeout 15 --max-time 240 -A "$UA" 'https://ugapk.com/GMg3' -o work/luna.apk
          unzip -q work/luna.apk 'classes*.dex' -d work/apk
          : > work/out/target_dexes.txt
          for f in work/apk/classes*.dex; do
            if grep -aq 'MediaCustomAction' "$f" || grep -aq 'MixMediaErrorCode' "$f" || grep -aq 'MediaSupportEvent' "$f"; then
              echo "$f" >> work/out/target_dexes.txt
            fi
          done
          sort -u -o work/out/target_dexes.txt work/out/target_dexes.txt
          cat work/out/target_dexes.txt
          test -s work/out/target_dexes.txt

      - name: Download JADX
        run: |
          curl -L --fail --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o work/jadx.zip
          unzip -q work/jadx.zip -d work/jadx
          chmod +x work/jadx/bin/jadx

      - name: Decompile target dexes and recover handlers
        shell: bash
        run: |
          set -euxo pipefail
          : > work/out/hits.txt
          : > work/out/files.txt
          n=0
          while IFS= read -r dex; do
            n=$((n+1))
            out="work/jadx_$n"
            mkdir -p "$out"
            work/jadx/bin/jadx --no-res --show-bad-code --threads-count 2 -d "$out" "$dex"
            SRC="$out/sources"
            grep -RIn --binary-files=without-match -E 'MediaCustomAction|MixMediaErrorCode|MediaSupportEvent|onCustomAction|sendCustomAction|customAction|ACTION_GET_LIST|GET_LIST|PLAY_INDEX|LIST_CURRENT|LIST_FAVORITE|LIST_LOCAL|support_event' "$SRC" | tee -a work/out/hits.txt || true
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              echo "$f" >> work/out/files.txt
              rel="${f#$SRC/}"
              mkdir -p "work/out/sources/$(dirname "$rel")"
              cp "$f" "work/out/sources/$rel"
            done < <(grep -Rl --binary-files=without-match -E 'MediaCustomAction|MixMediaErrorCode|onCustomAction|sendCustomAction|ACTION_GET_LIST|GET_LIST|PLAY_INDEX|LIST_CURRENT' "$SRC" || true)
          done < work/out/target_dexes.txt
          sort -u -o work/out/files.txt work/out/files.txt
          echo '===== HITS ====='
          sed -n '1,5000p' work/out/hits.txt
          echo '===== FILES ====='
          cat work/out/files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: luna-vivo-custom-action-handlers
          path: work/out
          retention-days: 7
