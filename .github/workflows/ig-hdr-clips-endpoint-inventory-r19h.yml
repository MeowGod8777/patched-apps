name: IG 439 HDR Clips Endpoint Inventory R19h

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-clips-endpoint-inventory-r19h.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact APK and locate route dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          : > work/hitdex.txt
          for d in work/apk/classes*.dex; do
            if strings -a "$d" | grep -Eqi 'clips/|clips_|Clips[A-Za-z].*(Network|Api|Feed|Request)|clips_viewer'; then
              basename "$d" >> work/hitdex.txt
            fi
          done
          echo HITDEX; cat work/hitdex.txt
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait
      - name: Enumerate actual Clips request builders
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('work/smali'); out=Path('research/generated/instagram_439_hdr_clips_endpoint_inventory_r19h.txt')
          class_re=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          str_re=re.compile(r'^\s*const-string(?:/jumbo)?\s+[^,]+,\s+"(.*)"')
          request_marks=('LX/03u7;->','LX/02pu;','LX/0AMH;','GraphQlCallInput','PandoGraphQLRequest','IgGraphQLQueryExecutor','LX/05yb;')
          wire=('hdr','codec','av1','hevc','vp9','dash','manifest','quality','device','performance','playback','delivery','bandwidth','resolution','capabil','accept-hint','media')
          rows=[]
          for p in root.rglob('*.smali'):
            ls=p.read_text(errors='replace').splitlines(); cls='?'
            for x in ls[:40]:
              m=class_re.match(x)
              if m: cls=m.group(1); break
            i=0
            while i<len(ls):
              if not ls[i].startswith('.method'):
                i+=1; continue
              s=i; sig=ls[i]; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              e=min(i,len(ls)-1); b=ls[s:e+1]; t='\n'.join(b); low=t.lower()
              ss=[]
              for line in b:
                m=str_re.match(line)
                if m:ss.append(m.group(1))
              clipss=[x for x in ss if 'clip' in x.lower() or 'reel' in x.lower()]
              routes=[x for x in ss if ('/' in x and any(k in x.lower() for k in ('clip','reel'))) or x.lower().startswith(('clips_','reels_'))]
              req=[m for m in request_marks if m.lower() in low]
              if clipss and req:
                wh=[x for x in wire if x in low]
                score=len(routes)*20+len(req)*10+len(wh)*3
                rows.append((-score,cls,sig,str(p),routes,clipss,req,wh,b))
              i+=1
          O=['Instagram 439 HDR Clips endpoint inventory R19h','=============================================','',f'candidate_count={len(rows)}','']
          for ns,cls,sig,p,routes,clipss,req,wh,b in sorted(rows,key=lambda x:(x[0],x[1],x[2])):
            O += [f'===== SCORE {-ns} {cls} {sig} =====',f'FILE={p}',f'ROUTES={routes}',f'CLIPS_STRINGS={clipss}',f'REQUEST_MARKS={req}',f'WIRE_HITS={wh}']+b+['']
          text='\n'.join(O)
          if len(text)>950000:text=text[:950000]+'\n[TRUNCATED]\n'
          out.write_text(text,encoding='utf-8')
          print(text[:300000]); print('rows',len(rows),'bytes',out.stat().st_size)
          PY
      - name: Commit R19h report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_clips_endpoint_inventory_r19h.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add exact Clips endpoint inventory R19h'
            git pull --rebase origin main
            git push origin HEAD:main
          fi