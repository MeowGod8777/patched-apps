name: IG 439 HDR ODC Outbound Fast R19n2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-odc-outbound-fast-r19n2.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Fetch and disassemble only known ODC dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes4.dex' 'classes8.dex' 'classes12.dex' 'classes13.dex' -d work/apk
          for d in classes4.dex classes8.dex classes12.dex classes13.dex; do
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/${d%.dex}" >/dev/null &
          done
          wait
      - name: Extract exact ODC event creation and immediate sinks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          R=Path('work/smali'); O=['Instagram 439 HDR ODC outbound fast R19n2','=========================================','']
          cr=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          methods=[]
          for p in R.rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); cls='?'
              for x in ls[:40]:
                  m=cr.match(x)
                  if m: cls=m.group(1); break
              i=0
              while i<len(ls):
                  if not ls[i].startswith('.method'): i+=1; continue
                  s=i; sig=ls[i]; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                  methods.append((cls,sig,p,ls[s:min(i+1,len(ls))])); i+=1
          seeds=('ig_device_static_attributes','One-Device-Classifier-Handler-Thread','LX/0Uiy;-><init>','LX/0ece;->A00','LX/02tU;->A03','LX/03Tz;-><init>')
          for cls,sig,p,b in methods:
              text='\n'.join(b)
              hits=[s for s in seeds if s in text]
              if hits:
                  strings=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',text)
                  O += [f'===== {cls} {sig}',f'FILE={p}',f'HITS={hits}',f'STRINGS={strings}']+b+['']
          # direct calls to event finalization methods on LX/00vv/LX/03Tz in seed classes
          O += ['===== FINALIZATION / TRANSPORT-LIKE CALLS IN ODC CLASSES =====']
          for cls,sig,p,b in methods:
              if cls not in ('LX/0ece;','LX/0Uiy;'): continue
              for i,l in enumerate(b):
                  low=l.lower()
                  if ('lx/00vv;' in low or 'lx/03tz;' in low or 'lx/02tu;' in low) and ('invoke-' in low):
                      O += [f'{cls} {sig} @{i}: {l}']
          Path('research/generated/instagram_439_hdr_odc_outbound_fast_r19n2.txt').write_text('\n'.join(O)+'\n')
          print('\n'.join(O[:7000])); print('bytes',Path('research/generated/instagram_439_hdr_odc_outbound_fast_r19n2.txt').stat().st_size)
          PY
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_odc_outbound_fast_r19n2.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add fast ODC outbound trace R19n2'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
