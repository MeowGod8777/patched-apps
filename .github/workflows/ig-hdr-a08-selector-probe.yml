name: IG 439 HDR Type1 Selector Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-a08-selector-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Trace X.0m8z A08 callers
        shell: bash
        run: |
          REPORT=research/generated/instagram_439_hdr_a08_callers.txt
          : > "$REPORT"
          for d in work/dex/classes*.dex; do
            if strings "$d" | grep -Fq 'LX/0m8z;'; then
              b="$(basename "$d" .dex)"
              "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
            fi
          done
          {
            echo "Instagram 439 X.0m8z.A08() callers"
            echo "=================================="
            echo "X.0m8z.A08() resolves selector 105 -> Display HDR type 1 / Dolby Vision capability."
            echo
            grep -Hn -B 70 -A 110 -E 'LX/0m8z;\.A08:\(\)Z' work/dis/*.txt || true
            echo
            echo "===== OTHER X.0m8z METHOD CALLS NEAR SAME CONSUMERS ====="
            grep -Hn -B 30 -A 50 -E 'LX/0m8z;\.A0[0-9]:\(' work/dis/*.txt | head -n 12000 || true
          } > "$REPORT"
          sed -n '1,2400p' "$REPORT"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_a08_callers.txt
          if ! git diff --cached --quiet; then
            git commit -m "Trace Instagram 439 X.0m8z A08 callers"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
