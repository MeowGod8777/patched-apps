name: IG 439 HDR Type1 Selector Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-a08-selector-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -p "work/$APK_NAME" classes10.dex > work/classes10.dex

      - name: Resolve A08 packed-switch selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          dex=Path('work/classes10.dex').read_bytes()
          payload=0x3693f4
          ident,size=struct.unpack_from('<HH',dex,payload)
          first_key=struct.unpack_from('<i',dex,payload+4)[0]
          targets=struct.unpack_from('<'+'i'*size,dex,payload+8)
          switch_off=0x2
          branches={'A0C':0x0a,'A0B':0x0f,'A0A':0x14,'A09':0x19,'A08':0x1e,'A07':0x23,'A06':0x28,'A05':0x2d,'A04':0x32}
          out=Path('research/generated/instagram_439_hdr_a08_switch_payload.txt')
          with out.open('w') as f:
              f.write('Instagram 439 X.0D2R.A08 exact selector\n')
              f.write('======================================\n')
              f.write('Exact APK SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8\n')
              f.write(f'ident=0x{ident:04x} size={size} first_key={first_key}\n')
              for name,off in branches.items():
                  rel=off-switch_off
                  keys=[first_key+i for i,t in enumerate(targets) if t==rel]
                  f.write(f'{name}: branch=0x{off:x} rel=0x{rel:x} selectors={keys}\n')
          print(out.read_text())
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_a08_switch_payload.txt
          if ! git diff --cached --quiet; then
            git commit -m "Resolve Instagram 439 HDR A08 selector"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
