name: IG 439 HDR Type1 Selector Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-a08-selector-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex

      - name: Find dexdump
        run: |
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          test -n "$DEXDUMP"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Resolve A08 selector payload
        shell: bash
        run: |
          REPORT=research/generated/instagram_439_hdr_a08_switch_payload.txt
          "$DEXDUMP" -d -f -h work/dex/classes10.dex > work/dis/classes10.txt
          {
            echo "Instagram 439 X.0D2R.invoke switch payload"
            echo "=========================================="
            echo "Exact APK SHA256: $APK_SHA256"
            echo
            echo "===== INVOKE HEAD ====="
            grep -n -A 45 'X.0D2R.invoke:()Ljava/lang/Object;' work/dis/classes10.txt | head -n 55
            echo
            echo "===== PACKED SWITCH PAYLOAD BYTES ====="
            echo "invoke code_item=0x368da0, insns=0x368db0, payload code-unit offset=0x322 => file offset 0x3693f4"
            xxd -g 2 -s 0x3693f4 -l 192 work/dex/classes10.dex
          } > "$REPORT"
          cat "$REPORT"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_a08_switch_payload.txt
          if ! git diff --cached --quiet; then
            git commit -m "Dump Instagram 439 HDR A08 switch payload"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
