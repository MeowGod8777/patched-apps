name: IG 439 HDR Reels Media Stream R20

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-reels-media-stream-r20.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact APK and classes15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -p "work/$APK_NAME" classes15.dex > work/classes15.dex
          java -jar work/baksmali-3.0.10-fat.jar d work/classes15.dex -o work/smali
      - name: Extract exact request path
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('work/smali'); O=['Instagram 439 feed/reels_media_stream exact R20','=============================================','']
          def methods(ls):
            i=0
            while i<len(ls):
              if not ls[i].startswith('.method'): i+=1; continue
              s=i; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              e=min(i,len(ls)-1); yield ls[s],ls[s:e+1]
              i+=1
          specs=[('X/03Hy.smali',' A00('),('X/03Mf.smali',' A00('),('X/02qh.smali',' A00(')]
          for rel,needle in specs:
            p=root/rel
            if not p.exists():
              O += [f'===== {rel} NOT FOUND =====','']; continue
            ls=p.read_text(errors='replace').splitlines()
            O += [f'===== METHODS {rel} =====']
            for sig,b in methods(ls):
              if needle in sig: O += [sig]+b+['']
          target='LX/03Hy;->A00(Lcom/instagram/common/session/UserSession;LX/07b1;LX/02po;Ljava/lang/String;Ljava/lang/String;Ljava/util/Map;Ljava/util/Set;)LX/02ue;'
          O += ['===== DIRECT CALLERS OF LX/03Hy.A00 IN classes15 =====','']
          for p in root.rglob('*.smali'):
            ls=p.read_text(errors='replace').splitlines(); cls='?'
            for x in ls[:30]:
              m=re.match(r'^\.class\s+.*\s+(L[^;]+;)$',x)
              if m: cls=m.group(1); break
            for sig,b in methods(ls):
              if target in '\n'.join(b): O += [f'--- {cls} {sig} FILE={p} ---']+b+['']
          text='\n'.join(O)
          Path('research/generated/instagram_439_hdr_reels_media_stream_r20.txt').write_text(text,encoding='utf-8')
          print(text)
          PY
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_reels_media_stream_r20.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add exact feed/reels_media_stream trace R20'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
