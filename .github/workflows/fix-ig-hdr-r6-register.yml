name: Fix IG HDR R6 High Register

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ig-hdr-r6-register.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch p2 invoke to range form and push
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-ig-hdr-test-r6-final.yml')
          s=p.read_text()
          old="'    invoke-static {p2}, LX/00PV;->hdrSelectedR6(LX/03oR;)V',"
          new="'    invoke-static/range {p2 .. p2}, LX/00PV;->hdrSelectedR6(LX/03oR;)V',"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-ig-hdr-test-r6-final.yml
          git commit -m 'Fix R6 selected-format high register invoke'
          git push origin HEAD:main
