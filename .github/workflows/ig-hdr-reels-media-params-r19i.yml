name: IG 439 HDR Reels Media Params R19i

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-reels-media-params-r19i.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Extract classes15 Reels media request helpers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" classes15.dex -d work/apk
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes15.dex -o work/smali >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          O=['Instagram 439 Reels media stream request params R19i','================================================','']
          for n in ['X/03Hy.smali','X/03Mf.smali']:
              p=Path('work/smali')/n
              O += [f'===== {n} =====']
              O += p.read_text(errors='replace').splitlines() if p.exists() else ['NOT_FOUND']
              O += ['']
          # Find methods in classes15 that call 03Mf.A00 or 03Hy.A00 and summarize constants.
          O += ['===== LOCAL CALLERS / PARAM PRODUCERS =====','']
          for p in Path('work/smali').rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); i=0
              while i<len(ls):
                  if not ls[i].startswith('.method'): i+=1; continue
                  s=i; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                  e=min(i,len(ls)-1); b=ls[s:e+1]; t='\n'.join(b)
                  if 'LX/03Mf;->A00' in t or 'LX/03Hy;->A00' in t:
                      lits=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"(.*)"',t)
                      O += [f'--- {p} {ls[s]}',f'LITERALS={lits}']+b+['']
                  i+=1
          Path('research/generated/instagram_439_hdr_reels_media_params_r19i.txt').write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:7000]))
          PY
      - name: Commit R19i report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_reels_media_params_r19i.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Reels media stream request param trace R19i'
            git pull --rebase origin main
            git push origin HEAD:main
          fi