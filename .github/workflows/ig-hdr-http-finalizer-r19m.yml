name: IG 439 HDR HTTP Finalizer R19m

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ig-hdr-http-finalizer-r19m.yml]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Extract 03u7 A04 only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" classes15.dex -d work/apk
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes15.dex -o work/smali >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=next(Path('work/smali').rglob('03u7.smali'))
          ls=p.read_text(errors='replace').splitlines()
          O=['Instagram 439 HDR exact HTTP finalizer R19m','=======================================','']
          i=0
          while i<len(ls):
              if not ls[i].startswith('.method'): i+=1; continue
              s=i; sig=ls[i]; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              b=ls[s:min(i+1,len(ls))]
              if ' A04(' in sig or ' A01(' in sig:
                  O += [f'===== {sig} =====']+b+['']
              i+=1
          out=Path('research/generated/instagram_439_hdr_http_finalizer_r19m.txt')
          out.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:10000])); print('bytes',out.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_http_finalizer_r19m.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add exact Instagram HTTP finalizer A04 trace R19m'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
