name: IG 439 HDR Accept Hint Enum Callflow R19g

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-accept-hint-enum-callflow-r19g.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact APK and disassemble focused dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          for d in classes2.dex classes15.dex classes16.dex classes19.dex; do
            [ -f "work/apk/$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done
          wait

      - name: Decode enum and callflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          ROOT=Path('work/smali')
          OUT=Path('research/generated/instagram_439_hdr_accept_hint_enum_callflow_r19g.txt')
          cls_re=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          target='Lcom/instagram/clips/api/ClipsApiUtilHelper;->A06(Lcom/instagram/common/session/UserSession;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;I)LX/02ue;'

          def parse_methods():
            out=[]
            for p in ROOT.rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); cls='?'
              for x in ls[:50]:
                m=cls_re.match(x)
                if m: cls=m.group(1); break
              i=0
              while i<len(ls):
                if not ls[i].startswith('.method'): i+=1; continue
                s=i; sig=ls[i]; i+=1
                while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                e=min(i,len(ls)-1); out.append((cls,sig,p,ls[s:e+1])); i+=1
            return out
          methods=parse_methods()
          O=['Instagram 439 HDR Accept-Hint Enum + Reels A06 Callflow R19g','===========================================================','']

          # Exact mapping function used by dynamic X-IG-Accept-Hint writers.
          for cls,sig,p,b in methods:
            if cls=='LX/02qh;' and (' A00(' in sig or '<clinit>' in sig):
              O += [f'===== ACCEPT_HINT_MAPPER {sig} =====',f'FILE={p}']+b+['']

          # All callers of mapper A00, concise owner context.
          needle='LX/02qh;->A00(Ljava/lang/Integer;)Ljava/lang/String;'
          mapper_callers=[]
          for cls,sig,p,b in methods:
            if needle in '\n'.join(b): mapper_callers.append((cls,sig,p,b))
          O += [f'===== ACCEPT_HINT_MAPPER_CALLERS ({len(mapper_callers)}) =====','']
          for cls,sig,p,b in mapper_callers:
            O += [f'--- {cls} {sig}',f'FILE={p}']
            for i,l in enumerate(b):
              if needle in l:
                O += b[max(0,i-18):min(len(b),i+18)]
            O += ['']

          # Concise exact call arguments for A06.
          callers=[]
          for cls,sig,p,b in methods:
            for i,l in enumerate(b):
              if target in l:
                callers.append((cls,sig,p,b,i,l)); break
          O += [f'===== A06 EXACT CALLERS ({len(callers)}) =====','']
          reg_pat=re.compile(r'\{([^}]*)\}')
          for cls,sig,p,b,i,l in callers:
            O += [f'--- {cls} {sig}',f'FILE={p}',f'INVOKE={l.strip()}']
            m=reg_pat.search(l); regs=[]
            if m:
              spec=m.group(1).strip()
              if '..' in spec:
                a,z=[x.strip() for x in spec.split('..')]
                ma=re.match(r'([vp])(\d+)',a); mz=re.match(r'([vp])(\d+)',z)
                if ma and mz and ma.group(1)==mz.group(1):
                  regs=[f'{ma.group(1)}{n}' for n in range(int(ma.group(2)),int(mz.group(2))+1)]
              else: regs=[x.strip() for x in spec.split(',')]
            O += [f'INVOKE_REGS={regs}', 'LAST_DEFINITIONS_BEFORE_INVOKE:']
            for r in regs:
              hits=[]
              for j in range(i-1,max(-1,i-180),-1):
                line=b[j]
                # destination-reg instructions + any lines directly referencing this register
                if re.search(r'(^|[\s,{])'+re.escape(r)+r'([\s,}(:]|$)',line):
                  hits.append((j,line))
                  # stop on likely defining instruction
                  s=line.strip()
                  if re.match(r'^(move(?:-object|-wide)?(?:/from16|/16)?|const(?:/\S+)?|const-string(?:/jumbo)?|iget(?:-object|-wide|-boolean|-byte|-char|-short)?|sget(?:-object|-wide|-boolean|-byte|-char|-short)?|new-instance)\s+'+re.escape(r)+r'\b',s):
                    break
              for j,line in reversed(hits): O.append(f'{j:04d}: {line}')
            O += ['LOCAL_SLICE:']+ [f'{j:04d}: {b[j]}' for j in range(max(0,i-55),min(len(b),i+12))] + ['']

          # Enumerate literal X-IG-Accept-Hint values across focused dexes.
          O += ['===== LITERAL X-IG-Accept-Hint WRITES =====','']
          for cls,sig,p,b in methods:
            for i,l in enumerate(b):
              if '"X-IG-Accept-Hint"' in l:
                O += [f'--- {cls} {sig} FILE={p}']+[f'{j:04d}: {b[j]}' for j in range(max(0,i-6),min(len(b),i+14))]+['']

          OUT.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:9000])); print('bytes',OUT.stat().st_size)
          PY

      - name: Commit R19g report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_accept_hint_enum_callflow_r19g.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Accept-Hint enum and Reels A06 callflow R19g'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
