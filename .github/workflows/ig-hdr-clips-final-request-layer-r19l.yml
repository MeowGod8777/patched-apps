name: IG 439 HDR Clips Final Request Layer R19l

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-clips-final-request-layer-r19l.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Fetch exact classes15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" classes15.dex -d work/apk
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes15.dex -o work/smali/classes15 >/dev/null
      - name: Extract 04u9 A00 and ClipsApiUtilHelper A01 compactly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[('LX/04u9;',Path('work/smali/classes15/X/04u9.smali'),'A00('),('Lcom/instagram/clips/api/ClipsApiUtilHelper;',Path('work/smali/classes15/com/instagram/clips/api/ClipsApiUtilHelper.smali'),'A01(')]
          O=['Instagram 439 HDR Clips final request layer R19l','=============================================','']
          for cls,p,want in files:
            ls=p.read_text(errors='replace').splitlines(); i=0
            while i<len(ls):
              if not ls[i].startswith('.method') or (' '+want) not in ls[i]: i+=1; continue
              s=i; sig=ls[i]; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              b=ls[s:min(i+1,len(ls))]; t='\n'.join(b)
              ss=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',t)
              O += [f'===== {cls} {sig} =====',f'STRINGS={ss}']
              for n,line in enumerate(b):
                if ('LX/03u7;->' in line or 'LX/02pu;->' in line or 'MobileConfigUnsafeContext;->' in line or 'const-wide' in line or 'const-string' in line):
                  O += [f'{n+1:04d}: {line.strip()}']
              O += ['','FULL_METHOD:']+b+['']
              break
          text='\n'.join(O); Path('research/generated/instagram_439_hdr_clips_final_request_layer_r19l.txt').write_text(text)
          print(text)
          PY
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_clips_final_request_layer_r19l.txt
          if ! git diff --cached --quiet; then git commit -m 'Add Clips final request layer trace R19l'; git pull --rebase origin main; git push origin HEAD:main; fi