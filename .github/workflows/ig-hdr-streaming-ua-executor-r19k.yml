name: IG 439 HDR Streaming UA Executor R19k

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-streaming-ua-executor-r19k.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch APK and locate executor/UA owner dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          : > work/hitdex.txt
          : > research/generated/instagram_439_hdr_streaming_ua_owner_dex_r19k.txt
          for d in work/apk/classes*.dex; do
            names=$(java -jar work/baksmali-3.0.10-fat.jar list classes "$d" | grep -E '^(LX/03ci;|LX/02ue;|LX/0AGp;|LX/02rk;|LX/02lw;|Lcom/instagram/common/api/base/IGTigonService;|Lcom/instagram/common/api/base/IgApiTigonService;)$' || true)
            if [ -n "$names" ]; then
              basename "$d" >> work/hitdex.txt
              printf '%s:\n%s\n' "$(basename "$d")" "$names" >> research/generated/instagram_439_hdr_streaming_ua_owner_dex_r19k.txt
            fi
          done
          sort -u work/hitdex.txt -o work/hitdex.txt
          cat research/generated/instagram_439_hdr_streaming_ua_owner_dex_r19k.txt
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait
      - name: Extract executor chain and UA producer usage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          R=Path('work/smali'); O=['Instagram 439 HDR streaming UA/executor R19k','===========================================','']
          cr=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$'); inv=re.compile(r'(L[^;]+;)->([^\s(]+)\(([^)]*)\)(\S+)')
          methods=[]; classes={}
          for p in R.rglob('*.smali'):
            ls=p.read_text(errors='replace').splitlines(); cls='?'
            for x in ls[:50]:
              m=cr.match(x)
              if m: cls=m.group(1); break
            classes[cls]=(p,ls)
            i=0
            while i<len(ls):
              if not ls[i].startswith('.method'): i+=1; continue
              s=i; sig=ls[i]; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              e=min(i,len(ls)-1); methods.append((cls,sig,p,ls[s:e+1])); i+=1
          for t in ['LX/03ci;','LX/02rk;','LX/02lw;','LX/0AGp;']:
            O += [f'===== FULL {t} =====']
            if t in classes:
              p,ls=classes[t]; O += [f'FILE={p}']+ls+['']
            else: O += ['NOT_FOUND','']
          # 02ue run / start / task execution methods only
          for cls,sig,p,b in methods:
            if cls=='LX/02ue;' and any(k in sig for k in [' run(', ' onStart(', ' A01(', ' A04(', ' A05(', ' A06(']):
              O += [f'===== 02ue EXEC {sig} =====',f'FILE={p}']+b+['']
          # every exact 02rk.A00 use in focused dexes
          O += ['===== LX/02rk.A00 CALLERS =====']
          for cls,sig,p,b in methods:
            for i,l in enumerate(b):
              if 'LX/02rk;->A00' in l:
                lo=max(0,i-35); hi=min(len(b),i+35)
                O += [f'--- {cls} {sig}',f'FILE={p}']+[f'{j:04d}: {b[j]}' for j in range(lo,hi)]+['']
          # references to 03ci, especially consumers likely executing network request
          O += ['===== LX/03ci CONSUMERS =====']
          for cls,sig,p,b in methods:
            for i,l in enumerate(b):
              if 'LX/03ci;' in l and cls!='LX/03ci;':
                lo=max(0,i-20); hi=min(len(b),i+28)
                O += [f'--- {cls} {sig}',f'FILE={p}',f'INDEX={i}']+[f'{j:04d}: {b[j]}' for j in range(lo,hi)]+['']
          # UA/Tigon semantic methods in all focused owner dexes.
          words=('user-agent','useragent','instagram ','tigon','mns','http','request','execute','stream','03ci','02rk','02lw')
          O += ['===== UA/TIGON SEMANTIC METHODS =====']
          for cls,sig,p,b in methods:
            low='\n'.join(b).lower(); hits=[w for w in words if w in low]
            if not hits: continue
            if cls in ('LX/03ci;','LX/02rk;','LX/02lw;','LX/02ue;') or 'tigon' in low or 'user-agent' in low or 'useragent' in low:
              O += [f'--- {cls} {sig}',f'HITS={hits}',f'FILE={p}']+b+['']
          out=Path('research/generated/instagram_439_hdr_streaming_ua_executor_r19k.txt')
          out.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:15000])); print('bytes',out.stat().st_size)
          PY
      - name: Commit R19k reports
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_streaming_ua_owner_dex_r19k.txt research/generated/instagram_439_hdr_streaming_ua_executor_r19k.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Reels streaming UA executor trace R19k'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
