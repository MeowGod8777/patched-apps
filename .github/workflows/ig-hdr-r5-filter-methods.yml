name: IG 439 HDR R5 Filter Methods

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-r5-filter-methods.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact R8 and disassemble classes17
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -p "work/$APK_NAME" classes17.dex > work/classes17.dex
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          java -jar work/baksmali-3.0.10-fat.jar d work/classes17.dex -o work/dis
          test -f work/dis/X/09z5.smali
      - name: Extract A0P A0b A0c A0I and direct callees
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('work/dis')
          p=root/'X/09z5.smali'
          lines=p.read_text(errors='replace').splitlines()
          targets=[
            'A0P(Ljava/util/List;)Z',
            'A0b(Ljava/util/List;)Ljava/util/List;',
            'A0c(Ljava/util/List;)Ljava/util/List;',
            'A0I(Ljava/lang/StringBuilder;Ljava/util/List;)Ljava/lang/String;',
            'A0O(ILjava/util/List;)Z',
          ]
          inv_re=re.compile(r'invoke-[^\s]+\s+\{[^}]*\},\s+(LX/[^;]+;)->([^\s(]+)\(([^)]*)\)(\S+)')

          def method_body(ls,target):
            starts=[i for i,l in enumerate(ls) if l.startswith('.method') and target in l]
            if len(starts)!=1: return None
            s=starts[0]
            e=next(i for i in range(s+1,len(ls)) if ls[i].startswith('.end method'))
            return ls[s:e+1]

          out=['Instagram 439 DASH filter methods','=================================', '']
          callees=[]
          for t in targets:
            body=method_body(lines,t)
            out.append(f'===== X.09z5 {t} =====')
            if body is None:
              out.append('NOT_FOUND')
              continue
            out.append(f'LINES={len(body)}')
            out.extend(body)
            out.append('')
            for l in body:
              m=inv_re.search(l)
              if m:
                sig=(m.group(1),m.group(2),m.group(3),m.group(4))
                if sig not in callees: callees.append(sig)

          out.append('===== DIRECT X CALLEES FROM TARGETS =====')
          for cls,name,args,ret in callees:
            sig=f'{cls}->{name}({args}){ret}'
            fp=root/(cls[2:-1]+'.smali')
            out.append(f'--- {sig} ---')
            if not fp.exists():
              out.append('MISSING_IN_CLASSES17')
              continue
            ls=fp.read_text(errors='replace').splitlines()
            body=method_body(ls,name+'('+args+')'+ret)
            if body is None:
              out.append('NOT_FOUND_OR_AMBIG')
              continue
            out.append(f'LINES={len(body)}')
            if len(body)<=800:
              out.extend(body)
            else:
              out.extend(body[:300]); out.append(f'... OMITTED {len(body)-600} ...'); out.extend(body[-300:])
            out.append('')

          path=Path('research/generated/instagram_439_hdr_r5_filter_methods.txt')
          text='\n'.join(out)+'\n'
          if len(text.encode())>110000:
            raise SystemExit(f'report unexpectedly large: {len(text.encode())}')
          path.write_text(text,encoding='utf-8')
          print(f'REPORT_BYTES={path.stat().st_size}')
          print(path.read_text())
          if '===== X.09z5 A0b' not in text: raise SystemExit('A0b missing')
          PY
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_r5_filter_methods.txt
          if ! git diff --cached --quiet; then git commit -m 'Extract Instagram 439 DASH filter methods'; fi
          git pull --rebase origin main
          git push origin HEAD:main
