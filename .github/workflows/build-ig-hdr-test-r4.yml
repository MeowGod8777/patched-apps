name: Build IG HDR Test R4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-ig-hdr-test-r4.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_APK: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      BASE_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
      OUT_APK: instagram-piko-v439.0.0.37.89-hdr-test-r4.apk
      TAG: ig-hdr-test-r4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Download exact R8 and install tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/smali13 out
          gh release download 8 --pattern "$BASE_APK" --dir work
          echo "$BASE_SHA256  work/$BASE_APK" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq smali libbcprov-java
      - name: Inject real selected/candidate track logger
        run: |
          set -euo pipefail
          unzip -p "work/$BASE_APK" classes13.dex > work/classes13.dex
          baksmali d work/classes13.dex -o work/smali13
          test -f work/smali13/X/00PV.smali
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/smali13/X/00PV.smali')
          lines=p.read_text().splitlines()
          needle='A0n(Landroid/media/MediaCrypto;LX/03oR;LX/0Oro;LX/08pn;F)V'
          starts=[i for i,l in enumerate(lines) if l.startswith('.method') and needle in l]
          if len(starts)!=1: raise SystemExit(f'A0n target count={len(starts)}')
          if any('hdrTrackDump439' in l for l in lines): raise SystemExit('helper already exists')
          s=starts[0]
          directive=next(i for i in range(s+1,min(s+12,len(lines))) if lines[i].strip().startswith(('.registers','.locals')))
          lines[directive+1:directive+1]=['','    invoke-static {p0, p2}, LX/00PV;->hdrTrackDump439(LX/00PV;LX/03oR;)V','']
          helper='''
.method private static hdrTrackDump439(LX/00PV;LX/03oR;)V
    .registers 7

    if-eqz p1, :after_selected
    invoke-static {p1}, LX/03oR;->A00(LX/03oR;)Ljava/lang/String;
    move-result-object v0
    const-string v1, "IG_HDR_SELECTED"
    invoke-static {v1, v0}, Landroid/util/Log;->i(Ljava/lang/String;Ljava/lang/String;)I

after_selected:
    invoke-virtual {p0}, LX/03Sg;->A0U()[LX/03oR;
    move-result-object v0
    if-eqz v0, :done
    array-length v1, v0
    const/4 v2, 0x0

loop:
    if-ge v2, v1, :done
    aget-object v3, v0, v2
    if-eqz v3, :next
    invoke-static {v3}, LX/03oR;->A00(LX/03oR;)Ljava/lang/String;
    move-result-object v4
    const-string v5, "IG_HDR_CANDIDATE"
    invoke-static {v5, v4}, Landroid/util/Log;->i(Ljava/lang/String;Ljava/lang/String;)I

next:
    add-int/lit8 v2, v2, 0x1
    goto :loop

done:
    return-void
.end method
'''.strip('\n').splitlines()
          lines += [''] + helper + ['']
          p.write_text('\n'.join(lines)+'\n')
          PY
          smali a work/smali13 -o work/classes13-patched.dex
      - name: Repack align and sign with exact R8 key
        run: |
          set -euo pipefail
          cp "work/$BASE_APK" work/unsigned.apk
          zip -q -d work/unsigned.apk classes13.dex || true
          zip -q -d work/unsigned.apk 'META-INF/*' || true
          cp work/classes13-patched.dex work/classes13.dex
          (cd work && zip -q -0 unsigned.apk classes13.dex)
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$ZIPALIGN" -f -p 4 work/unsigned.apk work/aligned.apk
          BCJAR="$(find /usr/share/java -maxdepth 1 -type f -name 'bcprov*.jar' | head -1)"
          keytool -importkeystore -srckeystore ks.keystore -srcstoretype BKS -srcstorepass 123456789 -srcalias andrewliang -srckeypass 123456789 -destkeystore work/ks-r8.p12 -deststoretype PKCS12 -deststorepass 123456789 -destkeypass 123456789 -destalias andrewliang -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider -providerpath "$BCJAR" -noprompt
          java -jar bin/apksigner.jar sign --ks work/ks-r8.p12 --ks-type PKCS12 --ks-pass pass:123456789 --key-pass pass:123456789 --ks-key-alias andrewliang --out "out/$OUT_APK" work/aligned.apk
          rm -f "out/$OUT_APK.idsig"
      - name: Verify instrumentation and signing identity
        run: |
          set -euo pipefail
          java -jar bin/apksigner.jar verify --verbose --print-certs "out/$OUT_APK" | tee out/verify.txt
          ORIG_CERT=$(java -jar bin/apksigner.jar verify --print-certs "work/$BASE_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          NEW_CERT=$(java -jar bin/apksigner.jar verify --print-certs "out/$OUT_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          printf 'original_cert=%s\nnew_cert=%s\n' "$ORIG_CERT" "$NEW_CERT" | tee out/cert-match.txt
          test -n "$ORIG_CERT" && test "$ORIG_CERT" = "$NEW_CERT"
          unzip -p "out/$OUT_APK" classes13.dex > work/verify-classes13.dex
          rm -rf work/verify-smali13
          baksmali d work/verify-classes13.dex -o work/verify-smali13
          grep -q 'hdrTrackDump439' work/verify-smali13/X/00PV.smali
          grep -q 'IG_HDR_SELECTED' work/verify-smali13/X/00PV.smali
          grep -q 'IG_HDR_CANDIDATE' work/verify-smali13/X/00PV.smali
          sha256sum "out/$OUT_APK" | tee out/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: instagram-hdr-test-r4
          path: |
            out/${{ env.OUT_APK }}
            out/sha256.txt
            out/verify.txt
            out/cert-match.txt
          retention-days: 14
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES='R4 diagnostic build: exact Release 8 Instagram 439. Observation-only logger at the confirmed real Reels renderer X.00PV.A0n. Logs selected Format under IG_HDR_SELECTED and every A0U() candidate Format under IG_HDR_CANDIDATE. Playback behavior unchanged. Same signing certificate as Release 8.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/$OUT_APK" out/sha256.txt out/verify.txt out/cert-match.txt --clobber
            gh release edit "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "out/$OUT_APK" out/sha256.txt out/verify.txt out/cert-match.txt --title 'Instagram HDR Test R4' --notes "$NOTES" --prerelease
          fi
