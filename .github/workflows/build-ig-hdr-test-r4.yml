name: Build IG HDR Test R4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-ig-hdr-test-r4.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_APK: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      BASE_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
      OUT_APK: instagram-piko-v439.0.0.37.89-hdr-test-r4.apk
      TAG: ig-hdr-test-r4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Download exact R8 and tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/smali13 out
          gh release download 8 --pattern "$BASE_APK" --dir work
          echo "$BASE_SHA256  work/$BASE_APK" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq smali libbcprov-java
          unzip -p "work/$BASE_APK" classes13.dex > work/classes13.dex
          baksmali d work/classes13.dex -o work/smali13
          test -f work/smali13/X/00PV.smali

      - name: Inject real renderer candidate support logger
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/smali13/X/00PV.smali')
          lines=p.read_text().splitlines()
          needle='.method public final A0f(LX/03oR;LX/08ui;)I'
          starts=[i for i,l in enumerate(lines) if l.strip()==needle]
          if len(starts)!=1:
              raise SystemExit(f'A0f target count={len(starts)}')
          s=starts[0]
          e=next(i for i in range(s+1,len(lines)) if lines[i].startswith('.end method'))
          out=[]; patched=0
          for l in lines[s:e+1]:
              if l.strip()=='return v0':
                  indent=l[:len(l)-len(l.lstrip())]
                  out.append(f'{indent}invoke-static {{p1, v0}}, LX/00PV;->hdrCandidate439(LX/03oR;I)V')
                  patched+=1
              out.append(l)
          if patched!=2:
              raise SystemExit(f'expected 2 return paths, got {patched}')
          lines[s:e+1]=out
          if any(l.startswith('.method') and 'hdrCandidate439' in l for l in lines):
              raise SystemExit('helper exists')
          helper=[
            '', '.method private static hdrCandidate439(LX/03oR;I)V', '    .registers 7', '',
            '    if-eqz p0, :done',
            '    iget-object v0, p0, LX/03oR;->A0b:Ljava/lang/String;',
            '    if-eqz v0, :done',
            '    const-string v1, "video/"',
            '    invoke-virtual {v0, v1}, Ljava/lang/String;->startsWith(Ljava/lang/String;)Z',
            '    move-result v1',
            '    if-eqz v1, :done', '',
            '    invoke-static {p0}, LX/03oR;->A00(LX/03oR;)Ljava/lang/String;',
            '    move-result-object v2',
            '    new-instance v3, Ljava/lang/StringBuilder;',
            '    invoke-direct {v3}, Ljava/lang/StringBuilder;-><init>()V',
            '    const-string v4, "support="',
            '    invoke-virtual {v3, v4}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;',
            '    invoke-virtual {v3, p1}, Ljava/lang/StringBuilder;->append(I)Ljava/lang/StringBuilder;',
            '    const-string v4, " "',
            '    invoke-virtual {v3, v4}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;',
            '    invoke-virtual {v3, v2}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;',
            '    invoke-virtual {v3}, Ljava/lang/Object;->toString()Ljava/lang/String;',
            '    move-result-object v2',
            '    const-string v3, "IG_HDR_CANDIDATE"',
            '    invoke-static {v3, v2}, Landroid/util/Log;->i(Ljava/lang/String;Ljava/lang/String;)I', '',
            ':done', '    return-void', '.end method', ''
          ]
          lines += helper
          p.write_text('\n'.join(lines)+'\n')
          print('patched A0f return paths:',patched)
          PY
          smali a work/smali13 -o work/classes13-patched.dex
          test -s work/classes13-patched.dex

      - name: Repack align and sign with exact R8 key
        run: |
          set -euo pipefail
          cp "work/$BASE_APK" work/unsigned.apk
          zip -q -d work/unsigned.apk classes13.dex || true
          zip -q -d work/unsigned.apk 'META-INF/*' || true
          cp work/classes13-patched.dex work/classes13.dex
          (cd work && zip -q -0 unsigned.apk classes13.dex)
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$ZIPALIGN" -f -p 4 work/unsigned.apk work/aligned.apk
          BCJAR="$(find /usr/share/java -maxdepth 1 -type f -name 'bcprov*.jar' | head -1)"
          test -n "$BCJAR"
          keytool -importkeystore \
            -srckeystore ks.keystore -srcstoretype BKS -srcstorepass 123456789 \
            -srcalias andrewliang -srckeypass 123456789 \
            -destkeystore work/ks-r8.p12 -deststoretype PKCS12 \
            -deststorepass 123456789 -destkeypass 123456789 -destalias andrewliang \
            -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider \
            -providerpath "$BCJAR" -noprompt
          java -jar bin/apksigner.jar sign \
            --ks work/ks-r8.p12 --ks-type PKCS12 \
            --ks-pass pass:123456789 --key-pass pass:123456789 \
            --ks-key-alias andrewliang \
            --out "out/$OUT_APK" work/aligned.apk
          rm -f "out/$OUT_APK.idsig"

      - name: Verify instrumentation and signing identity
        run: |
          set -euo pipefail
          java -jar bin/apksigner.jar verify --verbose --print-certs "out/$OUT_APK" | tee out/verify.txt
          ORIG_CERT=$(java -jar bin/apksigner.jar verify --print-certs "work/$BASE_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          NEW_CERT=$(java -jar bin/apksigner.jar verify --print-certs "out/$OUT_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          printf 'original_cert=%s\nnew_cert=%s\n' "$ORIG_CERT" "$NEW_CERT" | tee out/cert-match.txt
          test -n "$ORIG_CERT" && test "$ORIG_CERT" = "$NEW_CERT"
          unzip -p "out/$OUT_APK" classes13.dex > work/verify-classes13.dex
          rm -rf work/verify-smali13
          baksmali d work/verify-classes13.dex -o work/verify-smali13
          grep -q 'IG_HDR_CANDIDATE' work/verify-smali13/X/00PV.smali
          COUNT=$(grep -c 'hdrCandidate439(LX/03oR;I)V' work/verify-smali13/X/00PV.smali)
          echo "candidate_logger_refs=$COUNT" | tee out/instrumentation.txt
          test "$COUNT" -ge 3
          sha256sum "out/$OUT_APK" | tee out/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: instagram-hdr-test-r4
          path: |
            out/${{ env.OUT_APK }}
            out/sha256.txt
            out/verify.txt
            out/cert-match.txt
            out/instrumentation.txt
          retention-days: 14

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES='R4 diagnostic: exact Release 8 Instagram 439. Observation-only logger in the confirmed real Media3 video renderer support method X.00PV.A0f. Logs every video candidate Format plus the renderer support code under IG_HDR_CANDIDATE. Playback and selection behavior are unchanged. Same signing certificate as Release 8, verified.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/$OUT_APK" out/sha256.txt out/verify.txt out/cert-match.txt out/instrumentation.txt --clobber
            gh release edit "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "out/$OUT_APK" out/sha256.txt out/verify.txt out/cert-match.txt out/instrumentation.txt --title 'Instagram HDR Test R4' --notes "$NOTES" --prerelease
          fi
