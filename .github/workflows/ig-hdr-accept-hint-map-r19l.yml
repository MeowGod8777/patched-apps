name: IG 439 HDR Accept Hint Map R19l

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-accept-hint-map-r19l.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Fetch exact APK and disassemble focused dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          needles=['LX/02qh;','X-IG-Accept-Hint','clips/discover/stream/','LX/04tC;']
          hit=[]; rows=[]
          for p in sorted(Path('work/apk').glob('classes*.dex')):
              s=subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace').stdout
              hs=[n for n in needles if n in s]
              if hs:
                  hit.append(p.name); rows.append(f'{p.name}: '+', '.join(hs))
          Path('work/hitdex.txt').write_text('\n'.join(hit)+'\n')
          Path('research/generated/instagram_439_hdr_accept_hint_map_dex_hits_r19l.txt').write_text('\n'.join(rows)+'\n')
          print('\n'.join(rows)); print('HITDEX',hit)
          PY
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait

      - name: Resolve Accept-Hint map and main Reels p33 gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT=Path('work/smali')
          OUT=Path('research/generated/instagram_439_hdr_accept_hint_map_r19l.txt')
          cls_re=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          invoke_re=re.compile(r'^\s*invoke-\S+\s+\{([^}]*)\},\s+(\S+)->([^\s(]+)\(([^)]*)\)(\S+)')
          cstr_re=re.compile(r'^\s*const-string(?:/jumbo)?\s+([^,]+),\s+"(.*)"')
          const_re=re.compile(r'^\s*const(?:/\w+)?(?:/high16)?\s+([^,]+),\s+([^#]+)')
          move_re=re.compile(r'^\s*move(?:-object|-wide)?(?:/from16|/16)?\s+([^,]+),\s+(\S+)')
          iget_re=re.compile(r'^\s*iget(?:-object|-boolean|-wide)?\s+([^,]+),\s+([^,]+),\s+(\S+)')
          sget_re=re.compile(r'^\s*sget(?:-object|-boolean|-wide)?\s+([^,]+),\s+(\S+)')

          methods=[]
          classes={}
          for p in ROOT.rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); cls='?'
              for x in ls[:50]:
                  m=cls_re.match(x)
                  if m: cls=m.group(1); break
              classes[cls]=(p,ls)
              i=0
              while i<len(ls):
                  if not ls[i].startswith('.method'):
                      i+=1; continue
                  s=i; sig=ls[i]; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'):
                      i+=1
                  e=min(i,len(ls)-1); methods.append((cls,sig,p,ls[s:e+1])); i+=1

          O=['Instagram 439 HDR Accept-Hint map + Reels p33 R19l','==================================================','']

          # Full mapper class.
          if 'LX/02qh;' in classes:
              p,ls=classes['LX/02qh;']
              O += [f'===== FULL CLASS LX/02qh; FILE={p} ====='] + ls + ['']
          else:
              O += ['===== FULL CLASS LX/02qh; =====','NOT_FOUND','']

          # Every call to mapper, with source Integer and resulting header sink context.
          O += ['===== ALL LX/02qh.A00 CALLERS =====','']
          for cls,sig,p,b in methods:
              for i,l in enumerate(b):
                  if 'LX/02qh;->A00(Ljava/lang/Integer;)Ljava/lang/String;' in l:
                      lo=max(0,i-35); hi=min(len(b),i+35)
                      O += [f'--- {cls} {sig}',f'FILE={p}',f'CALL_INDEX={i}']+[f'{j:04d}: {b[j]}' for j in range(lo,hi)]+['']

          # Every X-IG-Accept-Hint producer, to classify literal vs mapped values.
          O += ['===== ALL X-IG-Accept-Hint PRODUCERS =====','']
          for cls,sig,p,b in methods:
              if 'X-IG-Accept-Hint' not in '\n'.join(b): continue
              O += [f'--- {cls} {sig}',f'FILE={p}']
              for i,l in enumerate(b):
                  if 'X-IG-Accept-Hint' in l:
                      lo=max(0,i-24); hi=min(len(b),i+32)
                      O += [f'{j:04d}: {b[j]}' for j in range(lo,hi)]
              O += ['']

          # Main Reels builder A0A and all exact callers. Preserve invocation registers and last defs.
          target_owner='LX/04tC;'
          target_name='A0A'
          target_methods=[m for m in methods if m[0]==target_owner and ' A0A(' in m[1]]
          for cls,sig,p,b in target_methods:
              O += [f'===== MAIN REELS BUILDER {cls} {sig}',f'FILE={p}']
              # Only semantically important branch windows instead of entire huge method.
              for key in ['clips/discover/stream/','X-IG-Accept-Hint','p33','clips_viewer_feed_timeline','reel_feed_timeline']:
                  for i,l in enumerate(b):
                      if key in l:
                          lo=max(0,i-22); hi=min(len(b),i+28)
                          O += [f'--- KEY {key} index={i} ---']+[f'{j:04d}: {b[j]}' for j in range(lo,hi)]
              O += ['']

          O += ['===== EXACT LX/04tC.A0A CALLERS =====','']
          call_count=0
          for cls,sig,p,b in methods:
              for i,l in enumerate(b):
                  im=invoke_re.match(l)
                  if not im: continue
                  regs_raw,owner,name,args,ret=im.groups()
                  if owner!=target_owner or name!=target_name: continue
                  call_count+=1
                  O += [f'--- CALLER {cls} {sig}',f'FILE={p}',f'CALL_INDEX={i}',f'INVOKE={l}',f'REGS_RAW={regs_raw}',f'ARGS_DESC={args}',f'RET={ret}']
                  lo=max(0,i-140); hi=min(len(b),i+25)
                  O += ['CALL_WINDOW:']+[f'{j:04d}: {b[j]}' for j in range(lo,hi)]
                  O += ['']
          O += [f'A0A_CALL_COUNT={call_count}','']

          OUT.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:9000]))
          print('bytes',OUT.stat().st_size,'A0A_call_count',call_count)
          PY

      - name: Commit R19l reports
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_accept_hint_map_dex_hits_r19l.txt research/generated/instagram_439_hdr_accept_hint_map_r19l.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Accept-Hint map and Reels p33 trace R19l'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
