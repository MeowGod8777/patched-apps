name: IG 439 HDR Reels Dynamic Params R19j

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-reels-dynamic-params-r19j.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Locate exact dynamic-param dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          toks=['LX/03Lk;','LX/06Wx;']
          hits=[]
          for p in sorted(Path('work/apk').glob('classes*.dex')):
              s=subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace').stdout
              if any(t in s for t in toks): hits.append(p.name)
          Path('work/hitdex.txt').write_text('\n'.join(hits)+'\n')
          print('HITDEX',hits)
          PY
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait
      - name: Extract 03Lk 06Wx and exact refs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          O=['Instagram 439 Reels dynamic request params R19j','===========================================','']
          cr=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          refs=[]
          for p in Path('work/smali').rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); cls='?'
              for x in ls[:50]:
                  m=cr.match(x)
                  if m: cls=m.group(1); break
              if cls in ('LX/03Lk;','LX/06Wx;'):
                  O += [f'===== FULL {cls} FILE={p} =====']+ls+['']
              i=0
              while i<len(ls):
                  if not ls[i].startswith('.method'): i+=1; continue
                  s=i; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                  e=min(i,len(ls)-1); b=ls[s:e+1]; t='\n'.join(b)
                  if ('LX/03Lk;->A00' in t or 'LX/06Wx;->A00:Ljava/lang/String;' in t or 'LX/06Wx;-><init>' in t):
                      lits=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"(.*)"',t)
                      refs.append((cls,ls[s],str(p),lits,b))
                  i+=1
          O += [f'===== EXACT REFS ({len(refs)}) =====','']
          for cls,sig,p,lits,b in refs:
              O += [f'--- {cls} {sig}',f'FILE={p}',f'LITERALS={lits}']+b+['']
          Path('research/generated/instagram_439_hdr_reels_dynamic_params_r19j.txt').write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:7000]))
          PY
      - name: Commit R19j report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_reels_dynamic_params_r19j.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Reels dynamic request param trace R19j'
            git pull --rebase origin main
            git push origin HEAD:main
          fi