name: IG 439 HDR Clips Primary Request R19h

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-clips-primary-request-r19h.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact APK and disassemble all dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          for d in work/apk/classes*.dex; do
            n="$(basename "${d%.dex}")"
            java -jar work/baksmali-3.0.10-fat.jar d "$d" -o "work/smali/$n" >/dev/null &
          done
          wait

      - name: Trace exact short-form Clips operations and request builders
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT=Path('work/smali')
          OUT=Path('research/generated/instagram_439_hdr_clips_primary_request_r19h.txt')
          exact_ops={
            'clips_viewer_feed_timeline':269,
            'reel_feed_timeline':324,
            'clips_viewer_homecoming_fyp':1283,
            'clips_fetch':2389,
            'clips_viewer_reel_feed_timeline':3307,
          }
          important=('clips_viewer_feed_timeline','clips_viewer_reel_feed_timeline','clips_viewer_homecoming_fyp','clips_fetch')
          cls_re=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          meth_re=re.compile(r'^\.method.*\s([^\s(]+)\(([^)]*)\)(\S+)$')
          str_re=re.compile(r'^\s*const-string(?:/jumbo)?\s+([^,]+),\s+"(.*)"')
          inv_re=re.compile(r'(L[^;]+;)->([^\s(]+)\(([^)]*)\)(\S+)')
          const_re=re.compile(r'^\s*const(?:/4|/16|/high16)?\s+([^,]+),\s+(-?0x[0-9a-fA-F]+|-?\d+)')

          methods=[]
          for p in ROOT.rglob('*.smali'):
            ls=p.read_text(errors='replace').splitlines(); cls=None
            for x in ls[:50]:
              m=cls_re.match(x)
              if m: cls=m.group(1); break
            if not cls: continue
            i=0
            while i<len(ls):
              if not ls[i].startswith('.method'): i+=1; continue
              s=i; sig=ls[i]; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              e=min(i,len(ls)-1); b=ls[s:e+1]
              mm=meth_re.match(sig)
              key=(cls,mm.group(1),mm.group(2),mm.group(3)) if mm else (cls,sig,'','')
              methods.append((key,p,b,sig))
              i+=1

          def litpairs(b):
            out=[]
            for i,l in enumerate(b):
              m=str_re.match(l)
              if m: out.append((i,m.group(1),m.group(2)))
            return out
          def invs(b):
            out=[]
            for i,l in enumerate(b):
              if 'invoke-' not in l: continue
              m=inv_re.search(l)
              if m: out.append((i,m.group(1),m.group(2),m.group(3),m.group(4),l.strip()))
            return out
          def requestish(iv):
            return [q for q in iv if q[1] in ('LX/03u7;','LX/02pu;','Lcom/facebook/graphql/calls/GraphQlCallInput;','LX/05yb;','LX/03ci;','LX/03cX;')]
          def interesting_strings(lp):
            toks=('clips','reel','feed','media','video','dash','hdr','codec','quality','device','playback','delivery','bandwidth','resolution','screen','performance','rank','session','x-ig-','accept-hint','capabil')
            return [v for _,_,v in lp if any(t in v.lower() for t in toks)]

          rows=[]
          for key,p,b,sig in methods:
            lp=litpairs(b); iv=invs(b); text='\n'.join(b); low=text.lower()
            direct=[v for _,_,v in lp if v in exact_ops]
            clips_routes=[v for _,_,v in lp if 'clips/' in v.lower()]
            req=requestish(iv)
            idxhits=[]
            # Resolve simple const -> LX/0000.A00 within a short local window.
            for j,q in enumerate(iv):
              i,own,name,args,ret,line=q
              if (own,name,args,ret)!=('LX/0000;','A00','I','Ljava/lang/String;'): continue
              invline=b[i]
              mreg=re.search(r'\{\s*([^,}\s]+)',invline)
              if not mreg: continue
              reg=mreg.group(1)
              val=None
              for k in range(i-1,max(-1,i-10),-1):
                cm=const_re.match(b[k])
                if cm and cm.group(1)==reg:
                  try: val=int(cm.group(2),0)
                  except: pass
                  break
                # Stop if register is overwritten by obvious move/result/iget/sget/new-instance.
                if re.match(r'^\s*(move|iget|sget|new-instance|const-string)',b[k]) and re.search(r'\b'+re.escape(reg)+r'\b',b[k]):
                  break
              if val in exact_ops.values():
                opname=next(k for k,v in exact_ops.items() if v==val)
                idxhits.append((opname,val,i))
            opnames=set(direct+[x[0] for x in idxhits])
            useful=bool(opnames.intersection(important) or clips_routes)
            if not useful: continue
            # Deprioritize pure static context registries unless they also build a request.
            is_clinit='<clinit>' in sig
            score=80*len(opnames.intersection(important))+40*len(clips_routes)+20*len(req)+10*len(interesting_strings(lp))
            if is_clinit and not req and not clips_routes: score-=100
            rows.append((score,key,p,b,sig,direct,idxhits,clips_routes,req,lp,iv))

          rows.sort(key=lambda x:(-x[0],x[1][0],x[1][1]))
          O=['Instagram 439 HDR short-form Clips primary request R19h','====================================================','',f'methods={len(methods)} candidates={len(rows)}','']
          # Summary first so connector can read beginning even if truncated.
          O += ['===== TOP CANDIDATE SUMMARY =====']
          for r in rows[:80]:
            score,key,p,b,sig,direct,idxhits,routes,req,lp,iv=r
            O += [f'{score} | {key[0]} {sig} | direct={direct} indirect={[(x[0],x[1]) for x in idxhits]} routes={routes} reqrefs={[x[1:5] for x in req]} strings={interesting_strings(lp)[:30]} | {p}']
          O += ['']

          for r in rows[:50]:
            score,key,p,b,sig,direct,idxhits,routes,req,lp,iv=r
            O += [f'===== SCORE {score} {key[0]} {sig} =====',f'FILE={p}',f'DIRECT_OPS={direct}',f'INDIRECT_OPS={idxhits}',f'CLIPS_ROUTES={routes}',f'REQUEST_REFS={[x[1:5] for x in req]}',f'INTERESTING_STRINGS={interesting_strings(lp)}','']
            marks=set()
            for i,_,v in lp:
              if v in exact_ops or 'clips/' in v.lower() or any(t in v.lower() for t in ('x-ig-','accept-hint','codec','hdr','dash','quality','device','playback','delivery')):
                marks.add(i)
            for opname,val,i in idxhits: marks.add(i)
            for i,own,name,args,ret,line in req:
              if own=='LX/03u7;' or own=='Lcom/facebook/graphql/calls/GraphQlCallInput;': marks.add(i)
            # Merge small windows around marks to stay compact.
            spans=[]
            for i in sorted(marks):
              a=max(0,i-10); z=min(len(b),i+11)
              if spans and a<=spans[-1][1]+3: spans[-1]=(spans[-1][0],max(spans[-1][1],z))
              else: spans.append((a,z))
            for a,z in spans[:18]:
              O += [f'-- WINDOW {a}:{z} --']+b[a:z]+['']
            if len(b)<=380 and (req or routes) and '<clinit>' not in sig:
              O += ['-- FULL METHOD --']+b+['']

          # Exact literal owners, regardless of score, to prove where operation names live.
          O += ['===== EXACT LITERAL OWNERS =====']
          for op in important:
            O += [f'-- {op} --']
            n=0
            for key,p,b,sig in methods:
              if any(v==op for _,_,v in litpairs(b)):
                O += [f'{key[0]} {sig} FILE={p} request_refs={[x[1:5] for x in requestish(invs(b))]} strings={interesting_strings(litpairs(b))[:20]}']
                n+=1
            O += [f'count={n}','']

          text='\n'.join(O)
          # Hard cap for reliable connector retrieval.
          if len(text)>280000: text=text[:280000]+'\n[TRUNCATED AT 280KB]\n'
          OUT.write_text(text,encoding='utf-8')
          print(text[:120000])
          print('REPORT_BYTES',OUT.stat().st_size,'CANDIDATES',len(rows))
          PY

      - name: Commit R19h report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_clips_primary_request_r19h.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add primary short-form Clips request trace R19h'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
