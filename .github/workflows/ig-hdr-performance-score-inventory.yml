name: IG 439 Video Performance Score Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-performance-score-inventory.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Download DEX
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          set -euo pipefail
          mkdir -p work/dex research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
      - name: Extract performance and benchmark strings
        run: |
          set -euo pipefail
          REPORT=research/generated/instagram_439_hdr_performance_score_strings.txt
          {
            for d in work/dex/classes*.dex; do
              echo "===== $(basename "$d") ====="
              strings "$d" | grep -Eai 'performance.?score|device.?performance|video.?performance|benchmark|gaussian|memory.?copy|memory.?alloc|3d.?render|decode.?score|decoder.?score|codec.?score|playback.?score|device.?score|capability.?score|performance.?class|device.?class|one.?device.?classifier|odc|video.?capability|10.?bit.?hdr|hdr.?10.?bit' || true
            done
          } | sort -u > "$REPORT"
          cat "$REPORT"
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_performance_score_strings.txt
          if ! git diff --cached --quiet; then git commit -m 'Inventory Instagram 439 video performance score strings'; fi
          git pull --rebase origin main
          git push origin HEAD:main
