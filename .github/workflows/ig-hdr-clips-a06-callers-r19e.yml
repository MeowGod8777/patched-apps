name: IG 439 HDR Clips A06 Callers R19e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-clips-a06-callers-r19e.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact APK and locate caller dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          : > work/hitdex.txt
          for d in work/apk/classes*.dex; do
            if strings -a "$d" | grep -q 'com/instagram/clips/api/ClipsApiUtilHelper'; then
              basename "$d" >> work/hitdex.txt
            fi
          done
          grep -qx 'classes15.dex' work/hitdex.txt || echo classes15.dex >> work/hitdex.txt
          sort -u work/hitdex.txt -o work/hitdex.txt
          cat work/hitdex.txt
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait

      - name: Extract exact A06 and reverse callers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('work/smali')
          out=[]
          out += ['Instagram 439 HDR ClipsApiUtilHelper A06 R19e','===========================================','']
          target='Lcom/instagram/clips/api/ClipsApiUtilHelper;->A06(Lcom/instagram/common/session/UserSession;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;I)LX/02ue;'

          def methods(p):
            ls=p.read_text(errors='replace').splitlines()
            cls='?'
            for x in ls[:50]:
              m=re.match(r'^\.class\s+.*\s+(L[^;]+;)$',x)
              if m: cls=m.group(1); break
            i=0
            while i < len(ls):
              if not ls[i].startswith('.method'):
                i+=1; continue
              s=i; i+=1
              while i < len(ls) and not ls[i].startswith('.end method'):
                i+=1
              e=min(i,len(ls)-1)
              yield cls,ls[s],ls[s:e+1],p
              i+=1

          found=False
          for p in root.rglob('ClipsApiUtilHelper.smali'):
            for cls,sig,b,path in methods(p):
              if sig.startswith('.method public final A06(Lcom/instagram/common/session/UserSession;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;I)LX/02ue;'):
                found=True
                out += ['===== EXACT TARGET METHOD =====',f'CLASS={cls}',f'FILE={path}',sig]+b[1:]+['']
          if not found:
            out += ['TARGET_METHOD_NOT_FOUND','']

          callers=[]
          for p in root.rglob('*.smali'):
            for cls,sig,b,path in methods(p):
              text='\n'.join(b)
              if target in text:
                strings=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',text)
                invokes=re.findall(r'invoke-[^\s]+\s+\{[^}]*\},\s+(L[^;]+;)->([^\(]+)\(([^)]*)\)(\S+)',text)
                callers.append((cls,sig,path,strings,invokes,b))
          out += [f'===== REVERSE CALLERS ({len(callers)}) =====','']
          for cls,sig,path,strings,invokes,b in callers:
            out += [f'--- {cls} {sig}',f'FILE={path}',f'STRINGS={strings}',f'INVOKES={invokes}']+b+['']

          text='\n'.join(out)
          Path('research/generated/instagram_439_hdr_clips_a06_callers_r19e.txt').write_text(text,encoding='utf-8')
          print(text[:200000])
          PY

      - name: Commit R19e report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_clips_a06_callers_r19e.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add exact ClipsApiUtilHelper A06 callers R19e'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
