name: Build rvmm LINE Andrew compat

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-rvmm-line-andrew-compat.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download official rvmm v10
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o rvmm-v10.zip \
            https://github.com/j-hc/rvmm-zygisk-mount/releases/download/v10/rvmm-zygisk-mount-v10.zip
          echo "a131cba8b8fe05307b09a98cc23490ee8494868d23fb5f3f356e79c7db585dba  rvmm-v10.zip" | sha256sum -c -
          mkdir src
          unzip -q rvmm-v10.zip -d src

      - name: Patch LINE Andrew compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/util.sh")
          s = p.read_text()

          s = s.replace(
              'if ! grep -Fq "j-hc" "$1/module.prop"; then return 1; fi',
              'case "$1" in */line-andrew-andrew-arm64) ;; *) if ! grep -Fq "j-hc" "$1/module.prop"; then return 1; fi ;; esac',
              1,
          )

          s = s.replace(
              'for RVMM in /data/adb/modules_update/*-jhc*; do',
              'for RVMM in /data/adb/modules_update/*-jhc* /data/adb/modules_update/line-andrew-andrew-arm64; do',
          )
          s = s.replace(
              'for RVMM in /data/adb/modules/*-jhc*; do',
              'for RVMM in /data/adb/modules/*-jhc* /data/adb/modules/line-andrew-andrew-arm64; do',
          )

          needle = 'if ! BASEPATH=$(pm path "$PKG_NAME" 2>&1 </dev/null) || [ -z "$BASEPATH" ]; then'
          if needle not in s:
              raise SystemExit("pm path block not found")
          # LINE is a split APK bundle. rvmm v10 assumes one pm-path line.
          # Collapse it to the actual base.apk before the existing encoding logic.
          after = '''if ! BASEPATH=$(pm path "$PKG_NAME" 2>&1 </dev/null) || [ -z "$BASEPATH" ]; then'''
          # Insert after the whole error guard, immediately before RVPATH assignment.
          rv = 'RVPATH="/data/adb/rvhc/'
          idx = s.index(rv)
          s = s[:idx] + 'BASEPATH=$(printf "%s\\n" "$BASEPATH" | grep "/base.apk$" | head -n 1)\n\t\t' + s[idx:]
          p.write_text(s)
          PY

          sed -i 's/^name=.*/name=rvmm-zygisk-mount (LINE Andrew compat)/' src/module.prop
          sed -i 's/^version=.*/version=v10-line-andrew-r1/' src/module.prop
          sed -i 's|^description=.*|description=rvmm v10 patched for LINE Andrew on iQOO 12 Pro|' src/module.prop
          sed -i '/^updateJson=/d' src/module.prop

          echo "===== compatibility checks ====="
          grep -n "line-andrew-andrew-arm64" src/util.sh
          grep -n "base.apk" src/util.sh | head -n 5
          cat src/module.prop

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          FILE="rvmm-zygisk-mount-v10-LINE-Andrew-iQOO12Pro-r1.zip"
          (cd src && zip -qr "../$FILE" .)
          sha256sum "$FILE" | tee "$FILE.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rvmm-zygisk-mount-v10-LINE-Andrew-iQOO12Pro-r1
          path: |
            rvmm-zygisk-mount-v10-LINE-Andrew-iQOO12Pro-r1.zip
            rvmm-zygisk-mount-v10-LINE-Andrew-iQOO12Pro-r1.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="rvmm-line-andrew-iqoo12pro-v10-r1"
          FILE="rvmm-zygisk-mount-v10-LINE-Andrew-iQOO12Pro-r1.zip"
          SUM="$FILE.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" "$SUM" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" "$SUM" \
              --repo "$GITHUB_REPOSITORY" \
              --title "rvmm v10 LINE Andrew iQOO 12 Pro r1" \
              --notes "j-hc rvmm v10 with LINE Andrew module recognition and split-bundle base.apk targeting." \
              --latest=false
          fi
