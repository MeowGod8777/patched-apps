name: Build rvmm LINE Andrew compat

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-rvmm-line-andrew-compat.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download official rvmm v10
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o rvmm-v10.zip \
            https://github.com/j-hc/rvmm-zygisk-mount/releases/download/v10/rvmm-zygisk-mount-v10.zip
          echo "a131cba8b8fe05307b09a98cc23490ee8494868d23fb5f3f356e79c7db585dba  rvmm-v10.zip" | sha256sum -c -
          mkdir src
          unzip -q rvmm-v10.zip -d src

      - name: Patch for LINE Andrew bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          util = Path("src/util.sh")
          s = util.read_text()

          a = s.index("collect_rvmm() {")
          b = s.index("\ncreate_procs_map() {", a)
          collect = '''collect_rvmm() {
            for RVMM in /data/adb/modules_update/*-jhc* /data/adb/modules_update/line-andrew-andrew-arm64; do
              if ! is_valid_rvmm "$RVMM"; then continue; fi
              MPATH=$(echo "$RVMM" | sed 's/modules_update/modules/')
              if [ -f "$MPATH/remove" ]; then continue; fi
              echo "$RVMM"
            done

            for RVMM in /data/adb/modules/*-jhc* /data/adb/modules/line-andrew-andrew-arm64; do
              if ! is_valid_rvmm "$RVMM"; then continue; fi
              if [ -f "$RVMM/remove" ]; then continue; fi
              MUPATH=$(echo "$RVMM" | sed 's/modules/modules_update/')
              if [ -d "$MUPATH" ]; then continue; fi
              echo "$RVMM"
            done
          }
          '''
          s = s[:a] + collect + s[b:]

          old = '''is_valid_rvmm() {
            if [ ! -d "$1" ]; then return 1; fi
            if ! grep -Fq "j-hc" "$1/module.prop"; then return 1; fi
            if [ ! -f "$1/config" ]; then return 1; fi
            return 0
          }'''
          new = '''is_valid_rvmm() {
            if [ ! -d "$1" ]; then return 1; fi
            if [ ! -f "$1/config" ]; then return 1; fi
            case "$1" in
              */line-andrew-andrew-arm64) return 0 ;;
            esac
            if ! grep -Fq "j-hc" "$1/module.prop"; then return 1; fi
            return 0
          }'''
          if old not in s:
              raise SystemExit("is_valid_rvmm block not found")
          s = s.replace(old, new)

          old = '''    if ! BASEPATH=$(pm path "$PKG_NAME" 2>&1 </dev/null) || [ -z "$BASEPATH" ]; then
              ui_print "ERROR: $PKG_NAME is not installed. Re-flash its module and dont reboot."
              continue
            fi
            RVPATH="/data/adb/rvhc/${rvmm_path##*/}.apk"
            if [ ! -f "$RVPATH" ]; then
              ui_print "ERROR: $RVPATH does not exist. Re-flash its module and dont reboot."
