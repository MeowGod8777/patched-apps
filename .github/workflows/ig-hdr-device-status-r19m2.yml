name: IG 439 HDR Device Status R19m2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ig-hdr-device-status-r19m2.yml]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Extract exact device_status block from 03u7.A04
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" classes15.dex -d work/apk
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes15.dex -o work/smali >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=next(Path('work/smali').rglob('03u7.smali'))
          ls=p.read_text(errors='replace').splitlines()
          # isolate A04
          b=[]; i=0
          while i<len(ls):
            if ls[i].startswith('.method') and ' A04()LX/03ci;' in ls[i]:
              s=i; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              b=ls[s:i+1]; break
            i+=1
          O=['Instagram 439 HDR Reels device_status R19m2','========================================','',f'A04_LINES={len(b)}','']
          idx=[i for i,x in enumerate(b) if 'DeviceStatusApiUtil' in x or 'device_status' in x or 'reels_media' in x or 'clips/' in x or 'reel' in x.lower()]
          O += ['===== ALL ROUTE / DEVICE STATUS STRING SITES =====']
          seen=set()
          for j in idx:
            lo=max(0,j-35); hi=min(len(b),j+45)
            key=(lo,hi)
            if key in seen: continue
            seen.add(key); O += [f'--- around index {j} ---']+b[lo:hi]+['']
          # Extract all const-string values in A04 and all invokes during status block.
          vals=[]
          for x in b:
            m=re.search(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',x)
            if m: vals.append(m.group(1))
          O += ['===== A04 STRING LITERALS =====']+vals+['']
          # Find producer method calls in range DeviceStatusApiUtil -> device_status write.
          a=next((i for i,x in enumerate(b) if 'DeviceStatusApiUtil' in x),0)
          z=next((i for i,x in enumerate(b) if '"device_status"' in x),len(b)-1)
          O += ['===== DEVICE STATUS PRODUCER BLOCK FULL =====']+b[max(0,a-25):min(len(b),z+35)]+['']
          invokes=[x.strip() for x in b[a:z+5] if 'invoke-' in x]
          O += ['===== PRODUCER INVOKES =====']+invokes+['']
          out=Path('research/generated/instagram_439_hdr_device_status_r19m2.txt')
          out.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:14000])); print('bytes',out.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_device_status_r19m2.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Reels device_status request field trace R19m2'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
