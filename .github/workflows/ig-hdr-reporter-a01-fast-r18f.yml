name: IG 439 HDR Reporter A01 Fast R18f

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-reporter-a01-fast-r18f.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Extract classes10 and A01 only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -p "work/$APK_NAME" classes10.dex > work/classes10.dex
          java -jar work/baksmali-3.0.10-fat.jar d work/classes10.dex -o work/smali
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/smali/X/0knW.smali')
          ls=p.read_text(errors='replace').splitlines()
          out=[]
          for i,x in enumerate(ls):
            if x.startswith('.method') and ' A01(Landroid/content/Context;LX/02rJ;)V' in x:
              j=i+1
              while j<len(ls) and not ls[j].startswith('.end method'): j+=1
              out=ls[i:j+1]; break
          assert out, 'A01 not found'
          text='Instagram 439 LX/0knW.A01 fast R18f\n=====================================\n'+'\n'.join(out)+'\n'
          Path('research/generated/instagram_439_hdr_reporter_a01_fast_r18f.txt').write_text(text)
          print(text)
          PY
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_reporter_a01_fast_r18f.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Instagram HDR reporter A01 fast trace R18f'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
