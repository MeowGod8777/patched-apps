name: IG 439 HDR Clips Discover Helpers R19l

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-clips-discover-helpers-r19l.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Extract exact Clips discover helper bodies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" classes15.dex -d work/apk
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes15.dex -o work/smali >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          O=['Instagram 439 Clips discover helper params R19l','===========================================','']
          wanted={
            'X/04tC.smali': {'A02','A04','A05','A07'},
            'X/04u9.smali': {'A00'},
          }
          for fn,names in wanted.items():
              p=Path('work/smali')/fn
              ls=p.read_text(errors='replace').splitlines()
              O += [f'===== FILE {fn} =====','']
              i=0
              while i<len(ls):
                  if not ls[i].startswith('.method'): i+=1; continue
                  s=i; sig=ls[i]; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                  e=min(i,len(ls)-1); b=ls[s:e+1]
                  m=re.search(r'\s(A\d\d)\(',sig)
                  if m and m.group(1) in names:
                      t='\n'.join(b)
                      lits=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"(.*)"',t)
                      mc=re.findall(r'const-wide\s+[^,]+,\s+(0x[0-9a-fA-F]+L)',t)
                      calls=re.findall(r'invoke-\S+ \{[^}]*\}, (L[^;]+;)->([^\(]+)\(([^)]*)\)(\S+)',t)
                      O += [f'--- {sig}',f'LITERALS={lits}',f'MOBILECONFIG_IDS={mc}',f'CALLS={calls}']+b+['']
                  i+=1
          Path('research/generated/instagram_439_hdr_clips_discover_helpers_r19l.txt').write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:12000]))
          PY
      - name: Commit R19l report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_clips_discover_helpers_r19l.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Clips discover helper param trace R19l'
            git pull --rebase origin main
            git push origin HEAD:main
          fi