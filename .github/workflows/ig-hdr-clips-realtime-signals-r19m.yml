name: IG 439 HDR Clips Realtime Signals R19m

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-clips-realtime-signals-r19m.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Extract likely signal dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" classes2.dex classes15.dex -d work/apk
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes2.dex -o work/smali/classes2 >/dev/null &
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes15.dex -o work/smali/classes15 >/dev/null &
          wait
          python3 - <<'PY'
          from pathlib import Path
          import re
          O=['Instagram 439 Clips realtime request signals R19m','=============================================','']
          targets=['X/02sx.smali','X/04jk.smali','X/04ji.smali','X/04u1.smali','X/04u2.smali']
          for rel in targets:
              found=[]
              for base in [Path('work/smali/classes2'),Path('work/smali/classes15')]:
                  p=base/rel
                  if p.exists(): found.append(p)
              O += [f'===== {rel} =====']
              if not found: O += ['NOT_FOUND','']; continue
              for p in found:
                  ls=p.read_text(errors='replace').splitlines()
                  O += [f'FILE={p}']+ls+['']
          # extract 04tC A00/A03/A06 additionally
          p=Path('work/smali/classes15/X/04tC.smali')
          if p.exists():
              ls=p.read_text(errors='replace').splitlines(); i=0
              O += ['===== 04tC auxiliary helpers =====','']
              while i<len(ls):
                  if not ls[i].startswith('.method'): i+=1; continue
                  s=i; sig=ls[i]; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                  e=min(i,len(ls)-1); b=ls[s:e+1]
                  if re.search(r'\sA(00|03|06)\(',sig):
                      O += [f'--- {sig}']+b+['']
                  i+=1
          Path('research/generated/instagram_439_hdr_clips_realtime_signals_r19m.txt').write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:12000]))
          PY
      - name: Commit R19m report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_clips_realtime_signals_r19m.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Clips realtime request signal trace R19m'
            git pull --rebase origin main
            git push origin HEAD:main
          fi