name: IG 439 HDR DASH Path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dash-path.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download/disassemble exact R8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do b="$(basename "$d" .dex)"; "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"; done
      - name: Extract DASH path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          mh=re.compile(r'\|\[[0-9a-f]+\]\s+([^\s]+):')
          tokens=(
            'androidx/media3/exoplayer/dash','DashMediaSource','DashManifest','DashManifestParser',
            'DashChunkSource','Representation','AdaptationSet','video_dash_manifest','dash_manifest',
            'application/dash+xml','application/x-mpegURL','video_versions','video/av01'
          )
          out=['Instagram 439 DASH / representation path','========================================','']
          count=0
          for p in sorted(Path('work/dis').glob('classes*.txt')):
              lines=p.read_text(errors='replace').splitlines()
              starts=[]; heads=[]
              for i,l in enumerate(lines):
                  m=mh.search(l)
                  if m: starts.append(i); heads.append(m.group(1))
              for j,s in enumerate(starts):
                  e=starts[j+1] if j+1<len(starts) else len(lines)
                  b=lines[s:e]; txt='\n'.join(b)
                  if any(t.lower() in txt.lower() for t in tokens):
                      count+=1
                      out.append(f'===== {p.name}:{s+1}-{e} :: {heads[j]} =====')
                      for l in b:
                          if ('const-string' in l or 'invoke-' in l or 'new-instance' in l or
                              'check-cast' in l or 'return-' in l or 'if-' in l or
                              any(t.lower() in l.lower() for t in tokens) or
                              'LX/03oR;' in l or 'Uri;' in l or 'MediaItem' in l):
                              out.append(l.rstrip())
                      out.append('')
          out.insert(3,f'matched methods={count}')
          out.insert(4,'')
          path=Path('research/generated/instagram_439_hdr_dash_path.txt')
          path.write_text('\n'.join(out)+'\n')
          print(path.read_text()[:160000])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_hdr_dash_path.txt
          if ! git diff --cached --quiet; then git commit -m "Trace Instagram 439 DASH playback path"; fi
          git pull --rebase origin main
          git push origin HEAD:main
