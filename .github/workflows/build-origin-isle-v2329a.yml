name: Build Origin Isle V2329A media diagnostic

on:
  push:
    branches:
      - origin-isle-v2329a-media-force-show
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch upstream Origin Isle v1.4.0
        run: |
          git clone --depth 1 --branch v1.4.0 https://github.com/fvhde/origin-isle.git origin-isle-A
          cp -a origin-isle-A origin-isle-B

      - name: Patch A - force-show only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('origin-isle-A/app/src/main/java/com/originisle/android/cards/MediaCard.kt')
          s = p.read_text()
          needle = '            putExtra("icon_res", R.drawable.ic_media_play)\n'
          replacement = needle + '            putExtra("oi_force_show", true)\n'
          if needle not in s:
              raise SystemExit('MediaCard icon_res anchor not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY

      - name: Patch B - force-show + BASE media template fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('origin-isle-B/app/src/main/java/com/originisle/android/cards/MediaCard.kt')
          s = p.read_text()
          anchor = '            putExtra("icon_res", R.drawable.ic_media_play)\n'
          if anchor not in s:
              raise SystemExit('MediaCard icon_res anchor not found')
          s = s.replace(anchor, anchor + '            putExtra("oi_force_show", true)\n', 1)
          old = '            putExtra("oi_template", OriginIslandConstants.TEMPLATE_BUTTONS)'
          new = '            putExtra("oi_template", OriginIslandConstants.TEMPLATE_BASE)'
          if old not in s:
              raise SystemExit('MediaCard TEMPLATE_BUTTONS anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Build A
        working-directory: origin-isle-A
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Build B
        working-directory: origin-isle-B
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp origin-isle-A/app/build/outputs/apk/debug/app-debug.apk out/origin-isle-1.4.0-v2329a-A-force-show.apk
          cp origin-isle-B/app/build/outputs/apk/debug/app-debug.apk out/origin-isle-1.4.0-v2329a-B-force-show-base.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt

      - name: Upload diagnostic APKs
        uses: actions/upload-artifact@v4
        with:
          name: origin-isle-v2329a-media-diagnostic
          path: out/*
          if-no-files-found: error
