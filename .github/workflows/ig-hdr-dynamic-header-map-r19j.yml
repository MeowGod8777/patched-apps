name: IG 439 HDR Dynamic Header Map R19j

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-dynamic-header-map-r19j.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact APK and disassemble classes2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -p "work/$APK_NAME" classes2.dex > work/classes2.dex
          java -jar work/baksmali-3.0.10-fat.jar d work/classes2.dex -o work/smali/classes2 >/dev/null
      - name: Resolve LX 04qU dynamic header map producers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          R=Path('work/smali/classes2')
          OUT=Path('research/generated/instagram_439_hdr_dynamic_header_map_r19j.txt')
          cr=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          sr=re.compile(r'^\s*const-string(?:/jumbo)?\s+([^,]+),\s+"(.*)"')
          methods=[]; classes={}
          for p in R.rglob('*.smali'):
              ls=p.read_text(errors='replace').splitlines(); cls='?'
              for x in ls[:50]:
                  m=cr.match(x)
                  if m: cls=m.group(1); break
              classes[cls]=(p,ls)
              i=0
              while i<len(ls):
                  if not ls[i].startswith('.method'): i+=1; continue
                  s=i; sig=ls[i]; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                  e=min(i,len(ls)-1); methods.append((cls,sig,p,ls[s:e+1])); i+=1
          O=['Instagram 439 Reels dynamic common-header map R19j','==============================================','']
          for target in ('LX/04qU;','LX/02dp;'):
              O += [f'===== FULL CLASS {target} =====']
              if target in classes:
                  p,ls=classes[target]; O += [f'FILE={p}']+ls+['']
              else: O += ['NOT_FOUND','']
          O += ['===== ALL LX/04qU TOUCH METHODS =====','']
          touch=[]
          for cls,sig,p,b in methods:
              text='\n'.join(b)
              if 'LX/04qU;' not in text and 'LX/04qU;' not in sig: continue
              tags=[]
              if 'new-instance' in text and 'LX/04qU;' in text: tags.append('CONSTRUCT')
              if 'LX/04qU;->A00' in text: tags.append('A00_MAP')
              if 'LX/04qU;->A01' in text: tags.append('A01')
              if 'LX/02qb;->A01(' in text: tags.append('DECORATOR_CALL')
              vals=[]
              for l in b:
                  m=sr.match(l)
                  if m and any(k in m.group(2).lower() for k in ('x-','header','device','capab','hdr','codec','video','media','quality','bandwidth','network','connection','display','screen','model','family','accept','hint','user-agent')):
                      vals.append(m.group(2))
              touch.append((cls,sig,p,b,tags,vals))
          for cls,sig,p,b,tags,vals in touch:
              O += [f'--- {cls} {sig}',f'FILE={p}',f'TAGS={tags}',f'HIGH_VALUE_STRINGS={vals}']
              if any(t in tags for t in ('CONSTRUCT','A00_MAP','DECORATOR_CALL')): O += b
              else:
                  for i,l in enumerate(b):
                      if 'LX/04qU;' in l: O += [f'{j:04d}: {b[j]}' for j in range(max(0,i-8),min(len(b),i+9))]
              O += ['']
          O += ['===== 04qU.A00 MAP.PUT CANDIDATES =====','']
          for cls,sig,p,b,tags,vals in touch:
              for i,l in enumerate(b):
                  if 'LX/04qU;->A00:Ljava/util/Map;' in l:
                      O += [f'--- {cls} {sig} FILE={p} A00_INDEX={i} ---']+[f'{j:04d}: {b[j]}' for j in range(max(0,i-15),min(len(b),i+45))]+['']
          O += ['===== REELS HEAD/TAIL DATA SOURCE CONTEXT =====','']
          for cls,sig,p,b in methods:
              if cls=='LX/04ej;' and (' Eam(' in sig or ' Eao(' in sig): O += [f'--- {cls} {sig}',f'FILE={p}']+b+['']
          OUT.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:9000])); print('bytes',OUT.stat().st_size,'touch',len(touch))
          PY
      - name: Commit R19j report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_dynamic_header_map_r19j.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Reels dynamic header map trace R19j'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
# retrigger
