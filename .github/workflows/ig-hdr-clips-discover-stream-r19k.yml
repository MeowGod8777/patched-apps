name: IG 439 HDR Clips Discover Stream R19k

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-clips-discover-stream-r19k.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '21'}
      - name: Extract exact Clips discover builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" classes15.dex -d work/apk
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes15.dex -o work/smali >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/smali/X/04tC.smali')
          ls=p.read_text(errors='replace').splitlines()
          O=['Instagram 439 Clips discover stream exact R19k','=========================================','']
          # exact A0A only
          i=0; found=False
          while i<len(ls):
              if ls[i].startswith('.method') and ' A0A(' in ls[i]:
                  s=i; i+=1
                  while i<len(ls) and not ls[i].startswith('.end method'): i+=1
                  b=ls[s:i+1]; t='\n'.join(b)
                  if 'clips/discover/stream/' in t or 'clips/homecoming/' in t:
                      found=True
                      lits=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"(.*)"',t)
                      invokes=re.findall(r'invoke-\S+ \{[^}]*\}, (L[^;]+;)->([^\(]+)\(([^)]*)\)(\S+)',t)
                      O += ['===== EXACT A0A BODY =====',f'LITERALS={lits}',f'INVOKES={invokes}']+b+['']
              i+=1
          if not found: O += ['TARGET_NOT_FOUND']
          Path('research/generated/instagram_439_hdr_clips_discover_stream_r19k.txt').write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:9000]))
          PY
      - name: Commit R19k report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_clips_discover_stream_r19k.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add exact Clips discover stream trace R19k'
            git pull --rebase origin main
            git push origin HEAD:main
          fi