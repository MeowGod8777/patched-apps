name: IG 439 Candidate X0LbF Trace R11

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ig-hdr-x0lbf-trace-r11.yml]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Dexdump exact APK
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          set -euo pipefail
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do "$DEXDUMP" -d -f -h "$d" > "work/dis/$(basename "$d" .dex).txt"; done
      - name: Dump candidate and all callsites
        run: |
          set -euo pipefail
          O=research/generated/instagram_439_x0lbf_candidate_r11.txt
          {
            echo '===== X.0LbF class/method ====='
            grep -aHn -B 180 -A 500 -F 'X.0LbF.A00:' work/dis/*.txt || true
            echo
            echo '===== callsites invoking LX/0LbF;.A00 ====='
            grep -aHn -B 220 -A 320 -F 'LX/0LbF;.A00:' work/dis/*.txt || true
            echo
            echo '===== device_capabilities in same dex neighborhood ====='
            grep -aHn -B 160 -A 260 -F '"device_capabilities"' work/dis/classes19.txt || true
          } > "$O"
          wc -c "$O"
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_x0lbf_candidate_r11.txt
          if ! git diff --cached --quiet; then git commit -m 'Trace candidate Instagram Reels device capabilities request'; fi
          git pull --rebase origin main
          git push origin HEAD:main
