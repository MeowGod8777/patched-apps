name: Build YT Music Luna Vivo c0 full support-event V6

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-ytmusic-luna-vivo-c0-full-support-event-v6.yml
      - tools/ytmusic_vivo_c0_full_support_event_v6.py
      - tools/ytmusic_vivo_c0_playable_mediaid_v5.py
      - tools/ytmusic_vivo_c0_native_mediaid_v4n.py
      - tools/ytmusic_vivo_c0_real_queue_v2.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Download exact validated Luna base and tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input tools out
          gh release download ytmusic-originplayer-luna-33729902415 --pattern '*.apk' --dir input
          mv input/*.apk input/base.apk
          BASE_SHA=$(sha256sum input/base.apk | awk '{print $1}')
          echo "base_sha256=$BASE_SHA" | tee out/input-sha256.txt
          test "$BASE_SHA" = '0b1b61ad6bd87dacc88517adf19c1115085d529e63847d50d587476efa4ce307'
          curl -L --fail --retry 3 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -L --fail --retry 3 -o tools/bcprov.jar https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.82/bcprov-jdk18on-1.82.jar

      - name: Decode, snapshot guards, and apply V6
        shell: bash
        run: |
          set -euo pipefail
          java -jar tools/apktool.jar d -f input/base.apk -o decoded

          ID=$(grep -Rl 'onPlayFromMediaId(Ljava/lang/String;Landroid/os/Bundle;)V' decoded/smali*/id.smali | head -n1)
          LAG=$(grep -Rl '^\.method public final g(Ljava/lang/String;Landroid/os/Bundle;)V' decoded/smali*/lag.smali | head -n1)
          II=$(grep -Rl '^\.method public final m(Landroid/support/v4/media/MediaMetadataCompat;)V' decoded/smali*/ii.smali | head -n1)
          test -n "$ID"; test -n "$LAG"; test -n "$II"
          cp "$ID" out/base-id.smali
          cp "$LAG" out/base-lag.smali
          python3 - "$II" out/base-ii-m.smali out/base-ii-n.smali <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text()
          for sig,out in [
            (r'\.method public final m\(Landroid/support/v4/media/MediaMetadataCompat;\)V',sys.argv[2]),
            (r'\.method public final n\(Landroid/support/v4/media/session/PlaybackStateCompat;\)V',sys.argv[3]),
          ]:
            m=re.search(r'(?ms)^'+sig+r'\n.*?^\.end method',s)
            assert m, sig
            Path(out).write_text(m.group(0))
          PY

          python3 tools/ytmusic_vivo_c0_full_support_event_v6.py decoded

          ID2=$(grep -Rl 'onPlayFromMediaId(Ljava/lang/String;Landroid/os/Bundle;)V' decoded/smali*/id.smali | head -n1)
          LAG2=$(grep -Rl '^\.method public final g(Ljava/lang/String;Landroid/os/Bundle;)V' decoded/smali*/lag.smali | head -n1)
          II2=$(grep -Rl '^\.method public final m(Landroid/support/v4/media/MediaMetadataCompat;)V' decoded/smali*/ii.smali | head -n1)
          KYI=$(grep -Rl '^\.method public final j()V' decoded/smali*/kyi.smali | head -n1)
          BROWSER=$(find decoded -type f -path '*/com/google/android/apps/youtube/music/mediabrowser/MusicBrowserService.smali' -print -quit)
          test -n "$ID2"; test -n "$LAG2"; test -n "$II2"; test -n "$KYI"; test -n "$BROWSER"

          cmp -s out/base-id.smali "$ID2"
          echo 'PASS: Lid unchanged' | tee out/lid-regression-guard.txt
          cmp -s out/base-lag.smali "$LAG2"
          echo 'PASS: Llag unchanged' | tee out/lag-regression-guard.txt

          python3 - "$II2" out/base-ii-m.smali out/base-ii-n.smali <<'PY' | tee out/metadata-timing-regression-guard.txt
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text()
          mm=re.search(r'(?ms)^\.method public final m\(Landroid/support/v4/media/MediaMetadataCompat;\)V\n.*?^\.end method',s)
          nn=re.search(r'(?ms)^\.method public final n\(Landroid/support/v4/media/session/PlaybackStateCompat;\)V\n.*?^\.end method',s)
          assert mm and nn
          after_m=mm.group(0)
          base_m=Path(sys.argv[2]).read_text()
          base_n=Path(sys.argv[3]).read_text()
          assert nn.group(0)==base_n, 'PlaybackState sink changed'
          block='''    const-string v3, "vivomusicmix.media.metadata.support_event"\n\n    const-wide/16 v4, 0x9df\n\n    invoke-virtual {v0, v3, v4, v5}, Landroid/media/MediaMetadata$Builder;->putLong(Ljava/lang/String;J)Landroid/media/MediaMetadata$Builder;\n\n'''
          assert after_m.count(block)==1, after_m.count(block)
          assert after_m.replace(block,'',1)==base_m, 'ii.m has changes beyond sole support_event block'
          print('PASS: ii.n byte-for-byte unchanged; ii.m delta is exactly support_event=0x9DF')
          PY

          python3 - "$KYI" <<'PY' | tee out/playable-endpoint-guard.txt
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text()
          m=re.search(r'(?ms)^\.method public final j\(\)V\n.*?^\.end method',s); assert m
          j=m.group(0)
          assert j.count('Lnoq;->n()Lazmi;')==1
          assert j.count('Lazmi;->b:Lboht;')==1
          assert j.count('Llgl;->d(Lboht;)Ljava/lang/String;')==1
          assert 'Lnoq;->o()Lboht;' not in j
          assert 'Lnoq;->p()Lboht;' not in j
          print('PASS: V5 playable endpoint retained')
          PY

          grep -q 'field public static volatile vivoNativeIds:Ljava/util/concurrent/ConcurrentHashMap;' "$BROWSER"
          test "$(grep -RIl 'vivomusicmix.media.metadata.support_event' decoded/smali* | wc -l)" -eq 1
          grep -q 'const-wide/16 v4, 0x9df' "$II2"
          ! grep -R -q 'YTM_C0TRACE' decoded/smali*
          ! grep -R -q 'YTM_V5STATE' decoded/smali*
          grep -n -A12 -B8 'vivomusicmix.media.metadata.support_event' "$II2" | tee out/support-event-context.txt

      - name: Rebuild and 16K align
        shell: bash
        run: |
          set -euo pipefail
          java -jar tools/apktool.jar b decoded -o out/unsigned.apk
          BT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -P 16 -f 4 out/unsigned.apk out/aligned.apk
          "$BT/zipalign" -c -P 16 -v 4 out/aligned.apk | tee out/zipalign-before-sign.txt

      - name: Sign and verify
        shell: bash
        run: |
          set -euo pipefail
          norm() { tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'; }
          BASE_CERT=$(java -jar bin/apksigner.jar verify --print-certs input/base.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | norm)
          BKS_CERT=$(keytool -list -v -keystore ks.keystore -storetype BKS -storepass 123456789 -alias andrewliang -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider -providerpath tools/bcprov.jar | sed -n 's/^[[:space:]]*SHA256: //p' | norm)
          test "$BASE_CERT" = '7762ee243d1157ef3d6de884690ff70a385fc251fe8f491eb6c71f6a8e392e2c'
          test "$BKS_CERT" = "$BASE_CERT"
          keytool -importkeystore -srckeystore ks.keystore -srcstoretype BKS -srcstorepass 123456789 -srcalias andrewliang -srckeypass 123456789 -destkeystore out/signer.p12 -deststoretype PKCS12 -deststorepass 123456789 -destkeypass 123456789 -destalias andrewliang -noprompt -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider -providerpath tools/bcprov.jar
          OUT=out/YouTube_Music_9.15.51_Luna_VIVO_C0_FULL_SUPPORT_EVENT_V6.apk
          java -jar bin/apksigner.jar sign --ks out/signer.p12 --ks-type PKCS12 --ks-pass pass:123456789 --key-pass pass:123456789 --ks-key-alias andrewliang --out "$OUT" out/aligned.apk
          rm -f out/*.idsig
          java -jar bin/apksigner.jar verify --verbose --print-certs "$OUT" | tee out/signature-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' out/signature-verify.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' out/signature-verify.txt
          OUT_CERT=$(java -jar bin/apksigner.jar verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | norm)
          test "$OUT_CERT" = "$BASE_CERT"
          BT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -c -P 16 -v 4 "$OUT" | tee out/zipalign-final.txt
          APK_SHA=$(sha256sum "$OUT" | awk '{print $1}')
          echo "$APK_SHA  $OUT" | tee out/SHA256.txt
          echo "APK_SHA=$APK_SHA" >> "$GITHUB_ENV"
          python3 - "$OUT" <<'PY' | tee out/native-libs.txt
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              xs=[i for i in z.infolist() if i.filename.startswith('lib/arm64-v8a/') and i.filename.endswith('.so')]
              print('arm64_so_count=',len(xs)); assert len(xs)==21
              assert all(i.compress_type==zipfile.ZIP_STORED for i in xs)
          PY

      - name: Static manifest and package verification
        shell: bash
        run: |
          set -euo pipefail
          OUT=out/YouTube_Music_9.15.51_Luna_VIVO_C0_FULL_SUPPORT_EVENT_V6.apk
          BT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          "$BT/aapt" dump badging "$OUT" | tee out/badging.txt
          grep -q "package: name='com.luna.music'" out/badging.txt
          grep -q "versionName='9.15.51'" out/badging.txt
          "$BT/aapt" dump xmltree "$OUT" AndroidManifest.xml | tee out/manifest-xmltree.txt
          grep -q 'com.vivo.musicwidgetmix.support.service' out/manifest-xmltree.txt
          grep -q 'com.google.android.apps.youtube.music.mediabrowser.MusicBrowserService' out/manifest-xmltree.txt

      - name: Upload V6 candidate and evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ytmusic-luna-vivo-c0-full-support-event-v6
          path: |
            out/YouTube_Music_9.15.51_Luna_VIVO_C0_FULL_SUPPORT_EVENT_V6.apk
            out/SHA256.txt
            out/input-sha256.txt
            out/signature-verify.txt
            out/zipalign-final.txt
            out/native-libs.txt
            out/badging.txt
            out/manifest-xmltree.txt
            out/lid-regression-guard.txt
            out/lag-regression-guard.txt
            out/metadata-timing-regression-guard.txt
            out/playable-endpoint-guard.txt
            out/support-event-context.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit build-success checkpoint
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          cat > IQOO12PRO_YTMUSIC_V6_FULL_SUPPORT_EVENT_BUILD_SUCCESS_2026-09-04.md <<EOF
          # iQOO 12 Pro / OriginOS 6 — YouTube Music V6 full support-event build success

          Date: 2026-09-04

          - APK: \`YouTube_Music_9.15.51_Luna_VIVO_C0_FULL_SUPPORT_EVENT_V6.apk\`
          - Run: \`${RUN_ID}\`
          - Artifact: \`${ARTIFACT_ID}\`
          - Artifact URL: \`${ARTIFACT_URL}\`
          - APK SHA256: \`${APK_SHA}\`
          - Base SHA256: \`0b1b61ad6bd87dacc88517adf19c1115085d529e63847d50d587476efa4ce307\`
          - Signer SHA256: \`7762ee243d1157ef3d6de884690ff70a385fc251fe8f491eb6c71f6a8e392e2c\`

          Functional delta over runtime-confirmed V5: only \`vivomusicmix.media.metadata.support_event=0x9DF\` at \`Lii.m\` framework MediaMetadata publication.

          Verification PASS: V5 playable endpoint retained; Lid/Llag unchanged; PlaybackState sink byte-for-byte unchanged; ii.m delta exactly one support-event block; no trace instrumentation; v2/v3 signature; same signer; 16K zipalign; 21 stored arm64 libraries; package/version/manifest identity.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IQOO12PRO_YTMUSIC_V6_FULL_SUPPORT_EVENT_BUILD_SUCCESS_2026-09-04.md
          git commit -m 'Checkpoint YT Music V6 full support-event build success'
          git push
