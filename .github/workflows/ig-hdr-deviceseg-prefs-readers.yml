name: IG 439 Device Segmentation Preference Readers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ig-hdr-deviceseg-prefs-readers.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Download and dexdump
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          set -euo pipefail
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do b="$(basename "$d" .dex)"; "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"; done
      - name: Extract prefs readers and keys
        run: |
          set -euo pipefail
          REPORT=research/generated/instagram_439_hdr_deviceseg_prefs_readers.txt
          {
            echo '===== com.facebook.devicesegmentation contexts ====='
            grep -aHn -B 180 -A 420 -F 'com.facebook.devicesegmentation' work/dis/*.txt || true
            echo '===== X.0hkS A00 SharedPreferences uses ====='
            grep -aHn -B 160 -A 300 -E 'LX/0hkS;\.A00:Landroid/content/SharedPreferences|LX/0hkS;->A00:Landroid/content/SharedPreferences' work/dis/*.txt || true
            echo '===== segmentation-ish keys ====='
            grep -aHn -B 100 -A 180 -Ei 'device.?segment|device.?tier|performance.?tier|performance.?class|benchmark.?result|benchmark.?score|segment.?score|device.?classif|odc.?class|classifier' work/dis/*.txt || true
          } | tr -cd '\11\12\15\40-\176' > "$REPORT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research/generated/instagram_439_hdr_deviceseg_prefs_readers.txt'); b=p.read_bytes(); p.write_bytes(b[:420000])
          PY
          sed -n '1,5600p' "$REPORT"
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_deviceseg_prefs_readers.txt
          if ! git diff --cached --quiet; then git commit -m 'Trace Instagram 439 device segmentation preference readers'; fi
          git pull --rebase origin main
          git push origin HEAD:main
