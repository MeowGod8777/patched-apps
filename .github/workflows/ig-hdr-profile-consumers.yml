name: IG 439 AV1 Profile Consumers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-profile-consumers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact Release 8 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          echo "DEXDUMP=$DEXDUMP" >> "$GITHUB_ENV"

      - name: Disassemble all DEX files
        run: |
          for d in work/dex/classes*.dex; do
            b="$(basename "$d" .dex)"
            "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
          done

      - name: Extract codec profile consumers
        shell: bash
        run: |
          REPORT=research/generated/instagram_439_av1_profile_consumers.txt
          {
            echo "Instagram 439 AV1 profile consumer trace"
            echo "========================================"
            echo "APK SHA256: $APK_SHA256"
            echo "Runtime anchor: V2329A advertises AV1 Main8/Main10/HDR10/HDR10+; IG selected Main8 SDR."
            echo
            echo "===== CodecProfileLevel.profile / level references ====="
            grep -Hn -B 120 -A 180 -E 'CodecProfileLevel;\.profile:I|CodecProfileLevel;\.level:I' work/dis/*.txt || true
            echo
            echo "===== profileLevels field references ====="
            grep -Hn -B 120 -A 180 -E 'CodecCapabilities;\.profileLevels:\[Landroid/media/MediaCodecInfo\$CodecProfileLevel;' work/dis/*.txt || true
            echo
            echo "===== getCapabilitiesForType / isFormatSupported / findDecoderForFormat ====="
            grep -Hn -B 120 -A 180 -E 'getCapabilitiesForType|isFormatSupported|findDecoderForFormat' work/dis/*.txt || true
            echo
            echo "===== AV1 / rendition-selection nearby literals ====="
            grep -Hn -B 50 -A 90 -Ei 'video/av01|dav1d|representation_id|track_selector|selectTracks|supportsFormat|codecSupport|manifest' work/dis/*.txt | head -n 12000 || true
          } > "$REPORT"
          sed -n '1,1200p' "$REPORT"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_av1_profile_consumers.txt
          if ! git diff --cached --quiet; then
            git commit -m "Trace Instagram 439 AV1 profile consumers"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
