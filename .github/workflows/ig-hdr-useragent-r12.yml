name: IG 439 User Agent Device Identity R12

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ig-hdr-useragent-r12.yml]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Dexdump exact APK
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          set -euo pipefail
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do "$DEXDUMP" -d -f -h "$d" > "work/dis/$(basename "$d" .dex).txt"; done
      - name: Dump UA generator and identity dependencies
        run: |
          set -euo pipefail
          O=research/generated/instagram_439_useragent_device_identity_r12.txt
          {
            echo '===== LX/02rk class ====='
            grep -aHn -B 260 -A 900 -F 'X.02rk.A00:' work/dis/*.txt || true
            echo
            echo '===== callers ====='
            grep -aHn -B 170 -A 230 -F 'LX/02rk;.A00:' work/dis/*.txt || true
            echo
            echo '===== Android Build identity reads ====='
            grep -aHn -B 100 -A 160 -E 'Landroid/os/Build;\.(MODEL|MANUFACTURER|BRAND|DEVICE|PRODUCT|HARDWARE):' work/dis/*.txt || true
          } > "$O"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research/generated/instagram_439_useragent_device_identity_r12.txt'); b=p.read_bytes()
          if len(b)>950000: p.write_bytes(b[:950000])
          PY
          wc -c "$O"
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_useragent_device_identity_r12.txt
          if ! git diff --cached --quiet; then git commit -m 'Trace Instagram 439 User-Agent device identity'; fi
          git pull --rebase origin main
          git push origin HEAD:main
