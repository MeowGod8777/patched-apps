name: IG 439 HDR Streaming HTTP Build R19j

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-streaming-http-build-r19j.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch APK and locate HTTP build owners
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          : > work/hitdex.txt
          : > research/generated/instagram_439_hdr_streaming_http_owner_dex_r19j.txt
          for d in work/apk/classes*.dex; do
            names=$(java -jar work/baksmali-3.0.10-fat.jar list classes "$d" | grep -E '^(LX/02uA;|LX/03u7;|LX/02tx;|LX/02tz;|LX/02ua;|LX/07oR;)$' || true)
            if [ -n "$names" ]; then
              basename "$d" >> work/hitdex.txt
              printf '%s:\n%s\n' "$(basename "$d")" "$names" >> research/generated/instagram_439_hdr_streaming_http_owner_dex_r19j.txt
            fi
          done
          sort -u work/hitdex.txt -o work/hitdex.txt
          cat research/generated/instagram_439_hdr_streaming_http_owner_dex_r19j.txt
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait
      - name: Extract callable and server-visible sinks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          R=Path('work/smali'); O=['Instagram 439 HDR Streaming HTTP build R19j','==========================================','']
          cr=re.compile(r'^\.class\s+.*\s+(L[^;]+;)$')
          inv=re.compile(r'(L[^;]+;)->([^\s(]+)\(([^)]*)\)(\S+)')
          methods=[]; classes={}
          for p in R.rglob('*.smali'):
            ls=p.read_text(errors='replace').splitlines(); cls='?'
            for x in ls[:50]:
              m=cr.match(x)
              if m: cls=m.group(1); break
            classes[cls]=(p,ls)
            i=0
            while i<len(ls):
              if not ls[i].startswith('.method'): i+=1; continue
              s=i; sig=ls[i]; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              e=min(i,len(ls)-1); methods.append((cls,sig,p,ls[s:e+1])); i+=1
          for t in ['LX/02uA;','LX/02tx;','LX/02tz;','LX/02ua;','LX/07oR;']:
            O += [f'===== FULL {t} =====']
            if t in classes:
              p,ls=classes[t]; O += [f'FILE={p}']+ls+['']
            else: O += ['NOT_FOUND','']
          # 03u7 only methods that are invoked by 02uA or contain request serialization words.
          callees=set()
          for cls,sig,p,b in methods:
            if cls=='LX/02uA;':
              for l in b:
                if 'invoke-' in l:
                  m=inv.search(l)
                  if m: callees.add(m.groups())
          O += ['===== 02uA CALLEES =====',f'{sorted(callees)}','']
          for owner,name,args,ret in sorted(callees):
            if owner!='LX/03u7;': continue
            for cls,sig,p,b in methods:
              if cls==owner and f' {name}(' in sig:
                O += [f'===== 03u7 CALLEE {sig} wanted=({args}){ret} =====',f'FILE={p}']+b+['']
          words=('x-ig-','header','authorization','signed_body','content-type','accept','codec','hdr','av1','hevc','vp9','dash','manifest','capabil','device','quality','delivery','playback','bandwidth','resolution','screen','media','video','tigon','request','network','query','body','url')
          O += ['===== 03u7 REQUEST SERIALIZATION METHODS =====','']
          for cls,sig,p,b in methods:
            if cls!='LX/03u7;': continue
            low='\n'.join(b).lower(); hits=[w for w in words if w in low]
            if hits:
              O += [f'--- {sig}',f'HITS={hits}',f'FILE={p}']+b+['']
          # Every callable call() downstream invoke; resolve local defs where possible.
          for cls,sig,p,b in methods:
            if cls!='LX/02uA;' or (' call(' not in sig and ' invoke(' not in sig): continue
            O += [f'===== 02uA EXEC METHOD {sig} =====',f'FILE={p}']+b+['']
            for l in b:
              if 'invoke-' not in l: continue
              m=inv.search(l)
              if not m: continue
              owner,name,args,ret=m.groups()
              for c2,s2,p2,b2 in methods:
                if c2==owner and f' {name}(' in s2:
                  O += [f'--- LOCAL EXEC CALLEE {owner}->{name} wanted=({args}){ret}',s2,f'FILE={p2}']+b2+['']
          out=Path('research/generated/instagram_439_hdr_streaming_http_build_r19j.txt')
          out.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:14000])); print('bytes',out.stat().st_size)
          PY
      - name: Commit R19j reports
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_streaming_http_owner_dex_r19j.txt research/generated/instagram_439_hdr_streaming_http_build_r19j.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add StreamingHttpRequestTask HTTP build trace R19j'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
