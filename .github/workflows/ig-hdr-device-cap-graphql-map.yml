name: IG 439 Device Capability GraphQL Map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-device-cap-graphql-map.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download and dexdump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do
            b="$(basename "$d" .dex)"
            "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
          done
      - name: Build method map
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = ('device_capabilities','is_av1_hdr_supported','is_hevc_hdr_supported','display_hdr_supported','supported_display_hdr_types','hdr_supported_types')
          out=[]
          for p in sorted(Path('work/dis').glob('classes*.txt')):
              lines=p.read_text(errors='ignore').splitlines()
              cls='?'; method='?'; mstart=0
              for i,line in enumerate(lines):
                  mm=re.search(r'^\s*Class descriptor\s+: \'([^\']+)\'', line)
                  if mm: cls=mm.group(1)
                  mm=re.search(r'^\s*name\s+: \'([^\']+)\'', line)
                  # dexdump emits many field names too; identify a method only when nearby type/access/code follows.
                  if mm:
                      cand=mm.group(1)
                      look='\n'.join(lines[i:i+10])
                      if 'code          -' in look or ('type          :' in look and 'method_idx' in look):
                          method=cand; mstart=i
                  if any(t in line for t in targets):
                      lo=max(mstart, i-45); hi=min(len(lines), i+90)
                      block=lines[lo:hi]
                      strings=[]
                      for b in block:
                          sm=re.search(r'const-string(?:/jumbo)?\s+v\d+, "([^"]+)"', b)
                          if sm: strings.append(sm.group(1))
                      out += [f'===== {p.name} {cls}->{method} target_line={i+1} =====',
                              'STRINGS: ' + ' | '.join(dict.fromkeys(strings)),
                              *block, '']
          report='\n'.join(out)
          # keep ASCII and enough room for every occurrence
          report=''.join(c for c in report if c in '\n\r\t' or 32 <= ord(c) <= 126)
          Path('research/generated/instagram_439_hdr_device_cap_graphql_map.txt').write_text(report[:350000])
          print(report[:160000])
          PY
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_device_cap_graphql_map.txt
          if ! git diff --cached --quiet; then git commit -m 'Map Instagram 439 device capability GraphQL requests'; fi
          git pull --rebase origin main
          git push origin HEAD:main
