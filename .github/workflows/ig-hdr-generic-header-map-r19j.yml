name: IG 439 HDR Generic Header Map R19j

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-generic-header-map-r19j.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch and disassemble classes2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" classes2.dex -d work/apk
          java -jar work/baksmali-3.0.10-fat.jar d work/apk/classes2.dex -o work/smali/classes2 >/dev/null

      - name: Extract dynamic header map and producers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          ROOT=Path('work/smali/classes2')
          OUT=Path('research/generated/instagram_439_hdr_generic_header_map_r19j.txt')
          p=ROOT/'X/02qb.smali'
          ls=p.read_text(errors='replace').splitlines()
          # get A01 body
          s=next(i for i,l in enumerate(ls) if l.startswith('.method') and ' A01(' in l)
          e=next(i for i in range(s+1,len(ls)) if ls[i].startswith('.end method'))
          b=ls[s:e+1]
          O=['Instagram 439 HDR Generic Dynamic Header Map R19j','================================================','',f'FILE={p}',b[0],'']
          # all AMu writes with broad context
          amus=[i for i,l in enumerate(b) if 'LX/03u7;->AMu(' in l]
          O += [f'AMU_COUNT={len(amus)}','']
          for i in amus:
              O += [f'===== AMU_AT {i} =====']+[f'{j:04d}: {b[j]}' for j in range(max(0,i-35),min(len(b),i+12))]+['']
          # focus dynamic map iteration around last AMu
          if amus:
              i=amus[-1]
              O += ['===== LAST_DYNAMIC_AMU_WIDE_CONTEXT =====']+[f'{j:04d}: {b[j]}' for j in range(max(0,i-180),min(len(b),i+35))]+['']
          # list all invokes in the 220 lines before last dynamic AMu to identify producer
          if amus:
              i=amus[-1]
              O += ['===== LAST_DYNAMIC_AMU_UPSTREAM_INVOKES =====']
              for j in range(max(0,i-240),i+1):
                  if 'invoke-' in b[j]: O.append(f'{j:04d}: {b[j].strip()}')
              O += ['']
          OUT.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O));
          PY

      - name: Commit R19j report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_generic_header_map_r19j.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add generic dynamic header map trace R19j'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
