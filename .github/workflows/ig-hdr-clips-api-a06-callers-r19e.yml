name: IG 439 HDR ClipsApi A06 Callers R19e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-clips-api-a06-callers-r19e.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact APK and disassemble all dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          for d in work/apk/classes*.dex; do
            n="$(basename "$d" .dex)"
            java -jar work/baksmali-3.0.10-fat.jar d "$d" -o "work/smali/$n" >/dev/null &
          done
          wait
      - name: Extract A06 exact request and all direct callers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('work/smali')
          target='Lcom/instagram/clips/api/ClipsApiUtilHelper;->A06(Lcom/instagram/common/session/UserSession;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;I)LX/02ue;'
          out=Path('research/generated/instagram_439_hdr_clips_api_a06_callers_r19e.txt')
          O=['Instagram 439 HDR ClipsApiUtilHelper A06 callers R19e','=================================================','']

          def methods(p):
            ls=p.read_text(errors='replace').splitlines(); i=0
            while i<len(ls):
              if not ls[i].startswith('.method'):
                i+=1; continue
              s=i; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'): i+=1
              e=min(i,len(ls)-1)
              yield ls[s], ls[s:e+1]
              i+=1

          tp=None
          for p in root.rglob('ClipsApiUtilHelper.smali'):
            if 'com/instagram/clips/api/' in str(p): tp=p; break
          if not tp: raise SystemExit('target file not found')
          O += [f'TARGET_FILE={tp}','']

          body=None
          for sig,b in methods(tp):
            if ' A06(' in sig:
              body=b; break
          if body is None: raise SystemExit('A06 not found')

          text='\n'.join(body)
          strings=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',text)
          invokes=re.findall(r'invoke-\w+(?:/range)?\s+\{[^}]*\},\s+(L[^;]+;)->([^\(]+)\(([^)]*)\)(\S+)',text)
          O += ['===== EXACT ClipsApiUtilHelper.A06 =====',f'STRINGS={strings}',f'INVOKES={invokes}'] + body + ['']

          # compact request-write contexts: +/- 8 lines around LX/03u7 setters and MobileConfig reads
          O += ['===== A06 REQUEST-WRITE / CONFIG CONTEXTS =====']
          for i,line in enumerate(body):
            if ('LX/03u7;->' in line or 'MobileConfigUnsafeContext;->' in line or 'clips/items/' in line):
              a=max(0,i-8); z=min(len(body),i+9)
              O += [f'--- A06 lines {a+1}-{z} ---'] + body[a:z]
          O += ['']

          # Direct callers across the full APK
          callers=[]
          for p in root.rglob('*.smali'):
            for sig,b in methods(p):
              t='\n'.join(b)
              if target in t:
                cls='?'
                for x in p.read_text(errors='replace').splitlines()[:30]:
                  m=re.match(r'^\.class\s+.*\s+(L[^;]+;)$',x)
                  if m: cls=m.group(1); break
                ss=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',t)
                req=[s for s in ss if any(k in s.lower() for k in ('clip','reel','feed','media','dash','hdr','codec','quality','playback','request','session','module','rank','source'))]
                callers.append((cls,sig,str(p),req,b))
          O += [f'===== DIRECT CALLERS ({len(callers)}) =====','']
          for cls,sig,p,req,b in callers:
            O += [f'--- {cls} {sig}',f'FILE={p}',f'RELEVANT_STRINGS={req}'] + b + ['']

          # Methods in target class that also build clips/reels endpoints.
          O += ['===== SIBLING METHODS IN ClipsApiUtilHelper WITH ROUTE/REQUEST WRITES =====','']
          for sig,b in methods(tp):
            t='\n'.join(b); low=t.lower()
            if ('lx/03u7;->' in low and any(k in low for k in ('clips/','reels/','feed/','items/'))):
              ss=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',t)
              O += [f'--- {sig}',f'STRINGS={ss}'] + b + ['']

          out.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O[:5000]))
          print('bytes',out.stat().st_size,'callers',len(callers))
          PY
      - name: Commit R19e report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_clips_api_a06_callers_r19e.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add ClipsApiUtilHelper A06 caller trace R19e'
            git pull --rebase origin main
            git push origin HEAD:main
          fi