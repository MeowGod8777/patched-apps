name: Build IG HDR Test R6 Fixed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-ig-hdr-test-r6-fixed.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_APK: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      BASE_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
      OUT_APK: instagram-piko-v439.0.0.37.89-hdr-test-r6.apk
      TAG: ig-hdr-test-r6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Download exact R8 and tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/smali13 work/smali17 out
          gh release download 8 --pattern "$BASE_APK" --dir work
          echo "$BASE_SHA256  work/$BASE_APK" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'smali-3.0.10-fat.jar' --pattern 'baksmali-3.0.10-fat.jar' --dir work
          sudo apt-get update -qq
          sudo apt-get install -y -qq libbcprov-java
          unzip -p "work/$BASE_APK" classes13.dex > work/classes13.dex
          unzip -p "work/$BASE_APK" classes17.dex > work/classes17.dex
          java -jar work/baksmali-3.0.10-fat.jar d work/classes13.dex -o work/smali13
          java -jar work/baksmali-3.0.10-fat.jar d work/classes17.dex -o work/smali17
          test -f work/smali13/X/00PV.smali
          test -f work/smali17/X/09z5.smali

      - name: Inject parsed DASH boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/smali17/X/09z5.smali')
          lines=p.read_text().splitlines()
          target='A0S(Landroid/net/Uri;Lorg/xmlpull/v1/XmlPullParser;)LX/08rn;'
          starts=[i for i,l in enumerate(lines) if l.startswith('.method') and target in l]
          if len(starts)!=1: raise SystemExit(f'A0S count={len(starts)}')
          s=starts[0]
          e=next(i for i in range(s+1,len(lines)) if lines[i].startswith('.end method'))
          if any('hdrDumpParseR6' in l for l in lines): raise SystemExit('R6 helper exists')
          b=lines[s:e+1]

          raw_pat='    invoke-static/range {v27 .. v27}, LX/09z5;->A0P(Ljava/util/List;)Z'
          raw_hits=[i for i,l in enumerate(b) if l==raw_pat]
          if not raw_hits: raise SystemExit('A0P(v27) boundary missing')
          b[raw_hits[0]:raw_hits[0]]=[
            '    invoke-static/range {v27 .. v27}, LX/09z5;->hdrDumpParseR6(Ljava/util/List;)V',
            ''
          ]

          for meth,helper in [('A0b','hdrDumpA0bR6'),('A0c','hdrDumpA0cR6')]:
              pat=f'    invoke-virtual {{v9, v0}}, LX/09z5;->{meth}(Ljava/util/List;)Ljava/util/List;'
              hits=[i for i,l in enumerate(b) if l==pat]
              if len(hits)!=1: raise SystemExit(f'{meth} boundary count={len(hits)}')
              i=hits[0]
              mr=next(j for j in range(i+1,min(i+8,len(b))) if b[j].strip()=='move-result-object v27')
              b[mr+1:mr+1]=[
                '',
                f'    invoke-static/range {{v27 .. v27}}, LX/09z5;->{helper}(Ljava/util/List;)V'
              ]
          lines[s:e+1]=b

          helper=[
            '',
            '.method private static hdrDumpParseR6(Ljava/util/List;)V',
            '    .registers 2',
            '    const-string v0, "IG_HDR_R6_PARSE"',
            '    invoke-static {v0, p0}, LX/09z5;->hdrDumpListR6(Ljava/lang/String;Ljava/util/List;)V',
            '    return-void',
            '.end method',
            '',
            '.method private static hdrDumpA0bR6(Ljava/util/List;)V',
            '    .registers 2',
            '    const-string v0, "IG_HDR_R6_A0B"',
            '    invoke-static {v0, p0}, LX/09z5;->hdrDumpListR6(Ljava/lang/String;Ljava/util/List;)V',
            '    return-void',
            '.end method',
            '',
            '.method private static hdrDumpA0cR6(Ljava/util/List;)V',
            '    .registers 2',
            '    const-string v0, "IG_HDR_R6_A0C"',
            '    invoke-static {v0, p0}, LX/09z5;->hdrDumpListR6(Ljava/lang/String;Ljava/util/List;)V',
            '    return-void',
            '.end method',
            '',
            '.method private static hdrDumpListR6(Ljava/lang/String;Ljava/util/List;)V',
            '    .registers 10',
            '    if-eqz p1, :done',
            '    invoke-interface {p1}, Ljava/util/List;->iterator()Ljava/util/Iterator;',
            '    move-result-object v0',
            ':period_loop',
            '    invoke-interface {v0}, Ljava/util/Iterator;->hasNext()Z',
            '    move-result v1',
            '    if-eqz v1, :done',
            '    invoke-interface {v0}, Ljava/util/Iterator;->next()Ljava/lang/Object;',
            '    move-result-object v1',
            '    check-cast v1, LX/08tp;',
            '    if-eqz v1, :period_loop',
            '    iget-object v1, v1, LX/08tp;->A03:Ljava/util/List;',
            '    if-eqz v1, :period_loop',
            '    invoke-interface {v1}, Ljava/util/List;->iterator()Ljava/util/Iterator;',
            '    move-result-object v1',
            ':adapt_loop',
            '    invoke-interface {v1}, Ljava/util/Iterator;->hasNext()Z',
            '    move-result v2',
            '    if-eqz v2, :period_loop',
            '    invoke-interface {v1}, Ljava/util/Iterator;->next()Ljava/lang/Object;',
            '    move-result-object v2',
            '    check-cast v2, LX/08ti;',
            '    if-eqz v2, :adapt_loop',
            '    iget v3, v2, LX/08ti;->A06:I',
            '    const/4 v4, 0x2',
            '    if-ne v3, v4, :adapt_loop',
            '    iget-object v2, v2, LX/08ti;->A0E:Ljava/util/List;',
            '    if-eqz v2, :adapt_loop',
            '    invoke-interface {v2}, Ljava/util/List;->iterator()Ljava/util/Iterator;',
            '    move-result-object v2',
            ':rep_loop',
            '    invoke-interface {v2}, Ljava/util/Iterator;->hasNext()Z',
            '    move-result v3',
            '    if-eqz v3, :adapt_loop',
            '    invoke-interface {v2}, Ljava/util/Iterator;->next()Ljava/lang/Object;',
            '    move-result-object v3',
            '    check-cast v3, LX/096x;',
            '    if-eqz v3, :rep_loop',
            '    iget-object v3, v3, LX/096x;->A03:LX/03oR;',
            '    if-eqz v3, :rep_loop',
            '    invoke-static {v3}, LX/03oR;->A00(LX/03oR;)Ljava/lang/String;',
            '    move-result-object v3',
            '    invoke-static {p0, v3}, Landroid/util/Log;->i(Ljava/lang/String;Ljava/lang/String;)I',
            '    goto :rep_loop',
            ':done',
            '    return-void',
            '.end method',
            ''
          ]
          lines += helper
          p.write_text('\n'.join(lines)+'\n')
          PY
          java -jar work/smali-3.0.10-fat.jar a work/smali17 -o work/classes17-patched.dex

      - name: Inject renderer and selected boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/smali13/X/00PV.smali')
          lines=p.read_text().splitlines()
          if any('hdrCandidateR6' in l or 'hdrSelectedR6' in l for l in lines): raise SystemExit('R6 helper exists')

          needle='.method public final A0f(LX/03oR;LX/08ui;)I'
          starts=[i for i,l in enumerate(lines) if l.strip()==needle]
          if len(starts)!=1: raise SystemExit(f'A0f count={len(starts)}')
          s=starts[0]
          e=next(i for i in range(s+1,len(lines)) if lines[i].startswith('.end method'))
          out=[]; patched=0
          for l in lines[s:e+1]:
              if l.strip()=='return v0':
                  indent=l[:len(l)-len(l.lstrip())]
                  out.append(f'{indent}invoke-static {{p1, v0}}, LX/00PV;->hdrCandidateR6(LX/03oR;I)V')
                  patched+=1
              out.append(l)
          if patched!=2: raise SystemExit(f'A0f return paths={patched}')
          lines[s:e+1]=out

          sig='A0n(LX/00R5;LX/03oR;Landroid/media/MediaFormat;LX/02V3;LX/03bG;LX/06d3;Ljava/util/ArrayList;Ljava/util/ArrayList;Ljava/util/Map;Z)Ljava/util/ArrayList;'
          starts=[i for i,l in enumerate(lines) if l.startswith('.method') and sig in l]
          if len(starts)!=1: raise SystemExit(f'A0n count={len(starts)}')
          s=starts[0]
          e=next(i for i in range(s+1,len(lines)) if lines[i].startswith('.end method'))
          directive=next(i for i in range(s+1,min(s+14,e)) if lines[i].strip().startswith(('.registers','.locals')))
          lines[directive+1:directive+1]=[
            '',
            '    invoke-static {p2}, LX/00PV;->hdrSelectedR6(LX/03oR;)V',
            ''
          ]

          helper=[
            '',
            '.method private static hdrCandidateR6(LX/03oR;I)V',
            '    .registers 7',
            '    if-eqz p0, :done_c',
            '    iget-object v0, p0, LX/03oR;->A0b:Ljava/lang/String;',
            '    if-eqz v0, :done_c',
            '    const-string v1, "video/"',
            '    invoke-virtual {v0, v1}, Ljava/lang/String;->startsWith(Ljava/lang/String;)Z',
            '    move-result v1',
            '    if-eqz v1, :done_c',
            '    invoke-static {p0}, LX/03oR;->A00(LX/03oR;)Ljava/lang/String;',
            '    move-result-object v2',
            '    new-instance v3, Ljava/lang/StringBuilder;',
            '    invoke-direct {v3}, Ljava/lang/StringBuilder;-><init>()V',
            '    const-string v4, "support="',
            '    invoke-virtual {v3, v4}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;',
            '    invoke-virtual {v3, p1}, Ljava/lang/StringBuilder;->append(I)Ljava/lang/StringBuilder;',
            '    const-string v4, " "',
            '    invoke-virtual {v3, v4}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;',
            '    invoke-virtual {v3, v2}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;',
            '    invoke-virtual {v3}, Ljava/lang/Object;->toString()Ljava/lang/String;',
            '    move-result-object v2',
            '    const-string v3, "IG_HDR_R6_CAND"',
            '    invoke-static {v3, v2}, Landroid/util/Log;->i(Ljava/lang/String;Ljava/lang/String;)I',
            ':done_c',
            '    return-void',
            '.end method',
            '',
            '.method private static hdrSelectedR6(LX/03oR;)V',
            '    .registers 3',
            '    if-eqz p0, :done_s',
            '    invoke-static {p0}, LX/03oR;->A00(LX/03oR;)Ljava/lang/String;',
            '    move-result-object v0',
            '    const-string v1, "IG_HDR_R6_SELECTED"',
            '    invoke-static {v1, v0}, Landroid/util/Log;->i(Ljava/lang/String;Ljava/lang/String;)I',
            ':done_s',
            '    return-void',
            '.end method',
            ''
          ]
          lines += helper
          p.write_text('\n'.join(lines)+'\n')
          PY
          java -jar work/smali-3.0.10-fat.jar a work/smali13 -o work/classes13-patched.dex

      - name: Repack align and sign with exact R8 key
        run: |
          set -euo pipefail
          cp "work/$BASE_APK" work/unsigned.apk
          zip -q -d work/unsigned.apk classes13.dex classes17.dex || true
          zip -q -d work/unsigned.apk 'META-INF/*' || true
          cp work/classes13-patched.dex work/classes13.dex
          cp work/classes17-patched.dex work/classes17.dex
          (cd work && zip -q -0 unsigned.apk classes13.dex classes17.dex)
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$ZIPALIGN" -f -p 4 work/unsigned.apk work/aligned.apk
          BCJAR="$(find /usr/share/java -maxdepth 1 -type f -name 'bcprov*.jar' | head -1)"
          test -n "$BCJAR"
          keytool -importkeystore -srckeystore ks.keystore -srcstoretype BKS -srcstorepass 123456789 -srcalias andrewliang -srckeypass 123456789 -destkeystore work/ks-r8.p12 -deststoretype PKCS12 -deststorepass 123456789 -destkeypass 123456789 -destalias andrewliang -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider -providerpath "$BCJAR" -noprompt
          java -jar bin/apksigner.jar sign --ks work/ks-r8.p12 --ks-type PKCS12 --ks-pass pass:123456789 --key-pass pass:123456789 --ks-key-alias andrewliang --out "out/$OUT_APK" work/aligned.apk
          rm -f "out/$OUT_APK.idsig"

      - name: Verify all R6 boundaries and signing identity
        run: |
          set -euo pipefail
          java -jar bin/apksigner.jar verify --verbose --print-certs "out/$OUT_APK" | tee out/verify.txt
          ORIG_CERT=$(java -jar bin/apksigner.jar verify --print-certs "work/$BASE_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          NEW_CERT=$(java -jar bin/apksigner.jar verify --print-certs "out/$OUT_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          printf 'original_cert=%s\nnew_cert=%s\n' "$ORIG_CERT" "$NEW_CERT" | tee out/cert-match.txt
          test -n "$ORIG_CERT" && test "$ORIG_CERT" = "$NEW_CERT"
          unzip -p "out/$OUT_APK" classes13.dex > work/verify13.dex
          unzip -p "out/$OUT_APK" classes17.dex > work/verify17.dex
          java -jar work/baksmali-3.0.10-fat.jar d work/verify13.dex -o work/verify13
          java -jar work/baksmali-3.0.10-fat.jar d work/verify17.dex -o work/verify17
          grep -q 'IG_HDR_R6_PARSE' work/verify17/X/09z5.smali
          grep -q 'IG_HDR_R6_A0B' work/verify17/X/09z5.smali
          grep -q 'IG_HDR_R6_A0C' work/verify17/X/09z5.smali
          grep -q 'IG_HDR_R6_CAND' work/verify13/X/00PV.smali
          grep -q 'IG_HDR_R6_SELECTED' work/verify13/X/00PV.smali
          printf 'parse=ok\na0b=ok\na0c=ok\ncandidate=ok\nselected=ok\n' | tee out/instrumentation.txt
          sha256sum "out/$OUT_APK" | tee out/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: instagram-hdr-test-r6
          path: |
            out/${{ env.OUT_APK }}
            out/sha256.txt
            out/verify.txt
            out/cert-match.txt
            out/instrumentation.txt
          retention-days: 14

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES='R6 one-shot observation-only diagnostic on exact Release 8 Instagram 439. One playback logs parsed DASH video representations before local filtering (IG_HDR_R6_PARSE), after A0b/A0c (IG_HDR_R6_A0B / IG_HDR_R6_A0C), real renderer candidates plus support code (IG_HDR_R6_CAND), and final selected X.03oR Format entering MediaFormat/codec construction (IG_HDR_R6_SELECTED). Original return values and selection are preserved. Same signing certificate as Release 8, verified.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/$OUT_APK" out/sha256.txt out/verify.txt out/cert-match.txt out/instrumentation.txt --clobber
            gh release edit "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "out/$OUT_APK" out/sha256.txt out/verify.txt out/cert-match.txt out/instrumentation.txt --title 'Instagram HDR Test R6' --notes "$NOTES" --prerelease
          fi
