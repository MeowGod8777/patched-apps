name: IG 439 AV1 Capability Keys

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-av1-capability-keys.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download and disassemble
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/dex work/dis research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          for d in work/dex/classes*.dex; do
            b="$(basename "$d" .dex)"
            "$DEXDUMP" -d -f -h "$d" > "work/dis/$b.txt"
          done
      - name: Extract AV1 capability keys and references
        run: |
          REPORT=research/generated/instagram_439_av1_capability_keys.txt
          {
            echo "Instagram 439 AV1 capability key trace"
            echo "======================================"
            echo
            echo "===== Literal AV1 capability keys ====="
            grep -aHn -Ei 'video_av1_[a-z0-9_]+|av1.*decoder.*supported|av1.*max_instances' work/dis/*.txt || true
            echo
            echo "===== Context around AV1 capability literals ====="
            grep -aHn -B 80 -A 120 -Ei 'video_av1_[a-z0-9_]+|av1.*decoder.*supported|av1.*max_instances' work/dis/*.txt || true
            echo
            echo "===== Raw DEX strings ====="
            for d in work/dex/classes*.dex; do strings "$d" | grep -Ei 'video_av1_[a-z0-9_]+|av1.*decoder.*supported|av1.*max_instances' || true; done | sort -u
          } > "$REPORT"
          cat "$REPORT"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/instagram_439_av1_capability_keys.txt
          if ! git diff --cached --quiet; then git commit -m "Trace Instagram 439 AV1 capability keys"; fi
          git pull --rebase origin main
          git push origin HEAD:main
