name: IG HDR Format Class Fast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-format-class-fast.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
      - name: Locate and extract exact class
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/dex work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          sudo apt-get update -qq && sudo apt-get install -y -qq smali
          unzip -j "work/$APK_NAME" 'classes*.dex' -d work/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -1)"
          target=''
          : > work/map.txt
          for d in work/dex/classes*.dex; do
            if "$DEXDUMP" -h "$d" 2>/dev/null | grep -q "Class descriptor  : 'LX/03oR;'"; then
              echo "03oR=$(basename "$d")" | tee -a work/map.txt
              target="$d"
            fi
            if "$DEXDUMP" -h "$d" 2>/dev/null | grep -q "Class descriptor  : 'LX/096x;'"; then
              echo "096x=$(basename "$d")" | tee -a work/map.txt
              [ -n "$target" ] || target="$d"
            fi
          done
          test -n "$target"
          baksmali d "$target" -o work/smali
          {
            cat work/map.txt
            echo
            for p in work/smali/X/03oR.smali work/smali/X/096x.smali; do
              [ -f "$p" ] || continue
              echo "===== $p ====="
              cat "$p"
              echo
            done
          } > research/generated/instagram_439_hdr_format_class_fast.txt
          wc -c research/generated/instagram_439_hdr_format_class_fast.txt
          cat research/generated/instagram_439_hdr_format_class_fast.txt
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_format_class_fast.txt
          git commit -m 'Fast locate Instagram DASH format class' || true
          git pull --rebase origin main
          git push origin HEAD:main
