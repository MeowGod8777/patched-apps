name: IG 439 HDR ClipsApi A06 Fast R19f

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-hdr-clips-api-a06-fast-r19f.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: instagram-piko-v439.0.0.37.89-arm64-v8a.apk
      APK_SHA256: 4015b171ac59f3e7172134d194ec2dcf701f64c3339f127c19d7a04c13d529c8
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Fetch exact APK and locate only ClipsApiUtilHelper reference dexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work/apk work/smali research/generated
          gh release download 8 --pattern "$APK_NAME" --dir work
          echo "$APK_SHA256  work/$APK_NAME" | sha256sum -c -
          gh release download 3.0.10 --repo baksmali/smali --pattern 'baksmali-3.0.10-fat.jar' --dir work
          unzip -q "work/$APK_NAME" 'classes*.dex' -d work/apk
          : > work/hitdex.txt
          for d in work/apk/classes*.dex; do
            if strings -a "$d" | grep -Fq 'Lcom/instagram/clips/api/ClipsApiUtilHelper;'; then
              basename "$d" >> work/hitdex.txt
            fi
          done
          echo 'HITDEX:'; cat work/hitdex.txt
          while read d; do
            [ -n "$d" ] || continue
            n="${d%.dex}"
            java -jar work/baksmali-3.0.10-fat.jar d "work/apk/$d" -o "work/smali/$n" >/dev/null &
          done < work/hitdex.txt
          wait
      - name: Dump exact A06 and callers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('work/smali')
          out=Path('research/generated/instagram_439_hdr_clips_api_a06_fast_r19f.txt')
          target_cls='Lcom/instagram/clips/api/ClipsApiUtilHelper;'
          O=['Instagram 439 HDR ClipsApiUtilHelper A06 Fast R19f','================================================','']

          def get_cls(p):
            for x in p.read_text(errors='replace').splitlines()[:30]:
              m=re.match(r'^\.class\s+.*\s+(L[^;]+;)$',x)
              if m:return m.group(1)
            return '?'
          def methods(p):
            ls=p.read_text(errors='replace').splitlines(); i=0
            while i<len(ls):
              if not ls[i].startswith('.method'):
                i+=1; continue
              s=i; i+=1
              while i<len(ls) and not ls[i].startswith('.end method'):i+=1
              e=min(i,len(ls)-1); yield ls[s],ls[s:e+1];i+=1

          target_file=None
          for p in root.rglob('ClipsApiUtilHelper.smali'):
            target_file=p;break
          if target_file:
            for sig,b in methods(target_file):
              if ' A06(' in sig:
                t='\n'.join(b)
                ss=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',t)
                O += ['===== EXACT A06 =====',f'FILE={target_file}',f'STRINGS={ss}']+b+['']
                break

          callers=[]
          for p in root.rglob('*.smali'):
            cls=get_cls(p)
            for sig,b in methods(p):
              t='\n'.join(b)
              # exact A06 invocation, tolerate obfuscated invoke formatting
              if re.search(r'Lcom/instagram/clips/api/ClipsApiUtilHelper;->A06\(Lcom/instagram/common/session/UserSession;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;I\)LX/02ue;',t):
                ss=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',t)
                rel=[s for s in ss if any(k in s.lower() for k in ('clip','reel','feed','media','dash','hdr','codec','quality','playback','session','module','rank','source','request'))]
                callers.append((cls,sig,str(p),rel,b))
          O += [f'===== DIRECT CALLERS ({len(callers)}) =====','']
          for cls,sig,p,rel,b in callers:
            O += [f'--- {cls} {sig}',f'FILE={p}',f'RELEVANT_STRINGS={rel}']+b+['']

          # Also list any method that references the class and has endpoint/request builder terms.
          O += ['===== NEARBY CLASS-REF REQUEST METHODS =====','']
          for p in root.rglob('*.smali'):
            cls=get_cls(p)
            for sig,b in methods(p):
              t='\n'.join(b); low=t.lower()
              if target_cls.lower() in low and ('lx/03u7;->' in low or 'clips/' in low or 'reels/' in low):
                ss=re.findall(r'const-string(?:/jumbo)?\s+[^,]+,\s+"([^"]*)"',t)
                O += [f'--- {cls} {sig}',f'FILE={p}',f'STRINGS={ss}']+b+['']
          out.write_text('\n'.join(O),encoding='utf-8')
          print('\n'.join(O))
          PY
      - name: Commit R19f report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/instagram_439_hdr_clips_api_a06_fast_r19f.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add fast ClipsApiUtilHelper A06 caller trace R19f'
            git pull --rebase origin main
            git push origin HEAD:main
          fi